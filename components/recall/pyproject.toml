[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-recall"
version = "0.1.0"
description = "Portable conversation search and versioned memory storage"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["amplifier_recall"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-workspace-metadata"
version = "0.1.0"
description = "Workspace registration metadata over caller-owned records"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["amplifier_workspace_metadata"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

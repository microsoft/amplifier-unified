[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-status-emitter"
version = "0.1.0"
description = "Standalone read-only local Amplifier status publisher, consumer and optional hook"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
amplifier-status = "amplifier_status.cli:main"

[project.entry-points."amplifier.modules"]
hooks-status-emitter = "amplifier_status.hook:mount"

[tool.setuptools]
packages = ["amplifier_status"]
package-dir = {"amplifier_status" = "."}
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

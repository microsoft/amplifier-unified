[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="amplifier-unified-publishing"
version="0.1.0"
requires-python=">=3.11"
license="MIT"
license-files=["LICENSE"]
dependencies=["amplifier-operations>=0.1.0","amplifier-publishing==0.1.1","jsonschema>=4.23,<5","filelock>=3.20,<4"]
[project.scripts]
amplifier-unified-publishing="amplifier_unified_publishing.server:main"
[tool.hatch.build.targets.wheel]
packages=["amplifier_unified_publishing"]
[tool.uv.sources]
amplifier-publishing={git="https://github.com/microsoft/amplifier-publishing",branch="main"}
amplifier-operations={git="https://github.com/microsoft/amplifier-foundation",branch="main",subdirectory="libraries/operations"}
[dependency-groups]
dev=["pytest>=8","pytest-asyncio>=0.25"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]

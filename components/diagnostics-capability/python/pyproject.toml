[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"
[project]
name="amplifier-unified-diagnostics"
version="0.1.0"
requires-python=">=3.11"
license="MIT"
dependencies=["amplifier-operations>=0.1.0","amplifier-bundle-context-intelligence[client]>=0.2.0"]
[project.scripts]
amplifier-unified-diagnostics="amplifier_unified_diagnostics.server:main"
[project.optional-dependencies]
test=["pytest>=8","pytest-asyncio>=0.24"]
[tool.hatch.build.targets.wheel]
packages=["amplifier_unified_diagnostics"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
[tool.uv.sources]
amplifier-operations={git="https://github.com/microsoft/amplifier-foundation",branch="main",subdirectory="libraries/operations"}
amplifier-bundle-context-intelligence={git="https://github.com/microsoft/amplifier-bundle-context-intelligence",branch="main"}

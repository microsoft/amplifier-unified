[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amplifier-unified-workspaces"
version = "0.1.0"
description = "Durable workspace placement and association owner for Amplifier Unified"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["amplifier-operations>=0.1.0", "filelock>=3.16", "PyYAML>=6"]

[project.scripts]
amplifier-unified-workspaces = "amplifier_unified_workspaces.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["amplifier_unified_workspaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
amplifier-operations = { git = "https://github.com/microsoft/amplifier-foundation", branch = "main", subdirectory = "libraries/operations" }

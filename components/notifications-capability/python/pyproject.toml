[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"
[project]
name="amplifier-unified-notifications"
version="0.1.0"
requires-python=">=3.11"
license="MIT"
dependencies=["amplifier-operations>=0.1.0","aiohttp>=3.12,<4"]
[project.scripts]
amplifier-unified-notifications="amplifier_unified_notifications.server:main"
[project.optional-dependencies]
test=["pytest>=8","pytest-asyncio>=0.24"]
[tool.hatch.build.targets.wheel]
packages=["amplifier_unified_notifications"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
[tool.uv.sources]
amplifier-operations={git="https://github.com/microsoft/amplifier-foundation",branch="main",subdirectory="libraries/operations"}

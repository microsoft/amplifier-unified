[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="amplifier-unified-recall"
version="0.1.0"
requires-python=">=3.11"
license="MIT"
dependencies=["amplifier-recall==0.1.0","jsonschema>=4.23,<5","filelock>=3.20,<4"]
[project.scripts]
amplifier-unified-recall="amplifier_unified_recall.server:main"
[tool.hatch.build.targets.wheel]
packages=["amplifier_unified_recall"]
[dependency-groups]
dev=["pytest>=8","pytest-asyncio>=0.25"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]

[tool.uv.sources]
amplifier-recall={git="https://github.com/microsoft/amplifier-foundation",branch="main",subdirectory="libraries/recall"}

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-outputs"
version = "0.1.0"
description = "Portable output relationships and read-only Git review evidence"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools]
packages = ["amplifier_outputs"]
include-package-data = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

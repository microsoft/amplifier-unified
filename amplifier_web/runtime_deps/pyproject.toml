[project]
name = "amplifier-web-runtime"
version = "0.1.0"
description = "Standalone Foundation and loop-live runtime for Amplifier Unified"
requires-python = ">=3.13"
dependencies = [
  "amplifier-core==1.6.1",
  "amplifier-module-loop-live",
  "amplifier-foundation",
  "amplifier-module-loop-streaming",
  "amplifier-module-context-simple",
  "amplifier-module-provider-anthropic",
  "amplifier-module-provider-openai",
  "amplifier-module-provider-openai-chatgpt",
  "amplifier-module-provider-github-copilot",
  "amplifier-module-provider-gemini",
  "websockets==15.0.1",
  "filelock>=3.20,<4",
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.3,<7",
]

[tool.uv]
# Keep Foundation at the reviewed host API revision while bundles resolve their modules.
override-dependencies = [
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@695f875c0908f45f8dc78b1fcde80ecddebffd7c",
]

[tool.uv.sources]
amplifier-module-loop-live = { git = "https://github.com/bkrabach/amplifier-module-loop-live", rev = "7a2a9b9ed0ddf2f1927f5d0e7aba42698c1e4c8d" }
amplifier-foundation = { git = "https://github.com/microsoft/amplifier-foundation", rev = "695f875c0908f45f8dc78b1fcde80ecddebffd7c" }
amplifier-module-loop-streaming = { git = "https://github.com/microsoft/amplifier-module-loop-streaming", rev = "603aa6eefacd28367fc886d58eb89de993c58dea" }
amplifier-module-context-simple = { git = "https://github.com/microsoft/amplifier-module-context-simple", rev = "2bc8b15770f4ecb49bd6216a8b5336e9c36adfc6" }
amplifier-module-provider-anthropic = { git = "https://github.com/microsoft/amplifier-module-provider-anthropic", rev = "12fffb6ad2bafb1bb7999ab02245a35e42ca8672" }
amplifier-module-provider-openai = { git = "https://github.com/microsoft/amplifier-module-provider-openai", rev = "c9b0e8e60702269c7a637875b89d011facfde020" }
amplifier-module-provider-openai-chatgpt = { git = "https://github.com/microsoft/amplifier-module-provider-openai-chatgpt", rev = "b522d4fb57b8c5aebd03cb4cf4eacb7d5e64bd19" }

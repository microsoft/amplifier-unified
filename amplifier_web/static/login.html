<div class="brand"><img src="/branding/icons/amplifier-icon-128.png" alt="" width="44" height="44"><span>Amplifier</span></div>
<h1>Welcome back</h1><p>Sign in with the system account on the computer running Amplifier.</p>
<p class="error" role="alert">__ERROR__</p>
<form method="post" action="/login?next=__NEXT__"><input type="hidden" name="csrf" value="__CSRF__">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
<label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form>
<p class="note">Use your host computer’s login, rather than a model provider API key.</p>
</main></body></html>

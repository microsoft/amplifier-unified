[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-kernels"
version = "0.1.0"
description = "Persistent computation through owned process and observation interfaces"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools]
packages = ["amplifier_kernels"]
package-dir = {amplifier_kernels = "."}
include-package-data = false

[tool.setuptools.package-data]
amplifier_kernels = ["node_runner.cjs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

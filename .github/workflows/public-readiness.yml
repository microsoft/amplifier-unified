name: Public readiness
on:
  workflow_dispatch:
    inputs:
      installed_media_diagnostic:
        description: Run only the full installed-media diagnostic on its pinned product baseline
        type: boolean
        default: false
  workflow_call:
    inputs:
      revision:
        description: Exact release revision to qualify
        type: string
        required: true
permissions:
  contents: read
jobs:
  critical:
    if: ${{ !inputs.installed_media_diagnostic }}
    name: Recovery and first-use checks
    runs-on: ubuntu-latest
    # This is exhaustive background verification, not the publication gate.
    # Release 0.20.169 reached the final feedback check at 24m55s and exhausted
    # the former 25-minute job budget without a test assertion failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --group artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Recovery, authentication, repair and diagnostics
        run: >-
          uv run --no-sync pytest -q --tb=short
          tests/test_service.py tests/test_client_layout.py tests/test_browser_detail.py tests/test_execution.py tests/test_cold_execution_compaction.py
          tests/test_bundle_selection.py tests/test_worker_install_overrides.py
          tests/test_worker_diagnostics.py tests/test_session_health.py tests/test_runtime.py tests/test_coordination_wait_transport.py tests/test_request_recovery.py
          tests/test_worker_background_naming.py tests/test_agent_canvas_scope.py tests/test_client_navigation.py tests/test_live_clients.py
          tests/test_history_revision.py tests/test_session_fork.py tests/test_fork_input_boundaries.py
          tests/test_conversation_navigation.py tests/test_delegate_exchange.py tests/test_peer_attribution.py tests/test_active_client_projections.py tests/test_event_log_view.py
          tests/test_conversation_export.py tests/test_history_query.py tests/test_voice_input_projection.py tests/test_voice.py tests/test_portability_voice.py
          tests/test_questions.py tests/test_auth.py tests/test_browser_auth.py tests/test_server_auth.py tests/test_browser_events.py tests/test_companion.py tests/test_client_observations.py
          tests/test_reset.py tests/test_repository_access.py tests/test_friendly_reset.py tests/test_feedback_diagnostics.py
          tests/test_update_replacement.py tests/test_update_readiness.py tests/test_update_drain.py tests/test_deployment_service.py
          tests/test_release_qualification.py tests/test_release_automation.py tests/test_release_notes.py
      - name: Check chat naming and internal terminal sessions
        run: uv run --no-sync pytest -q tests/test_automatic_naming.py tests/test_chat_title_preview.py tests/test_naming_backfill.py tests/test_fallback_titles.py tests/test_naming.py tests/test_naming_controls.py tests/test_headless.py tests/test_automatic_history.py tests/test_provider_probe.py tests/test_setup.py tests/test_image_setup.py tests/test_image_defaults.py tests/test_provider_environment.py tests/test_readiness101.py tests/test_installer_script.py tests/test_host_dependencies.py
      - name: Check demand-scoped catalogs and retained worker evidence
        run: uv run --no-sync pytest -q tests/test_chat_demand.py tests/test_browser_demand.py tests/test_provider_catalog.py tests/test_provider_publication.py tests/test_conversation_models.py
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Install browser
        id: browser_runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare owned browser evidence
        id: browser_evidence
        run: |
          artifact_dir="$RUNNER_TEMP/public-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$artifact_dir"
          echo "AMPLIFIER_TEST_ARTIFACTS=$artifact_dir" >> "$GITHUB_ENV"
      - name: Exercise real UI and API recovery paths
        working-directory: frontend
        run: |
          node tests/imported-naming-browser.mjs
          node tests/recovery-group-browser.mjs
          node tests/error-details-browser.mjs
          node tests/chat-menu-browser.mjs
          node tests/chat-search-browser.mjs
          node tests/setup-journey-browser.mjs
          node tests/composer-options-browser.mjs
          node tests/chat-demand-browser.mjs
          node tests/message-render-stability-browser.mjs
          node tests/delegate-activity-browser.mjs
          node tests/main-refresh-browser.mjs
          node tests/document-card-browser.mjs
          node tests/chat-plan-browser.mjs
          node tests/questions-browser.mjs
          node tests/public-first-chat-browser.mjs
          node tests/settings-everyday-browser.mjs
          node tests/update-progress-browser.mjs
          node tests/image-connection-browser.mjs
          node tests/foreground-stream-browser.mjs
          node tests/chat-scroll-browser.mjs
          node tests/pwa-browser.mjs
          node tests/companion-browser.mjs
          node tests/observations-browser.mjs
      - name: Check voice view and reading positions
        working-directory: frontend
        run: |
          node tests/voice-follow-latest-browser.mjs
          node tests/dictation-browser.mjs
          node tests/chat-scroll-return-browser.mjs
      - name: Check activity feedback and appearance preferences
        working-directory: frontend
        run: |
          node tests/appearance-save-feedback-browser.mjs
          node tests/appearance-preview-navigation-browser.mjs
          node tests/theme-surfaces-browser.mjs
          node tests/settings-save-feedback-browser.mjs
          node tests/location-feedback-browser.mjs
          node tests/permissions-feedback-browser.mjs
          node tests/diagnostics-feedback-browser.mjs
      - name: Check full-history conversation navigation
        working-directory: frontend
        run: |
          node tests/retained-history-browser.mjs
      - name: Check rendered block and saved source copying
        working-directory: frontend
        run: node ../tests/block-copy-browser.mjs
      - name: Check embedded diagram scrolling
        working-directory: frontend
        run: node tests/embedded-diagram-layout-browser.mjs
      - name: Check exact inline artifacts and image follow-ups
        run: |
          uv run --no-sync pytest -q tests/test_inline_artifacts.py tests/test_canvas_downloads.py tests/test_canvas_files.py tests/test_canvas_pdf.py tests/test_canvas_draft.py tests/test_canvas_views.py tests/test_canvas_versions.py tests/test_image_generation_ui.py tests/test_image_results.py tests/test_generated_images.py tests/test_output_images.py
          cd frontend
          node tests/inline-artifacts-browser.mjs
          node tests/canvas-usability-browser.mjs
          node tests/pdf-browser.mjs
          node tests/generated-images-browser.mjs
      - name: Check canonical media and transaction ownership regressions
        run: uv run --no-sync pytest -q tests/test_output_media.py tests/test_resource_files.py tests/test_portability_outputs.py tests/test_shell_modules.py
      - name: Check retained inline media in installed package
        # A required backend failure must not conceal independent phase and
        # physical evidence. It still fails the job and source recording gate.
        if: ${{ !cancelled() && steps.browser_runtime.outcome == 'success' }}
        env:
          INLINE_MEDIA_EVIDENCE_DIR: ${{ runner.temp }}/inline-media-proof
          INLINE_MEDIA_MP4: ${{ runner.temp }}/inline-media-proof/synthetic.mp4
          INLINE_MEDIA_MODE: installed
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall .
          mkdir -p "$INLINE_MEDIA_EVIDENCE_DIR"
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          # Bundled Chromium supports VP9 in MP4 without a proprietary H264
          # decoder. External CC0 H264 receiving samples still use the env path.
          ffmpeg -v error -f lavfi -i testsrc=size=64x48:rate=10 -t 2 -c:v libvpx-vp9 -tag:v vp09 -pix_fmt yuv420p -an "$INLINE_MEDIA_MP4"
          PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" node frontend/tests/inline-media-browser.mjs
      - name: Gate public inline media evidence
        id: media_evidence
        if: always()
        env:
          INLINE_MEDIA_EVIDENCE_DIR: ${{ runner.temp }}/inline-media-proof
        run: |
          python - <<'PY'
          import json, os, re, socket
          from pathlib import Path
          root = Path(os.environ['INLINE_MEDIA_EVIDENCE_DIR'])
          pending = []
          if (root / 'result.json').exists():
              result = json.loads((root / 'result.json').read_text())
              pending = [{**row, 'status': 'NOT_QUALIFIED'} for row in result['remainingPhysical']]
              (root / 'physical-acceptance.json').write_text(json.dumps({
                  'status': result['physicalChecks'], 'remainingPhysical': pending,
                  'scope': 'Core CI regression is not full issue acceptance'}, indent=2))
          paths = list(root.glob('*.json'))
          assert paths, 'No media evidence to publish'
          private = [str(Path.home()), socket.gethostname(), os.environ['GITHUB_WORKSPACE']]
          for path in paths:
              text = path.read_text()
              assert not any(value in text for value in private), 'Private identity remains; media upload blocked'
              assert not re.search(r'/home/|/Users/|[A-Za-z]:\\Users\\', text), 'Private path remains; media upload blocked'
          if (root / 'result.json').exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Inline media physical acceptance\n')
                  summary.write('Core CI is not full #319 acceptance.\n\n')
                  for row in pending:
                      line = f"- {row['phase']}: NOT_QUALIFIED — {row.get('reason', 'Physical check remains unobserved')}"
                      summary.write(line + '\n')
                      print(f"::notice title=Inline media physical acceptance::{row['phase']}: NOT_QUALIFIED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.media_evidence.outcome == 'success'
        with:
          name: inline-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/inline-media-proof/*.json
            ${{ runner.temp }}/inline-media-proof/*.png
          if-no-files-found: error
      - name: Check immediate chat recency and receipt ownership
        run: |
          uv run --no-sync pytest -q tests/test_chat_navigation.py tests/test_message_delivery.py tests/test_collaborative_workspaces.py tests/test_session_warmup.py
          cd frontend
          AMPLIFIER_HUMAN_POST_ONLY=1 node tests/sidebar-activity-browser.mjs
      - name: Check pending message edits and recovery
        working-directory: frontend
        run: |
          node tests/message-outbox-browser.mjs
          node tests/update-message-delivery-browser.mjs
          node tests/support-diagnostics-browser.mjs
          node tests/multiple-window-stream-browser.mjs
      - name: Check workspace storage, unread state, plans and formatted copy
        run: |
          uv run --no-sync pytest -q tests/test_storage_usage.py tests/test_storage_scan.py tests/test_storage_workspace_scope.py tests/test_configuration_target.py tests/test_history_cleanup.py tests/test_canvas_paths.py tests/test_chat_plan.py tests/test_completion_attention.py tests/test_workspace_navigation.py tests/test_schedules.py
          cd frontend
          node tests/attention-inbox-browser.mjs
          node tests/workspace-switching-browser.mjs
          node tests/readiness102-browser.mjs
          CHROMIUM_SINGLE_PROCESS=0 node tests/canonical-work-browser.mjs
          node tests/readiness102-workspace-browser.mjs
          node tests/storage-history-browser.mjs
          node tests/feedback-browser.mjs
      - name: Check reviewed feedback attachment recovery
        run: |
          uv run --no-sync pytest -q tests/test_feedback_additions.py tests/test_feedback_followup.py tests/test_feedback_attachments.py
          cd frontend
          node tests/feedback-additions-browser.mjs
      - name: Gate full-scenario core inline media regression
        if: always()
        env:
          INLINE_MEDIA_EVIDENCE_DIR: ${{ runner.temp }}/inline-media-proof
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['INLINE_MEDIA_EVIDENCE_DIR']) / 'result.json').read_text())
          assert result['fullScenario'] and result['coreChecks'] == 'PASS', 'Core inline media scenario is not qualified'
          # Physical/platform acceptance is reported explicitly in the media
          # artifact and step summary. Unsupported sensors do not become PASS;
          # required failures still fail the browser process and this core gate.
          for row in result['remainingPhysical']:
              assert row['status'] == 'NOT_QUALIFIED'
          PY
      - name: Record qualified source
        if: success()
        run: git rev-parse HEAD > public-readiness-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-readiness-${{ github.run_id }}
          path: |
            public-readiness-revision.txt
            /tmp/unified-block-copy-trace.zip
            /tmp/unified-recovery-group-mobile.png
            /tmp/amplifier-updates-calm-feedback.png
            /tmp/unified-generated-images-mobile.png
            /tmp/unified-storage-overview.png
            /tmp/unified-storage-category.png
            /tmp/unified-storage-mobile.png
          if-no-files-found: ignore
      - name: Upload owned browser evidence
        if: always() && steps.browser_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-readiness-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AMPLIFIER_TEST_ARTIFACTS }}/
          if-no-files-found: warn
  installed-media-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_media_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INLINE_MEDIA_MODE: installed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the original product inputs
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'.github/workflows/public-readiness.yml',
                     'frontend/tests/inline-media-browser.mjs',
                     'tests/test_release_qualification.py'}
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only', '-z',
              'a5d1ab2397a00f76495c591835b5c9194e09f5a8', 'HEAD'], text=True).split('\0')) - {''}
          assert changed <= allowed, sorted(changed - allowed)
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          PY
      - name: Initialize owned diagnostic paths
        shell: bash
        run: |
          printf '%s\n' \
            "INLINE_MEDIA_EVIDENCE_DIR=$RUNNER_TEMP/inline-media-diagnostic" \
            "INLINE_MEDIA_MP4=$RUNNER_TEMP/inline-media-diagnostic/synthetic.mp4" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --group artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Bind the diagnostic to the original production build
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          static = Path('amplifier_web/static')
          build = json.loads((static / 'build.json').read_text())
          assert build == {'version': '0.20.176', 'id': 'e4a71c46fd41ecf6'}, build
          assert not any(path.is_symlink() for path in static.rglob('*'))
          files = {str(path.relative_to(static)): hashlib.sha256(path.read_bytes()).hexdigest()
                   for path in sorted(static.rglob('*')) if path.is_file()}
          payload = hashlib.sha256()
          for name, digest in sorted(files.items()):
              payload.update(name.encode() + b'\0' + digest.encode() + b'\n')
          # Exact membership and bytes from successful artifact12121555367,
          # not merely the builder's shorter input-derived identifier.
          assert len(files) == 311
          assert payload.hexdigest() == '1b4c114ffe44d4c7a5dcf8a2136fb363847feb4ec4b27aa5bbc5fe2435deb337'
          output = Path(os.environ['INLINE_MEDIA_EVIDENCE_DIR'])
          output.mkdir(parents=True, exist_ok=True)
          record = {'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'productBaseline': 'a5d1ab2397a00f76495c591835b5c9194e09f5a8',
                    'runId': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'build': build, 'staticSha256': files, 'payloadSha256': payload.hexdigest()}
          (output / 'source-build-identity.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Install the same browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the entire installed-media scenario once
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall .
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -v error -f lavfi -i testsrc=size=64x48:rate=10 -t 2 -c:v libvpx-vp9 -tag:v vp09 -pix_fmt yuv420p -an "$INLINE_MEDIA_MP4"
          PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" node frontend/tests/inline-media-browser.mjs
      - name: Gate sanitized bounded diagnostic evidence
        id: diagnostic-evidence
        if: always()
        run: |
          python - <<'PY'
          import json, os, re, socket
          from pathlib import Path
          root = Path(os.environ['INLINE_MEDIA_EVIDENCE_DIR'])
          paths = list(root.glob('*.json'))
          assert paths, 'No diagnostic evidence'
          private = [str(Path.home()), socket.gethostname(), os.environ['GITHUB_WORKSPACE']]
          for path in paths:
              text = path.read_text()
              assert not any(value in text for value in private), 'Private identity; upload refused'
              assert not re.search(r'/home/|/Users/|[A-Za-z]:\\Users\\', text), 'Private path; upload refused'
          if (root / 'result.json').is_file():
              result = json.loads((root / 'result.json').read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('Full installed-media diagnostic only, not Public readiness.\n')
                  out.write('Core: ' + result['coreChecks'] + '; physical: ' + result['physicalChecks'] + '\n')
          PY
      - name: Retain only sanitized JSON and synthetic screenshots
        if: always() && steps.diagnostic-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-media-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inline-media-diagnostic/*.json
            ${{ runner.temp }}/inline-media-diagnostic/*.png
          if-no-files-found: error
      - name: Require complete core scenario
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['INLINE_MEDIA_EVIDENCE_DIR']) / 'result.json').read_text())
          assert result['fullScenario'] and result['coreChecks'] == 'PASS'
          assert all(row['status'] == 'NOT_QUALIFIED' for row in result['remainingPhysical'])
          PY

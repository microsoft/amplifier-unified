# TEMPORARY experiment of worker 9564d6bf. Remove before review; never merge.
# Question: when a root certificate is absent from the Windows store, does the
# update check's request (aiohttp, default trust) fail although Windows itself
# can fetch that root? Every FAILED line is data, not a job failure.
name: TEMPORARY update-check trust probe
on:
  push:
    branches:
      - windows-ootb/update-check-current
    paths:
      - .github/workflows/tmp-update-check-trust-probe.yml
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the app's HTTP client and both root-certificate packages
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --only-binary=:all: "aiohttp==3.14.4" "certifi" "truststore==0.10.4"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Write the probe
        shell: python
        run: |
          import os
          import pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "probe.py").write_text(r'''
          import asyncio
          import ssl
          import sys

          URL = "https://pypi.org/pypi/amplifier-core/json"
          label, mode = sys.argv[1], sys.argv[2]


          def describe(error):
              chain = []
              while error is not None and len(chain) < 4:
                  chain.append(f"{type(error).__name__}: {str(error)[:160]}")
                  error = error.__cause__ or error.__context__
              return " <- ".join(chain)


          def store(name):
              names = []
              for row in ssl.create_default_context().get_ca_certs():
                  subject = {key: value for part in row.get("subject", ()) for key, value in part}
                  names.append(subject.get("organizationalUnitName") or subject.get("commonName") or "?")
              wanted = sorted(item for item in names if "GlobalSign" in item)
              print(f"{name}: Python sees {len(names)} trusted certificates; GlobalSign: {wanted or 'NONE'}", flush=True)


          if mode == "store":
              store(label)
              sys.exit(0)

          import aiohttp  # The default trust list of aiohttp is built here, once.


          def context(kind):
              if kind == "certifi":
                  import certifi
                  value = ssl.create_default_context()
                  value.load_verify_locations(certifi.where())
                  return value
              if kind == "truststore":
                  import truststore
                  return truststore.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              return None


          async def get(name, kind):
              try:
                  value = context(kind)
                  async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=30)) as client:
                      async with client.get(URL, **({"ssl": value} if value is not None else {})) as response:
                          response.raise_for_status()
                          version = (await response.json())["info"]["version"]
                          print(f"{name}: OK version={version}", flush=True)
              except Exception as error:  # noqa: BLE001 -- every failure class is data
                  print(f"{name}: FAILED {describe(error)}", flush=True)


          async def main():
              if mode == "frozen":
                  await get(label + "a default trust, root absent at import", "default")
                  await get(label + "b Windows chain engine (truststore), same process", "truststore")
                  store(label + "c store read by a new context, same process")
                  await get(label + "d default trust again, SAME process", "default")
              else:
                  await get(label, mode)


          asyncio.run(main())
          ''', encoding="utf-8")
      - name: Before the removal
        shell: pwsh
        run: |
          python "$env:RUNNER_TEMP\probe.py" "01 store before" store
          python "$env:RUNNER_TEMP\probe.py" "02 app request (default trust) before" default
      - name: Remove the GlobalSign roots from the machine store, then repeat
        shell: pwsh
        run: |
          function Remove-GlobalSign {
            foreach ($store in 'Cert:\LocalMachine\Root', 'Cert:\LocalMachine\AuthRoot') {
              Get-ChildItem $store | Where-Object { $_.Subject -match 'GlobalSign' } | ForEach-Object {
                Write-Output "removed from ${store}: $($_.Thumbprint) $($_.Subject)"
                Remove-Item -Path $_.PSPath -Force
              }
            }
          }
          Remove-GlobalSign
          python "$env:RUNNER_TEMP\probe.py" "04 store after removal" store
          python "$env:RUNNER_TEMP\probe.py" "05 app request (default trust), root absent" default
          python "$env:RUNNER_TEMP\probe.py" "06 Windows store plus bundled roots (certifi)" certifi
          python "$env:RUNNER_TEMP\probe.py" "07 store after the bundled-roots request" store
          python "$env:RUNNER_TEMP\probe.py" "08 Windows chain engine (truststore)" truststore
          python "$env:RUNNER_TEMP\probe.py" "09 store after the Windows request" store
          python "$env:RUNNER_TEMP\probe.py" "10 app request (default trust), new process" default
          Write-Output "--- second removal, then one long-lived process"
          Remove-GlobalSign
          python "$env:RUNNER_TEMP\probe.py" "11 store after second removal" store
          python "$env:RUNNER_TEMP\probe.py" "12" frozen
          python "$env:RUNNER_TEMP\probe.py" "13 app request (default trust), new process" default
          exit 0

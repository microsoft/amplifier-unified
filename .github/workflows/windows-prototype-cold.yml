name: Experimental Windows prerequisite bootstrap

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full reviewed driver commit (must equal the dispatched checkout SHA)
        type: string
        required: true
      manifest_url:
        description: Exact already-published experimental windows-prototype.json HTTPS asset URL
        type: string
        required: true
      manifest_sha256:
        description: Reviewed manifest SHA-256 (this driver refuses any other candidate)
        type: string
        required: true

permissions:
  contents: read

jobs:
  real-prerequisite-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      COLD_EXPECTED_HEAD: ${{ inputs.expected_head }}
      COLD_MANIFEST_URL: ${{ inputs.manifest_url }}
      COLD_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Controller only. This Python, Git and other developer tools never enter
      # the installer's allowlisted environment or restricted child PATH.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Run one owned real installer with no app launch
        timeout-minutes: 22
        # No built-in PowerShell wrapper and no execution-policy override.
        shell: python -I -S -B {0}
        run: |
          import runpy, sys
          sys.argv = ['tests/fixtures/windows_prototype_cold.py']
          runpy.run_path(sys.argv[0], run_name='__main__')
      - name: Retain only fixed-field sanitized qualification facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-prototype-cold-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unified-prototype-cold/result.json
          if-no-files-found: error
          retention-days: 7

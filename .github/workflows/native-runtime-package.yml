name: Native runtime package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - components/native-runtime/**
      - .github/workflows/native-runtime-package.yml
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_NO_BUILD_PACKAGE: amplifier-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Build the independent producer and install its wheel
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/native-runtime-package"
          uv build --project components/native-runtime --out-dir "$package_root/dist"
          uv venv "$package_root/check"
          wheels=("$package_root"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python "$package_root/check/bin/python" "${wheels[0]}" pytest pytest-asyncio
          uv pip freeze --python "$package_root/check/bin/python" > "$package_root/dependencies.txt"
          sha256sum "$package_root"/dist/* > "$package_root/artifacts.sha256"
      - name: Exercise only the installed lifecycle package
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/native-runtime-package"
          cp -R components/native-runtime/tests "$package_root/tests"
          cd "$package_root"
          check/bin/python -m pytest -q -o asyncio_mode=auto tests --junitxml=tests.xml
      - name: Retain focused package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-runtime-package
          path: |
            ${{ runner.temp }}/native-runtime-package/dependencies.txt
            ${{ runner.temp }}/native-runtime-package/artifacts.sha256
            ${{ runner.temp }}/native-runtime-package/tests.xml
          retention-days: 7

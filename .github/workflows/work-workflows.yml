name: Work workflow integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: Fast release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Check release identity and post-release reporting contracts
        run: uv run --no-sync pytest -q tests/test_release_automation.py tests/test_release_qualification.py tests/test_goal_peer_junit.py tests/test_post_release_checks.py
      # Full Python and browser coverage runs locally and after publication.
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --exit-code -- amplifier_web/static
      # Browser coverage is available in browser-checks.yml (manual only).

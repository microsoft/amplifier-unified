name: Work workflow integration
on:
  pull_request:
    paths:
      - 'amplifier_*/**'
      - 'frontend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/work-workflows.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/browser-checks.yml'
      - 'scripts/release*.py'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Validate combined Python contracts
        run: uv run --no-sync pytest -q --tb=short
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --exit-code -- amplifier_web/static
      # Browser coverage is available in browser-checks.yml (manual only).

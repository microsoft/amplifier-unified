name: Work workflow integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: Fast release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The PR merge commit and its exact base/head trees are sufficient.
          fetch-depth: 2
      - name: Record the checked-out build source
        id: build-source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare selected client source for host checks
        if: hashFiles('scripts/web_client_development.py') != ''
        run: python scripts/web_client_development.py prepare-view
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Select Fast verification scope
        id: verification-scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/integration_checks.py fast-scope --base "$PR_BASE" --head "$PR_HEAD" --output "$GITHUB_OUTPUT"
      - name: Check release identity and post-release reporting contracts
        if: steps.verification-scope.outputs.scope != 'release-smoke'
        run: uv run --no-sync pytest -q tests/test_release_automation.py tests/test_release_qualification.py tests/test_frontend_release_proof.py tests/test_frontend_build_artifact.py tests/test_goal_peer_junit.py tests/test_post_release_checks.py tests/test_integration_checks.py tests/test_integration_clients.py tests/test_browser_check_runner.py tests/test_active_client_diagnostics.py
      - name: Check standing access authorization and revocation
        if: steps.verification-scope.outputs.scope != 'release-smoke'
        run: uv run --no-sync pytest -q tests/test_access_mode.py tests/test_configuration_authority.py
      - name: Check prepared release identity and notes
        if: steps.verification-scope.outputs.scope == 'release-smoke'
        run: |
          python scripts/release.py plan
          uv run --no-sync pytest -q tests/test_release_notes.py::test_packaged_history_has_current_release_and_retains_initial_changes
      # Full Python and browser coverage runs nightly or by explicit investigation.
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Test frontend
        id: frontend-tests
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/integration_checks.py frontend-test --base "$PR_BASE" --head "$PR_HEAD" --output "$GITHUB_OUTPUT"
      - name: Build frontend
        id: frontend-build
        run: npm run build --prefix frontend
      - name: Retain frontend build output
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        run: python scripts/frontend_build_artifact.py create --destination "$RUNNER_TEMP/frontend-build-output"
      - name: Upload frontend build output
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build-output-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-build-output/
          if-no-files-found: error
          retention-days: 7
      - name: Verify committed frontend assets
        run: git diff --exit-code -- amplifier_web/static
      - name: Record frontend proof
        run: python scripts/frontend_release_proof.py create --test-scope "${{ steps.frontend-tests.outputs.scope }}" --destination "$RUNNER_TEMP/frontend-proof.json"
      - name: Upload frontend proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-proof.json
          if-no-files-found: error
          retention-days: 7
      # Full frontend/browser coverage also runs in the existing nightly/manual owner.

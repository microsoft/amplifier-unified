name: Published Core wheels
on:
  workflow_call:
    secrets:
      LOOP_LIVE_CI_READ_KEY:
        required: true
permissions:
  contents: read
jobs:
  runtime:
    # Called only by the explicitly selected manual qualification mode.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install and record the released host Core wheel
        run: |
          uv sync --locked --group dev
          python scripts/release_qualification.py core-wheel --python .venv/bin/python --destination "$RUNNER_TEMP/host-core-wheel.json"
          uv run --no-sync pytest tests/test_core_binary.py tests/test_runtime_updates.py tests/test_release_qualification.py tests/test_standalone.py -q
      - name: Resolve the declared loop-live source
        id: runtime-dependency
        run: |
          python -c 'import tomllib; p=tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb")); print("revision=" + p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-bundle-recipes
          ref: main
          path: .ci/recipes
          persist-credentials: false
      - name: Resolve current components and install the released Core wheel
        run: |
          python -m pip install maturin
          python scripts/release_qualification.py runtime-project --runtime "$RUNNER_TEMP/core-runtime"
          uv add --project "$RUNNER_TEMP/core-runtime" --frozen --editable "$GITHUB_WORKSPACE/.ci/loop-live"
          uv add --project "$RUNNER_TEMP/core-runtime" --frozen pytest pytest-asyncio 'amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate'
          uv lock --project "$RUNNER_TEMP/core-runtime" --refresh --upgrade
          python scripts/release_qualification.py cache-key --runtime "$RUNNER_TEMP/core-runtime"
          uv sync --project "$RUNNER_TEMP/core-runtime" --locked
          python scripts/release_qualification.py runtime-snapshot --runtime "$RUNNER_TEMP/core-runtime"
      - name: Qualify real runtime behavior without model calls
        run: |
          UNIFIED_RUNTIME_PYTHON="$RUNNER_TEMP/core-runtime/.venv/bin/python" WARM_RECIPES_PATH="$GITHUB_WORKSPACE/.ci/recipes" "$RUNNER_TEMP/core-runtime/.venv/bin/python" -m pytest tests/test_app_guidance.py tests/test_host_children.py tests/test_host_components.py tests/test_runtime_module_cache.py -q
          cp "$RUNNER_TEMP/core-runtime/qualified-runtime.json" "$RUNNER_TEMP/before-tests.json"
          python scripts/release_qualification.py runtime-snapshot --runtime "$RUNNER_TEMP/core-runtime"
          cmp "$RUNNER_TEMP/before-tests.json" "$RUNNER_TEMP/core-runtime/qualified-runtime.json"
          git rev-parse HEAD > "$RUNNER_TEMP/app-revision.txt"
      - name: Retain only dependency and binary qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-wheels-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/app-revision.txt
            ${{ runner.temp }}/host-core-wheel.json
            ${{ runner.temp }}/core-runtime/pyproject.toml
            ${{ runner.temp }}/core-runtime/uv.lock
            ${{ runner.temp }}/core-runtime/build-constraints.txt
            ${{ runner.temp }}/core-runtime/build-identity.json
            ${{ runner.temp }}/core-runtime/qualified-runtime.json
          if-no-files-found: error

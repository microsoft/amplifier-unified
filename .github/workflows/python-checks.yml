          negative = Path(os.environ['RUNNER_TEMP']) / 'native-receipt-negative'
          shutil.copytree(Path(native.__file__).parent, negative / 'amplifier_web')
          target = negative / 'amplifier_web/native_provider.py'
          corrected = 'if self.state.get("outcome") in {"submitting", "sent", "running", "pending"}:'
          old = 'if self.state.get("outcome") in {"submitting", "running", "pending"}:'
          text = target.read_text()
          assert text.count(corrected) == 1
          target.write_text(text.replace(corrected, old, 1))

name: Full Python checks
# Local/manual qualification and post-release coverage; never a publication gate.
on:
  workflow_dispatch:
    inputs:
      core_wheels:
        description: Qualify published Core wheels and real runtime on both Linux architectures
        type: boolean
        default: false
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  python:
    if: ${{ !inputs.core_wheels }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Run the complete Python suite
        run: uv run --no-sync pytest -q --tb=short
  core-wheels:
    if: ${{ inputs.core_wheels }}
    uses: ./.github/workflows/core-wheels.yml
    secrets:
      LOOP_LIVE_CI_READ_KEY: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}

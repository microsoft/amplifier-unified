name: Full Python checks
# Local/manual qualification and post-release coverage; never a publication gate.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Full qualification or one fixed repair suite (focused checks do not qualify the full suite)
        type: choice
        default: full
        options:
          - full
          - inline-chat-card
          - queued-configuration
          - security-redaction
          - patch-placement-recovery
          - patch-placement-native
          - managed-removal-recovery
          - shared-work-continuity
          - shared-work-native
      core_wheels:
        description: Qualify published Core wheels and real runtime on both Linux architectures
        type: boolean
        default: false
  workflow_call:
    secrets:
      LOOP_LIVE_CI_READ_KEY:
        required: true
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  python:
    if: ${{ !inputs.core_wheels }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHECK_SUITE: ${{ inputs.suite || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Record and validate the fixed Python selection
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          suites = {
              'full': [],
              'inline-chat-card': ['tests/test_chat_references.py'],
              'queued-configuration': ['tests/test_queued_configuration_boundary.py', 'tests/test_configuration_recovery_ui.py'],
              'security-redaction': ['tests/test_agent_state.py', 'tests/test_provider_environment.py', 'tests/test_runtime_controls.py'],
              'patch-placement-recovery': ['tests/test_patch_placement_recovery.py', 'tests/test_file_source_guard.py', 'tests/test_file_source_native_children.py', 'tests/test_workspace_writer_modules.py'],
              'patch-placement-native': ['tests/test_patch_placement_native.py', 'tests/test_patch_placement_recovery.py', 'tests/test_configuration_authority.py', 'tests/test_queued_configuration_boundary.py', 'tests/test_runtime_controls.py'],
              'managed-removal-recovery': ['tests/test_test_environment_worker.py', 'tests/test_task_environments.py', 'tests/test_environment_recovery.py', 'tests/test_environment_retention.py', 'tests/test_incus_environment_worker.py', 'tests/test_release_qualification.py'],
              'shared-work-continuity': ['tests/test_task_continuity.py', 'tests/test_coordination_delivery.py', 'tests/test_work_invocation.py', 'tests/test_schedules.py', 'tests/test_collaboration_input.py', 'tests/test_coordination_revisions.py', 'tests/test_release_qualification.py', 'tests/test_voice_visual.py', 'tests/test_surface_context.py', 'tests/test_output_image_pairs.py', 'tests/test_memory_personalization.py', 'tests/test_capacity.py'],
              'shared-work-native': ['tests/test_native_provider.py', 'tests/test_coordination_delivery.py', 'tests/test_work_origin.py', 'tests/test_capacity.py', 'tests/test_release_qualification.py'],
          }
          selection = os.environ['CHECK_SUITE']
          if selection not in suites:
              raise SystemExit('Unknown fixed Python suite: ' + selection)
          targets = suites[selection]
          output = Path('output/python-checks')
          output.mkdir(parents=True, exist_ok=True)
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          missing = [path for path in targets if not Path(path).is_file()]
          record = {'suite': selection, 'fullSuite': selection == 'full', 'targets': targets,
                    'revision': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'runId': os.environ.get('GITHUB_RUN_ID'), 'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                    'missing': missing}
          (output / 'selection.json').write_text(json.dumps(record, indent=2) + '\n')
          (output / 'targets.txt').write_text(''.join(path + '\n' for path in targets))
          if missing:
              raise SystemExit('Selected tests are missing: ' + ', '.join(missing))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Resolve the declared live-runtime source
        id: runtime-dependency
        run: |
          python -c 'import tomllib; p=tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb")); print("revision=" + p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Install runtime prerequisites for host and child tests
        run: >-
          uv pip install --python .venv/bin/python
          .ci/loop-live
          'amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main'
          'amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@main'
          'amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate'
          'amplifier-module-tool-filesystem @ git+https://github.com/microsoft/amplifier-module-tool-filesystem@main'
          'amplifier-module-tool-apply-patch @ git+https://github.com/microsoft/amplifier-bundle-filesystem@main#subdirectory=modules/tool-apply-patch'
      - name: Require native file-policy modules and Core entry points
        run: |
          uv run --no-sync python - <<'PY'
          from importlib import import_module
          from importlib.metadata import entry_points
          available = {entry.name: entry for entry in entry_points(group='amplifier.modules')}
          for name in ('loop-live', 'context-simple', 'tool-filesystem', 'tool-apply-patch'):
              module = import_module('amplifier_module_' + name.replace('-', '_'))
              mount = available[name].load()
              if not callable(mount) or mount is not module.mount:
                  raise RuntimeError('Native module entry point is not its canonical mount: ' + name)
          PY
      - name: Select the prepared native-controls interpreter
        if: ${{ env.CHECK_SUITE == 'patch-placement-native' }}
        run: echo "UNIFIED_RUNTIME_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare pinned native receipt dependencies
        if: ${{ env.CHECK_SUITE == 'shared-work-native' }}
        run: |
          uv pip install --python .venv/bin/python \
            'amplifier-module-provider-openai[native] @ git+https://github.com/microsoft/amplifier-module-provider-openai@2b35fa334fb2fb2c5c948842e8c7bd691ce5e834' \
            'amplifier-module-tool-exec @ git+https://github.com/microsoft/amplifier-module-tool-exec@f267548ccd1b38a236a46afb96252bb6dd474dcd' \
            'openai==3.29.0' 'websockets==15.0.1' 'hatchling==1.27.0' 'amplifier-core==2.0.2'
          uv run --no-sync python - <<'PY'
          import hashlib, importlib.metadata as m, json, subprocess
          from pathlib import Path
          from amplifier_module_provider_openai.native import NativeSendAdmission, NativeOutboundEnvelope
          from amplifier_module_loop_live.scope import LIVE_OWNER, NATIVE_REQUEST
          import amplifier_module_provider_openai.native as native
          expected = '304a78c2036c6dfe0bf60017844ffec3a0e8b556ad67e3fac20db4b613d276b1'
          assert hashlib.sha256(Path(native.__file__).read_bytes()).hexdigest() == expected
          names = ['amplifier-core', 'amplifier-module-provider-openai', 'amplifier-module-loop-live',
                   'amplifier-module-loop-streaming', 'amplifier-module-tool-exec', 'openai', 'websockets']
          record = {name: {'version': m.version(name),
                          'source': json.loads(m.distribution(name).read_text('direct_url.json') or 'null')}
                    for name in names}
          record['loopCheckout'] = subprocess.check_output(['git', '-C', '.ci/loop-live', 'rev-parse', 'HEAD'], text=True).strip()
          record['providerNativeSha256'] = expected
          Path('output/python-checks/native-readiness.json').write_text(json.dumps(record, indent=2))
          PY
      - name: Run the complete Python suite
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: |
          mkdir -p output/python-checks
          set -o pipefail
          uv run --no-sync pytest -v --tb=short --junitxml=output/python-checks/junit.xml 2>&1 | tee output/python-checks/pytest.log
      - name: Run the selected repair suite
        if: ${{ env.CHECK_SUITE != 'full' }}
        shell: bash
        run: |
          mapfile -t targets < output/python-checks/targets.txt
          test "${#targets[@]}" -gt 0
          set -o pipefail
          uv run --no-sync pytest -v --tb=short --junitxml=output/python-checks/junit.xml "${targets[@]}" 2>&1 | tee output/python-checks/pytest.log
      - name: Verify installed native receipt boundary outside checkout
        if: ${{ env.CHECK_SUITE == 'shared-work-native' }}
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir output/python-checks/wheel .
          uv pip freeze --python .venv/bin/python > output/python-checks/native-freeze.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('output/python-checks/native-freeze.txt')
          rows = [r for r in p.read_text().splitlines() if not r.startswith(('-e ', '#', 'amplifier-unified'))]
          Path('output/python-checks/installed-requirements.txt').write_text('\n'.join(rows) + '\n')
          PY
          uv venv --python 3.13 "$RUNNER_TEMP/native-receipt-installed"
          # Install the complete already-resolved snapshot, not a new graph
          # combining pinned VCS commits with moving transitive URLs.
          uv pip install --python "$RUNNER_TEMP/native-receipt-installed/bin/python" --no-deps -r output/python-checks/installed-requirements.txt
          uv pip install --python "$RUNNER_TEMP/native-receipt-installed/bin/python" --no-deps output/python-checks/wheel/*.whl
          uv pip check --python "$RUNNER_TEMP/native-receipt-installed/bin/python"
          mkdir "$RUNNER_TEMP/native-receipt-tests"
          cp tests/*.py "$RUNNER_TEMP/native-receipt-tests/"
          unset PYTHONPATH
          cd "$RUNNER_TEMP/native-receipt-tests"
          "$RUNNER_TEMP/native-receipt-installed/bin/python" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import amplifier_web.native_provider as native
          source = Path(os.environ['GITHUB_WORKSPACE'])
          actual = Path(native.__file__)
          assert not actual.is_relative_to(source)
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(actual) == digest(source / 'amplifier_web/native_provider.py')
          for name in ('coordination_delivery', 'app_guidance', 'runtime_worker', 'execution_events', 'surface_delivery'):
              import importlib
              module = Path(importlib.import_module('amplifier_web.' + name).__file__)
              assert not module.is_relative_to(source)
              assert digest(module) == digest(source / ('amplifier_web/' + name + '.py'))
          (source / 'output/python-checks/installed-native.json').write_text(json.dumps(
              {'installed': str(actual), 'sha256': digest(actual), 'outsideCheckout': True}))
          PY
          "$RUNNER_TEMP/native-receipt-installed/bin/python" -m pytest -v --tb=short --asyncio-mode=auto --import-mode=importlib \
            test_native_provider.py test_coordination_delivery.py test_work_origin.py test_capacity.py \
            --junitxml="$GITHUB_WORKSPACE/output/python-checks/installed-junit.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/python-checks/installed-pytest.log"
          python - <<'PY'
          import os, xml.etree.ElementTree as E
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'output/python-checks'
          for name in ('junit.xml', 'installed-junit.xml'):
              cases = E.parse(root / name).findall('.//testcase')
              assert cases and all(not any(c.find(k) is not None for k in ('failure', 'error', 'skipped')) for c in cases)
          PY
          "$RUNNER_TEMP/native-receipt-installed/bin/python" - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, xml.etree.ElementTree as E
          from pathlib import Path
          import amplifier_web.native_provider as native
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'output/python-checks'
          negative = Path(os.environ['RUNNER_TEMP']) / 'native-receipt-negative'
          shutil.copytree(Path(native.__file__).parent, negative / 'amplifier_web')
          target = negative / 'amplifier_web/native_provider.py'
          corrected = 'if self.state.get("outcome") in {"submitting", "sent", "running", "pending"}:'
          old = 'if self.state.get("outcome") in {"submitting", "running", "pending"}:'
          text = target.read_text()
          assert text.count(corrected) == 1
          target.write_text(text.replace(corrected, old, 1))
          env = {**os.environ, 'PYTHONPATH': str(negative)}
          probe = subprocess.check_output([sys.executable, '-c',
              'import amplifier_web.native_provider as n; print(n.__file__)'], env=env, text=True).strip()
          assert Path(probe) == target
          with (output / 'negative-control.log').open('w') as log:
              result = subprocess.run([sys.executable, '-m', 'pytest', '-v', '--tb=short',
                  '--asyncio-mode=auto', '--import-mode=importlib',
                  'test_native_provider.py::test_restart_after_send_before_response_is_unknown_and_blocks_transport',
                  '--junitxml=' + str(output / 'negative-control.xml')], env=env, stdout=log, stderr=subprocess.STDOUT)
          cases = E.parse(output / 'negative-control.xml').findall('.//testcase')
          assert result.returncode == 1 and len(cases) == 1
          failure = cases[0].find('failure')
          assert failure is not None and "'sent' == 'unknown'" in (failure.text or '')
          assert cases[0].find('error') is None and cases[0].find('skipped') is None
          (output / 'negative-control.json').write_text(json.dumps({
              'mutation': 'Restore only the old missing-sent top-level restart set',
              'expectedFailure': True, 'returncode': result.returncode,
              'mutatedSha256': hashlib.sha256(target.read_bytes()).hexdigest()}))
          PY
      - name: Retain complete and partial Python results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-results-${{ github.run_attempt }}
          path: output/python-checks/
          if-no-files-found: warn
  incompatible-selection:
    if: ${{ inputs.core_wheels && inputs.suite && inputs.suite != 'full' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Core-wheel qualification requires suite=full; focused selection was not run.'
          exit 1
  core-wheels:
    if: ${{ inputs.core_wheels && (!inputs.suite || inputs.suite == 'full') }}
    uses: ./.github/workflows/core-wheels.yml
    secrets:
      LOOP_LIVE_CI_READ_KEY: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}

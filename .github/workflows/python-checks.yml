              assert cases and all(not any(c.find(k) is not None for k in ('failure', 'error', 'skipped')) for c in cases)
          PY
          "$RUNNER_TEMP/native-receipt-installed/bin/python" - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, xml.etree.ElementTree as E
          from pathlib import Path
          import amplifier_web.native_provider as native

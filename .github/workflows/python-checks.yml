name: Full Python checks
# Local/manual qualification and post-release coverage; never a publication gate.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Full qualification or one fixed repair suite (focused checks do not qualify the full suite)
        type: choice
        default: full
        options:
          - full
          - inline-chat-card
          - queued-configuration
          - security-redaction
          - patch-placement-recovery
          - patch-placement-native
          - managed-removal-recovery
          - fresh-cleanup-native
          - shared-work-continuity
          - manager-exception-boundary
          - remote-test-origins
          - shared-work-native
          - cold-control-restore
          - goal-peer-publisher-0410
          - updater-omitted-ref
          - updater-public-selected-source
          - updater-synthetic-acquisition
          - updater-expanded-lock
          - native-child-fixtures
          - question-answer-resume
          - question-answer-installed
          - live-first-send
      core_wheels:
        description: Qualify published Core wheels and real runtime on both Linux architectures
        type: boolean
        default: false
  workflow_call:
    secrets:
      LOOP_LIVE_CI_READ_KEY:
        required: true
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  python:
    if: ${{ !inputs.core_wheels && inputs.suite != 'remote-test-origins' && inputs.suite != 'cold-control-restore' && inputs.suite != 'goal-peer-publisher-0410' && inputs.suite != 'updater-omitted-ref' && inputs.suite != 'updater-public-selected-source' && inputs.suite != 'updater-synthetic-acquisition' && inputs.suite != 'updater-expanded-lock' && inputs.suite != 'fresh-cleanup-native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHECK_SUITE: ${{ inputs.suite || 'full' }}
    steps:
      - name: Start the full Python evidence deadline before preparation
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import time
          print("PYTHON_CHECK_DEADLINE=" + str(time.monotonic() + 75 * 60))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Record and validate the fixed Python selection
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          suites = {
              'full': [],
              'inline-chat-card': ['tests/test_chat_references.py'],
              'queued-configuration': ['tests/test_queued_configuration_boundary.py', 'tests/test_configuration_recovery_ui.py'],
              'security-redaction': ['tests/test_agent_state.py', 'tests/test_provider_environment.py', 'tests/test_runtime_controls.py'],
              'patch-placement-recovery': ['tests/test_patch_placement_recovery.py', 'tests/test_file_source_guard.py', 'tests/test_file_source_native_children.py', 'tests/test_workspace_writer_modules.py'],
              'patch-placement-native': ['tests/test_patch_placement_native.py', 'tests/test_patch_placement_recovery.py', 'tests/test_configuration_authority.py', 'tests/test_queued_configuration_boundary.py', 'tests/test_runtime_controls.py'],
              'managed-removal-recovery': ['tests/test_dependency_layers.py', 'tests/test_stopped_reservation_recovery.py', 'tests/test_prepared_execution_contract.py', 'tests/test_environment_preparation.py', 'tests/test_test_environment_worker.py', 'tests/test_source_transfer.py', 'tests/test_task_environments.py', 'tests/test_environment_recovery.py', 'tests/test_prelaunch_source_failure.py', 'tests/test_environment_retention.py', 'tests/test_incus_environment_worker.py', 'tests/test_release_qualification.py'],
              'shared-work-continuity': ['tests/test_task_continuity.py', 'tests/test_coordination_delivery.py', 'tests/test_work_invocation.py', 'tests/test_schedules.py', 'tests/test_collaboration_input.py', 'tests/test_coordination_revisions.py', 'tests/test_release_qualification.py', 'tests/test_voice_visual.py', 'tests/test_surface_context.py', 'tests/test_output_image_pairs.py', 'tests/test_memory_personalization.py', 'tests/test_capacity.py'],
              'shared-work-native': ['tests/test_native_provider.py', 'tests/test_coordination_delivery.py', 'tests/test_work_native_effects.py', 'tests/test_work_origin.py', 'tests/test_capacity.py', 'tests/test_release_qualification.py'],
              'manager-exception-boundary': ['tests/test_manager_exception_boundary.py', 'tests/test_manager_failure_details.py', 'tests/test_session_health.py', 'tests/test_retained_failure_recovery.py', 'tests/test_runtime.py'],
              'native-child-fixtures': ['tests/test_child_app_assignment_capture.py', 'tests/test_history_scope_native.py', 'tests/test_file_source_native_children.py'],
              'question-answer-resume': ['tests/test_question_peer_resume.py', 'tests/test_peer_resume.py', 'tests/test_peer_resume_native.py', 'tests/test_failed_peer_recovery.py', 'tests/test_retained_failure_recovery.py', 'tests/test_questions.py', 'tests/test_question_handoffs.py'],
              'question-answer-installed': ['tests/test_question_peer_resume.py', 'tests/test_peer_resume_native.py'],
              'live-first-send': ['tests/test_conversation_steering.py', 'tests/test_steering_runtime.py', 'tests/test_native_provider.py', 'tests/test_message_delivery.py', 'tests/test_queued_configuration_boundary.py', 'tests/test_service.py::test_failed_direct_send_settles_activity_without_replay_or_lost_input'],
          }
          selection = os.environ['CHECK_SUITE']
          if selection not in suites:
              raise SystemExit('Unknown fixed Python suite: ' + selection)
          targets = suites[selection]
          output = Path('output/python-checks')
          output.mkdir(parents=True, exist_ok=True)
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          missing = [path for path in targets if not Path(path.split('::', 1)[0]).is_file()]
          record = {'suite': selection, 'fullSuite': selection == 'full', 'targets': targets,
                    'revision': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'runId': os.environ.get('GITHUB_RUN_ID'), 'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                    'missing': missing}
          (output / 'selection.json').write_text(json.dumps(record, indent=2) + '\n')
          (output / 'targets.txt').write_text(''.join(path + '\n' for path in targets))
          if missing:
              raise SystemExit('Selected tests are missing: ' + ', '.join(missing))
          PY
      - name: Retain unstarted full Python evidence
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: python scripts/browser_check_runner.py --python-suite --initialize --output output/python-checks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tests/web/package-lock.json
            components/web-client.source.json
            frontend/package-lock.json
      - name: Prepare selected client source for host checks
        run: |
          if test -f tests/web/package.json; then
            python scripts/web_client_build.py prepare
          else
            # Historical selected checkout keeps its authored web layout.
            if test -f scripts/web_client_development.py; then
              python scripts/web_client_development.py prepare-view
            fi
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Resolve the declared live-runtime source
        id: runtime-dependency
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          p = tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb"))
          locked = tomllib.load(open("uv.lock", "rb"))
          loop, = [row for row in locked["package"] if row["name"] == "amplifier-module-loop-live"]
          revision = (loop["source"]["git"].rsplit("#", 1)[1] if os.environ["CHECK_SUITE"] == "live-first-send"
                      else "76073827ba6742ae026a12b524f596120cd2b314" if os.environ["CHECK_SUITE"] == "manager-exception-boundary"
                      else p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])
          print("revision=" + revision)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Install runtime prerequisites for host and child tests
        if: ${{ env.CHECK_SUITE != 'live-first-send' }}
        run: >-
          uv pip install --python .venv/bin/python
          .ci/loop-live
          'amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main'
          'amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@main'
          'amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate'
          'amplifier-module-tool-filesystem @ git+https://github.com/microsoft/amplifier-module-tool-filesystem@main'
          'amplifier-module-tool-apply-patch @ git+https://github.com/microsoft/amplifier-bundle-filesystem@main#subdirectory=modules/tool-apply-patch'
      - name: Require native file-policy modules and Core entry points
        run: |
          uv run --no-sync python - <<'PY'
          from importlib import import_module
          from importlib.metadata import entry_points
          available = {entry.name: entry for entry in entry_points(group='amplifier.modules')}
          for name in ('loop-live', 'context-simple', 'tool-filesystem', 'tool-apply-patch'):
              module = import_module('amplifier_module_' + name.replace('-', '_'))
              mount = available[name].load()
              if not callable(mount) or mount is not module.mount:
                  raise RuntimeError('Native module entry point is not its canonical mount: ' + name)
          PY
      - name: Select the prepared native-controls interpreter
        if: ${{ env.CHECK_SUITE == 'patch-placement-native' }}
        run: echo "UNIFIED_RUNTIME_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Verify locked native receipt dependencies
        if: ${{ env.CHECK_SUITE == 'full' || env.CHECK_SUITE == 'shared-work-native' }}
        run: |
          # The dev group already selects provider[native], tool-exec and their
          # SDK closure in uv.lock. Do not replace it with an older receipt pin.
          uv run --no-sync python scripts/native_dependency_preflight.py \
            --output output/python-checks/native-readiness.json
      - name: Run the complete Python suite
        if: ${{ env.CHECK_SUITE == 'full' }}
        run: python -u scripts/browser_check_runner.py --python-suite --output output/python-checks
      - name: Record manager-boundary source and import identity
        if: ${{ env.CHECK_SUITE == 'manager-exception-boundary' }}
        run: |
          uv run --no-sync python - <<'PY' > output/python-checks/boundary-imports.json
          import hashlib, importlib, importlib.metadata as md, json, subprocess, sys
          from pathlib import Path
          result = {"python": sys.version, "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "loopRevision": subprocess.check_output(["git", "-C", ".ci/loop-live", "rev-parse", "HEAD"], text=True).strip(), "modules": {}}
          for name in ("amplifier_web.runtime_worker", "amplifier_web.runtime", "amplifier_web.session_health",
                       "amplifier_module_loop_live.orchestrator", "amplifier_module_loop_live.failures",
                       "amplifier_module_loop_streaming", "amplifier_module_context_simple"):
              module = importlib.import_module(name)
              path = Path(module.__file__)
              result["modules"][name] = {"file": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps(result, indent=2))
          PY
      - name: Run the selected repair suite
        if: ${{ env.CHECK_SUITE != 'full' && env.CHECK_SUITE != 'native-child-fixtures' && env.CHECK_SUITE != 'question-answer-installed' && env.CHECK_SUITE != 'live-first-send' }}
        shell: bash
        run: |
          mapfile -t targets < output/python-checks/targets.txt
          test "${#targets[@]}" -gt 0
          set -o pipefail
          if [ "$CHECK_SUITE" = manager-exception-boundary ]; then
            git fetch --no-tags --depth=1 origin 8a326ee890e43fa30b59ca8f4654d1ca598c0af2
            mkdir -p output/python-checks/original
            git archive 8a326ee890e43fa30b59ca8f4654d1ca598c0af2 | tar -x -C output/python-checks/original
            set +e
            (cd output/python-checks/original && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
              -c /dev/null -o asyncio_mode=auto --import-mode=importlib -v --tb=short \
              "$GITHUB_WORKSPACE/tests/test_manager_exception_boundary.py::test_real_post_provider_manager_exception_reaches_public_inspection") \
              2>&1 | tee output/python-checks/original-red.log
            red=${PIPESTATUS[0]}
            set -e
            test "$red" -eq 1
            grep -q 'chain = failure.get' output/python-checks/original-red.log || grep -q 'assert any' output/python-checks/original-red.log
            grep -q '/original/amplifier_web/runtime_worker.py' output/python-checks/original-red.log
          fi
          uv run --no-sync pytest -v --tb=short --junitxml=output/python-checks/junit.xml "${targets[@]}" 2>&1 | tee output/python-checks/pytest.log
      - name: Verify question-answer predecessor and exact runtime joins
        if: ${{ env.CHECK_SUITE == 'question-answer-resume' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c184826828c27c058edbf4a1d03f0ec4cc03961c
          mkdir -p "$RUNNER_TEMP/question-resume-before"
          git archive c184826828c27c058edbf4a1d03f0ec4cc03961c | tar -x -C "$RUNNER_TEMP/question-resume-before"
          cp tests/test_question_peer_resume.py "$RUNNER_TEMP/question-resume-before/tests/"
          set +e
          (cd "$RUNNER_TEMP/question-resume-before" && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -s -v --tb=short \
            tests/test_question_peer_resume.py::test_exact_ui_answer_drives_existing_resume_once) \
            2>&1 | tee output/python-checks/predecessor.log
          predecessor=${PIPESTATUS[0]}
          set -e
          test "$predecessor" -eq 1
          grep -q 'A real UI answer must be exposed without another typed Resume' output/python-checks/predecessor.log
          grep -q '/question-resume-before/amplifier_web/peer_resume.py' output/python-checks/predecessor.log
          git fetch --no-tags --depth=1 origin b11bc51f29aecaa08bc96358d3129215886cd9de
          mkdir -p "$RUNNER_TEMP/question-resume-before-next-message"
          git archive b11bc51f29aecaa08bc96358d3129215886cd9de | tar -x -C "$RUNNER_TEMP/question-resume-before-next-message"
          cp tests/test_question_peer_resume.py "$RUNNER_TEMP/question-resume-before-next-message/tests/"
          set +e
          (cd "$RUNNER_TEMP/question-resume-before-next-message" && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -s -v --tb=short \
            'tests/test_question_peer_resume.py::test_saved_next_message_transition_is_not_an_intervening_edit[unchanged]') \
            2>&1 | tee output/python-checks/next-message-predecessor.log
          predecessor=${PIPESTATUS[0]}
          set -e
          test "$predecessor" -eq 1
          grep -q 'Applying the already-saved choice must not consume the answer as a failed resume' output/python-checks/next-message-predecessor.log
          python - <<'PY'
          import json
          from pathlib import Path
          marker = 'NEXT_MESSAGE_OBSERVATION='
          rows = [json.loads(line.split(marker, 1)[1]) for line in
                  Path('output/python-checks/next-message-predecessor.log').read_text().splitlines()
                  if marker in line and line.split(marker, 1)[1].startswith('{')]
          row, = rows
          assert row['change'] == 'unchanged' and row['started'] == ['next-report']
          ack, = row['acknowledgements']
          assert ack['revision'] == row['appliedRevision'] == 1
          assert ack['bundle'] == row['bundle'] == 'next-report'
          assert row['taskUnchanged'] and row['delivery'] == 'suppressed'
          assert row['reason'] == 'The question-backed resume settings or placement changed.'
          PY
          uv run --no-sync python - <<'PY' > output/python-checks/question-resume-imports.json
          import hashlib, importlib, json, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path.cwd().resolve()
          rows = list(ET.parse('output/python-checks/junit.xml').getroot().iter('testcase'))
          assert rows and not any(row.find(kind) is not None for row in rows for kind in ('failure', 'error', 'skipped'))
          native = [row for row in rows if 'test_peer_resume_native' in row.get('classname', '')]
          assert len(native) == 9, 'Ordinary, question and negative question inputs must cross the real native bridge'
          modules = {}
          for name in ('amplifier_web.peer_resume', 'amplifier_web.collaboration',
                       'amplifier_web.questions', 'amplifier_module_loop_live.orchestrator',
                       'amplifier_module_context_simple'):
              path = Path(importlib.import_module(name).__file__).resolve()
              if name.startswith('amplifier_web.'): assert path.is_relative_to(root / 'amplifier_web')
              modules[name] = {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps({'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'loop': subprocess.check_output(['git', '-C', '.ci/loop-live', 'rev-parse', 'HEAD'], text=True).strip(),
              'tests': len(rows), 'nativeTests': len(native), 'modules': modules}, indent=2))
          PY
      - name: Verify rendered question-answer continuation and package bytes
        if: ${{ env.CHECK_SUITE == 'question-answer-resume' || env.CHECK_SUITE == 'question-answer-installed' }}
        run: |
          set -euo pipefail
          if test -f tests/web/package.json; then
            npm ci --prefix .build/web-client
            npm ci --prefix tests/web
            python scripts/web_client_build.py build
            if [ "$CHECK_SUITE" = question-answer-resume ]; then
              (cd tests/web && npx playwright install --with-deps chromium)
              AMPLIFIER_TEST_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" \
                AMPLIFIER_TEST_ARTIFACTS="$GITHUB_WORKSPACE/output/python-checks/question-browser" \
                node tests/web/question-resume-browser.mjs 2>&1 | tee output/python-checks/question-browser.log
            fi
          else
            # Historical selected checkout keeps its authored web layout.
            npm ci --prefix frontend
            npm run build --prefix frontend
            if [ "$CHECK_SUITE" = question-answer-resume ]; then
              (cd frontend && npx playwright install --with-deps chromium)
              AMPLIFIER_TEST_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" \
                AMPLIFIER_TEST_ARTIFACTS="$GITHUB_WORKSPACE/output/python-checks/question-browser" \
                node frontend/tests/question-resume-browser.mjs 2>&1 | tee output/python-checks/question-browser.log
            fi
          fi
          uv build --wheel --out-dir output/python-checks/dist
          python - <<'PY' > output/python-checks/question-resume-wheel.json
          import hashlib, json, zipfile
          from pathlib import Path
          wheel, = Path('output/python-checks/dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as package:
              files = ['amplifier_web/peer_resume.py', 'amplifier_web/collaboration.py', 'amplifier_web/questions.py']
              files += [str(p) for p in Path('amplifier_web/static').rglob('*') if p.is_file()]
              for name in files:
                  assert package.read(name) == Path(name).read_bytes(), name
          print(json.dumps({'wheel': wheel.name, 'sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
                            'sourceAndBuildFilesVerified': len(files)}, indent=2))
          PY
          uv pip freeze --python .venv/bin/python > output/python-checks/question-freeze.txt
          python - <<'PY'
          from pathlib import Path
          rows = [r for r in Path('output/python-checks/question-freeze.txt').read_text().splitlines()
                  if not r.startswith(('-e ', '#', 'amplifier-unified'))]
          Path('output/python-checks/question-installed-requirements.txt').write_text('\n'.join(rows) + '\n')
          PY
          uv venv --python 3.13 "$RUNNER_TEMP/question-resume-installed"
          uv pip install --python "$RUNNER_TEMP/question-resume-installed/bin/python" --no-deps \
            -r output/python-checks/question-installed-requirements.txt
          uv pip install --python "$RUNNER_TEMP/question-resume-installed/bin/python" --no-deps \
            output/python-checks/dist/*.whl
          uv pip check --python "$RUNNER_TEMP/question-resume-installed/bin/python"
          mkdir -p "$RUNNER_TEMP/question-resume-package"
          cp -a tests "$RUNNER_TEMP/question-resume-package/"
          (
            cd "$RUNNER_TEMP/question-resume-package"
            unset PYTHONPATH
            "$RUNNER_TEMP/question-resume-installed/bin/python" - <<'PY' > "$GITHUB_WORKSPACE/output/python-checks/installed-imports.json"
          import hashlib, importlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          expected = Path(os.environ['RUNNER_TEMP']) / 'question-resume-installed'
          result = {}
          for name in ('amplifier_web.peer_resume', 'amplifier_web.collaboration', 'amplifier_web.questions'):
              path = Path(importlib.import_module(name).__file__).resolve()
              assert path.is_relative_to(expected) and not path.is_relative_to(root), path
              original = root / (name.replace('.', '/') + '.py')
              assert path.read_bytes() == original.read_bytes()
              result[name] = {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps(result, indent=2))
          PY
            "$RUNNER_TEMP/question-resume-installed/bin/python" -m pytest -c /dev/null -o asyncio_mode=auto --rootdir=. \
              -v --tb=short tests/test_question_peer_resume.py tests/test_peer_resume_native.py \
              --junitxml="$GITHUB_WORKSPACE/output/python-checks/installed-junit.xml"
          ) 2>&1 | tee output/python-checks/installed-tests.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          rows = list(ET.parse('output/python-checks/installed-junit.xml').getroot().iter('testcase'))
          assert rows and not any(row.find(kind) is not None for row in rows for kind in ('failure', 'error', 'skipped'))
          assert len([row for row in rows if 'test_peer_resume_native' in row.get('classname', '')]) == 9
          PY
      - name: Qualify live-first Send from the installed wheel with scripted external transports
        if: ${{ env.CHECK_SUITE == 'live-first-send' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Reuse committed, verified production assets: no second frontend build.
          python scripts/web_client_build.py verify > output/python-checks/client-build.json
          npm ci --prefix tests/web
          (cd tests/web && npx playwright install --with-deps chromium)
          uv build --wheel --out-dir output/python-checks/dist
          python - <<'PY'
          import hashlib, json, tomllib, zipfile
          from pathlib import Path
          wheel, = Path('output/python-checks/dist').glob('*.whl')
          mappings = tomllib.loads(Path('pyproject.toml').read_text())['tool']['hatch']['build']['targets']['wheel']['force-include']
          with zipfile.ZipFile(wheel) as archive:
              files = {name: hashlib.sha256(archive.read(name)).hexdigest()
                       for name in archive.namelist() if name.startswith('amplifier_web/') and not name.endswith('/')}
              for name, digest in files.items():
                  source = Path(name)
                  if not source.is_file():
                      candidates = [Path(original) / name[len(destination) + 1:] if name.startswith(destination + '/')
                                    else Path(original) for original, destination in mappings.items()
                                    if name == destination or name.startswith(destination + '/')]
                      source, = candidates
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, name
          Path('output/python-checks/wheel.json').write_text(json.dumps({
              'wheel': wheel.name, 'sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
              'files': files}, indent=2) + '\n')
          PY

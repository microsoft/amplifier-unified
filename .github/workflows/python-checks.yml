name: Python checks (on demand)
# Temporarily opt-in during rapid development; never a PR or release gate.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - name: Run the complete Python suite
        run: uv run --no-sync pytest -q --tb=short

name: Full Python checks
# Branch-only replacement for the disposable #2525 pairing qualification.
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [fresh-lan-2525]
        required: true
permissions:
  contents: read
concurrency:
  group: fresh-lan-2525-${{ github.repository }}
  cancel-in-progress: false
jobs:
  pairing:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'microsoft/amplifier-unified' && github.ref == 'refs/heads/ci/2525-fresh-lan' && inputs.suite == 'fresh-lan-2525'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: microsoft/amplifier-client-web
          ref: 1176e683897e1f4fb472d68c2d722b613faa0eec
          path: .build/qualification-client
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '25.4.0'
      - name: Qualify isolated fresh pairing
        shell: bash
        run: bash tests/web/linked-fresh-install-hosted.sh
      - name: Retain results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-lan-2525-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh-lan-evidence/
          if-no-files-found: error
          retention-days: 7

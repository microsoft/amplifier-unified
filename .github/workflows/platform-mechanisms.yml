          if ($LASTEXITCODE -ne 0) { throw 'Windows folder removal checks failed.' }
      # The delete choice of uninstall, on a throwaway installation folder with
      # its real Start-menu shortcuts and Apps-list entry. Each Open, Status,
      # Stop and Uninstall is a new process behind a real start program (a venv
      # in the folder's `tools`), with the folder's workspace as its current
      # folder. Real: the lock, the folder proof and pin, the journal, deletion
      # through handles, junctions that lead out of the folder, a long path, a
      # data file in use, and the step after exit. Stand-ins: Task Scheduler,
      # the check of an installed release, and the dialogs with their answers.
      # One case deletes its own base Python, standard library and installed
      # package, moves mapped images aside, and must still return and exit cleanly.
      # A skipped case would hide the answer; on this lane it fails.
      - name: Check that the delete choice removes only its own folder, survives an interruption and finishes after exit
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -s -p no:cacheprovider tests/test_windows_uninstall.py | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw 'Windows uninstall delete-choice checks failed.' }
          if (($log -join "`n") -match '\d+ skipped') { throw 'A native uninstall case was skipped on this lane.' }

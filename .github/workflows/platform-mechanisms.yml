permissions:
  contents: read
jobs:
  instance-branding-storage:
    if: ${{ !inputs.remaining_runtime_only && !inputs.candidate_ref && !inputs.bootstrap_only && !inputs.foreground_only && !inputs.storage_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare only branding storage test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: "pytest>=8,<10" "PyYAML>=6.0.3,<7" "Pillow>=13,<14"
      - name: Check exact source and branding record boundaries
        run: |
          git rev-parse HEAD
          python -B -m pytest -v -ra -p no:cacheprovider --junitxml=branding-storage.xml tests/test_instance_branding_storage.py
      - name: Retain named native cases and skip reasons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instance-branding-storage-${{ matrix.os }}
          path: branding-storage.xml
          if-no-files-found: error
          retention-days: 7
  passive-process-check:
    if: ${{ !inputs.remaining_runtime_only && !inputs.candidate_ref && !inputs.bootstrap_only && !inputs.foreground_only && !inputs.storage_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require ordinary Windows Python and both PowerShell hosts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S -B -c "import sys,sysconfig,struct; assert sys.platform == 'win32'; assert sys.implementation.name == 'cpython'; assert sys.version_info[:2] == (3,13); assert struct.calcsize('P') == 8; assert not sysconfig.get_config_var('Py_GIL_DISABLED'); assert sys._base_executable; print(sys.version); print(sys.getwindowsversion())"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Python preflight failed.' }
          foreach ($hostSpec in @(@('powershell.exe', '5.1'), @('pwsh.exe', '7'))) {
            $hostCommand = Get-Command $hostSpec[0] -CommandType Application -ErrorAction Stop
            & $hostCommand.Source -NoProfile -NonInteractive -Command "`$version = `$PSVersionTable.PSVersion; if (-not `$version.ToString().StartsWith('$($hostSpec[1])')) { exit 1 }; `$version.ToString()"
            if ($LASTEXITCODE -ne 0) { throw 'A required PowerShell host is unavailable or has the wrong version.' }
          }
      - name: Check standalone platform mechanisms and installer fixtures
        run: >
          python -I -S -B -c
          "import sys, unittest; sys.path.insert(0, '.');
          suite = unittest.TestSuite(unittest.defaultTestLoader.discover('tests', pattern=pattern)
          for pattern in ('test_generation_leases.py', 'test_installation_guidance.py',
          'test_repair_lock_platform.py', 'test_worker_platform_io.py',
          'test_windows_files.py', 'test_windows_uv_tool.py', 'test_windows_app_activation.py', 'test_windows_owned_process.py',
          'test_windows_installer.py'));
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(not result.wasSuccessful())"
      # A read of a private file while another process replaces it: Stop
      # Amplifier read task-runtime.json while the app wrote its next phase.
      # A skipped native case would hide the answer; on this lane it fails.
      # The step above ran these cases too; this second run (about 10
      # seconds) is the one that refuses a skip.
      - name: Require the native replaced-while-read cases with no skip
        if: runner.os == 'Windows'
        run: >
          python -I -S -B -c
          "import sys, unittest; sys.path.insert(0, 'tests'); import test_windows_files as cases;
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(cases.ReplacedWhileReadNativeTests);
          count = suite.countTestCases();
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          print('native replaced-while-read cases:', count, 'run:', result.testsRun, 'skipped:', len(result.skipped));
          sys.exit(not (result.wasSuccessful() and count and count == result.testsRun and not result.skipped))"
  windows-private-config-tls:
    if: ${{ !inputs.remaining_runtime_only && !inputs.candidate_ref && !inputs.bootstrap_only && !inputs.foreground_only && !inputs.storage_only }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare only the focused test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S -B -c "import sys,sysconfig,struct; assert sys.platform == 'win32'; assert sys.version_info[:2] == (3,13); assert struct.calcsize('P') == 8; assert not sysconfig.get_config_var('Py_GIL_DISABLED'); print(sys.version); print(sys.getwindowsversion())"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Python preflight failed.' }
          python -m venv .native-test-venv
          if ($LASTEXITCODE -ne 0) { throw 'Test environment creation failed.' }
          .\.native-test-venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple --only-binary=:all: "pytest>=8,<10" "cryptography>=44,<51" "PyYAML>=6.0.3,<7" "filelock>=4.2.1,<5" "aiohttp==3.14.4"
          if ($LASTEXITCODE -ne 0) { throw 'Focused test dependency installation failed.' }
          .\.native-test-venv\Scripts\python.exe -I -B -c "import importlib.metadata as m; print({name:m.version(name) for name in ('pytest','cryptography','PyYAML','filelock','aiohttp')})"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency readback failed.' }
      - name: Check private configuration, TLS and service policy without task registration
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_deployment.py tests/test_windows_tls.py tests/test_windows_service.py tests/test_windows_task_runtime.py -k "not native_synthetic_task_create_run_stop_remove and not stop_reads_the_receipt_while_the_host_writes_its_phases"
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration, TLS or service policy checks failed.' }
      # setup-tls force records the root that it replaces, and a full record
      # stops it with nothing changed: the real private file store, and the
      # real read-only question to this account's root store. A skipped
      # native case would hide the answer; on this lane it fails.
      - name: Require the native replaced-root record cases with no skip
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_windows_tls.py -k "test_native_keyless_identity_has_no_signing_key_file_and_serves_tls or test_native_full_record_asks_the_real_store_read_only_and_a_stop_changes_nothing" | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'A native replaced-root record case failed.' }
          if (-not ($report -match '^2 passed') -or ($report -match 'skipped')) { throw 'A native replaced-root record case did not run; on this lane it must run.' }
      # Stop Amplifier reads task-runtime.json while the app writes its phases:
      # the real stop request and reader against a real host process that
      # replaces the file without a pause. No task and no app. A skipped
      # native case would hide the answer; on this lane it fails.
      - name: Require the stop command's reads against a writing host with no skip
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -s -p no:cacheprovider "tests/test_windows_task_runtime.py::test_stop_reads_the_receipt_while_the_host_writes_its_phases" | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'A stop-command read failed while the host replaced its receipt.' }
          if (-not ($report -match '1 passed') -or ($report -match 'skipped')) { throw 'The native stop-reader case did not run; on this lane it must run.' }
      - name: Check native Proactor socket cleanup backport without app state
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_windows_proactor.py -k "not app_factory"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Proactor cleanup checks failed.' }
      - name: Check actual CLI service root binding without tasks or health HTTP
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_cli_deployment.py::test_service_cli_binds_every_operation_to_selected_data_root tests/test_cli_deployment.py::test_background_launcher_uses_platform_neutral_owned_service_check tests/test_cli_deployment.py::test_windows_service_cli_real_chain_root_boundary tests/test_cli_deployment.py::test_windows_default_launcher_refuses_before_setup_or_browser
          if ($LASTEXITCODE -ne 0) { throw 'CLI service root binding checks failed.' }
  windows-local-connection:
    # The consumer installation's saved port and key-less local root on native
    # Windows, in their own job so the older private-config lane keeps its
    # commands. Nothing here registers a task, starts the app or asks a person.
    #
    # Port: this runner's real TCP ranges, a real listening first installation,
    # a real Windows port reservation and a real listed exclusion. The runner's
    # elevated token creates one temporary reservation and removes it.
    #
    # Trust: the real crypt32 store calls (on a private throwaway store, no
    # trust change), the Windows chain builder, and Edge's own verifier (Windows
    # root store plus Chromium rules). For Edge the test root goes into this
    # disposable runner's MACHINE store, because a hosted runner cannot answer
    # the question Windows asks for a person's own store. The product never uses
    # the machine store. The test removes the root in every case.
    if: ${{ !inputs.remaining_runtime_only && !inputs.candidate_ref && !inputs.bootstrap_only && !inputs.foreground_only && !inputs.storage_only }}
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # A skipped native case would hide the answer; on this lane it fails.
      AMPLIFIER_REQUIRE_PORT_RESERVATION_CHECK: '1'
      AMPLIFIER_REQUIRE_WINDOWS_TRUST_CHECKS: '1'
      AMPLIFIER_REQUIRE_WINDOWS_SHELL_CHECKS: '1'
      AMPLIFIER_TEST_EDGE_WITH_MACHINE_ROOT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare only the focused test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .native-test-venv
          if ($LASTEXITCODE -ne 0) { throw 'Test environment creation failed.' }
          .\.native-test-venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple --only-binary=:all: "pytest>=8,<10" "cryptography>=44,<51" "PyYAML>=6.0.3,<7" "filelock>=4.2.1,<5" "aiohttp==3.14.4" "certifi>=2025.1.31" "Pillow>=13,<14"
          if ($LASTEXITCODE -ne 0) { throw 'Focused test dependency installation failed.' }
      - name: Check saved-port selection against this runner's real TCP ranges and a real reservation
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_windows_ports.py tests/test_windows_installation.py -k "not captured_cli_children"
          if ($LASTEXITCODE -ne 0) { throw 'Windows saved-port selection or setup composition checks failed.' }
      - name: Check the local root with real Windows store calls, the Windows chain builder and Edge
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -s -p no:cacheprovider tests/test_windows_trust.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows local-root trust checks failed.' }
      # Which replaced roots count, and their removal: the real crypt32 calls
      # on a private throwaway store (no trust change, no Windows question).
      # A skipped native case would hide the answer; on this lane it fails.
      - name: Require the native replaced-root store case with no skip
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider "tests/test_windows_trust.py::test_native_replaced_roots_are_found_and_removed_in_a_private_throwaway_store" | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'The native replaced-root store case failed.' }
          if (-not ($report -match '^1 passed') -or ($report -match 'skipped')) { throw 'The native replaced-root store case did not run; on this lane it must run.' }
      # The update check's registry lookup: real TLS against a local server
      # with a private root. On this lane the root also goes into the runner's
      # MACHINE store and is removed again, to show that a root in the Windows
      # store is accepted by the next lookup of the same process.
      - name: Check which server certificates the update check's registry lookup accepts
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_update_registry_trust.py
          if ($LASTEXITCODE -ne 0) { throw 'Registry lookup trust checks failed.' }
      # Update health of a new installation: the real reader of setup's record
      # on native Windows (private files, the installed-package reader and its
      # Git child policy) with this runner's Git. No task, no app, no network.
      - name: Check update health of a new installation against setup's record
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_update_health_setup_record.py
          if ($LASTEXITCODE -ne 0) { throw 'Setup-record update health checks failed.' }
      # What an update check lists on a new installation: the real inventory,
      # policy and classification readers on native Windows, on the files that
      # setup and a first chat leave (a build view of the shared source store
      # and the chat's binding), with this runner's Git. No worker, no app and
      # no network. A skipped native case would hide the answer; here it fails.
      - name: Check that a new installation's check offers no update for its first chat's modules or an unfetched source
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_update_new_installation.py | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'New-installation update listing checks failed.' }
          if (-not ($report -match ' passed') -or ($report -match 'skipped')) { throw 'A native new-installation case did not run; on this lane it must run.' }
      # A command that the active app version takes over, and the first start
      # with an update. First the launcher's real hand-over
      # (application_generations.hand_over) with real processes: the caller
      # gets control back when the output is complete, with the real exit
      # status, and no console window opens. Then the real `open` command
      # against this installation's host while that host restarts as another
      # package version, handed over as each of the three launchers on
      # people's PCs does it: the current one waits for the app, the two
      # earlier ones use os.execv. Real private files, pinned HTTPS and grant
      # store. The first two launchers run in a folder with a space in its
      # name; the earliest one cannot work there. A recorder stands in for the
      # browser; Task Scheduler, the update and the Windows certificate
      # question are not part of this check.
      - name: Check that the first start's open step waits for a restarting host and opens the browser once
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -s -p no:cacheprovider tests/test_windows_first_open.py | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'Windows first-start open checks failed.' }
          if ($report -match 'skipped') { throw 'A native first-start open case was skipped; on this lane it must run.' }
      # A start that a person can see, and one start at a time. The real sign
      # window on this runner's desktop (its text, that it takes no focus, that
      # it hides beside a message of its own program and goes away), the real
      # lock of a running start across two processes, the launcher's start
      # with both, the installation's real lock around setup's entries, and the
      # start texts over real private files. Stand-ins: the installation
      # check, Task Scheduler, the certificate question and the browser. A
      # runner's desktop has no person: what a person notices is a clean-room
      # step. A skipped case would hide the answer; on this lane it fails.
      - name: Check the sign of a running start, the one-start lock and the lock around setup's entries
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -s -p no:cacheprovider tests/test_windows_start.py | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'Windows start sign or lock checks failed.' }
          if (($report -join "`n") -match '\d+ skipped') { throw 'A native start case was skipped; on this lane it must run.' }
      # Also the next step that the sign-in page on the PC names: the host's
      # own look at the real record of the Start-menu entries through the real
      # private folder. A skipped case would hide the answer; on this lane it
      # fails.
      - name: Check sign-out of all browsers and remote sign-in by code (real private store, real HTTPS)
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_session_sign_out.py tests/test_browser_code.py | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'Sign-out of all browsers or remote sign-in by code checks failed.' }
          if (($report -join "`n") -match '\d+ skipped') { throw 'A native sign-in case was skipped; on this lane it must run.' }
      # Uninstall: real Start-menu shortcuts (ShellLink COM), the real HKCU
      # registry transaction, private files and NTFS sharing, in a throwaway
      # installation folder that the test removes. Task Scheduler is a stand-in.
      # Two cases hold a shortcut as another program can: an open that does not
      # share deleting (Windows error 32 at the pin) and a mapped view (error 5
      # at the delete). The uninstall waits its bounded time and stops; when the
      # other program lets go, it finishes. Each case prints what it saw, and
      # `-raP` shows that line for a case that passed. No `-s` here: without
      # pytest's own capture, an earlier case of this file leaves a closed stream.
      # One case leaves a person's file in the Start-menu folder at an uninstall
      # and then runs setup's step for the entries: the four shortcuts and the
      # Apps-list entry are added beside that file, which is unchanged.
      - name: Check uninstall order, a failed stop, a held shortcut and restored real Windows entries
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -raP -p no:cacheprovider tests/test_windows_consumer_shell.py | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'Windows uninstall entry checks failed.' }
          $text = $report -join "`n"
          if ($text -match '\d+ skipped') { throw 'A native uninstall entry case was skipped; on this lane it must run.' }
          foreach ($held in '"step": "entries-check", "error": "PermissionError", "code": 32', '"step": "shortcuts", "error": "PermissionError", "code": 5') {
            if (-not $text.Contains('UNINSTALL_HELD {' + $held)) { throw ('The case of a held shortcut did not print: ' + $held) }
          }
          if (-not $text.Contains('ENTRIES_AGAIN {"shortcuts": 4, "appsEntry": true, "kept": ["My own note.txt"], "unchanged": true')) { throw 'The case of a Start-menu folder that stayed did not print its result.' }
      # Uninstall asks the running app whether a chat is at work. Real sockets
      # and aiohttp's own errors on Windows: a listener that takes the
      # connection and gives no answer is asked again, and the refusal of a
      # port with no listener ends the wait. The case prints how many reads
      # that took, how long, and how each read ended. No app runs here.
      - name: Check the uninstall's question to a silent app and to a port with no app
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -s -p no:cacheprovider tests/test_installation_health.py -k "windows_working" | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'The checks of the uninstall question to the running app failed.' }
          if (($report -join "`n") -match '\d+ skipped') { throw 'A case of the uninstall question was skipped; on this lane it must run.' }
          if (-not (($report -join "`n") -match 'A port with no listener: \d+ read')) { throw 'The case with real sockets did not run.' }
      # Folder removal for uninstall: a real NTFS tree with a junction, folder
      # and file links, a hard link to an outside file, a read-only file, a path
      # of more than 400 characters and a file in use. Nothing outside the
      # throwaway folder may change. A lane that cannot make links fails.
      # Mapped program files move through handles into one held flat folder;
      # the step after exit deletes there and removes only empty named folders.
      - name: Check that folder removal never follows a link or leaves its folder

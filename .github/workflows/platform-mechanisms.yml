          raise SystemExit(0 if result['status'] == 'PASS' else 1)
          '@
          & "$env:DEFAULT_TRIAL_BASE/env/Scripts/python.exe" -I -B -c $check $env:DEFAULT_CANDIDATE_SOURCE $env:DEFAULT_TRIAL_BASE $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Five locked-host native cases failed; cold work was not started.' }
      - name: Check closed metadata observation and original-outcome preservation
        if: ${{ !inputs.remaining_runtime_only }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $check = @'
          import contextlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          names = (
              "test_metadata_primary_audit_is_exact_closed_and_outcome_neutral",
              "test_metadata_primary_audit_preserves_real_replace_error_and_cleanup",
              "test_metadata_primary_audit_setup_fault_preserves_original_operation",
              "test_default_runtime_probe_uninstrumented_journey_keeps_real_acceptance",
              "test_default_runtime_probe_uninstrumented_entry_has_no_worker_hook_path",
              "test_default_runtime_probe_diagnostic_privacy_bounds_and_schema",
          )
          class Results:
              def __init__(self):
                  self.collected = self.passed = self.failed = self.skipped = 0
              def pytest_collection_finish(self, session):
                  self.collected = len(session.items)
              def pytest_collectreport(self, report):
                  self.failed += int(report.failed)
                  self.skipped += int(report.skipped)
              def pytest_runtest_logreport(self, report):
                  self.passed += int(report.when == "call" and report.passed)
                  self.failed += int(report.failed)
                  self.skipped += int(report.skipped or hasattr(report, "wasxfail"))
          selected = Results()
          with (base / "private-observation-tests.log").open("x", encoding="utf-8") as logs:
              with contextlib.redirect_stdout(logs), contextlib.redirect_stderr(logs):
                  import pytest
                  code = pytest.main(["-q", "-p", "no:cacheprovider", "-p", "pytest_asyncio.plugin",
                      "-p", "aiohttp.pytest_plugin", "-o", "asyncio_mode=auto",
                      *("tests/test_runtime.py::" + name for name in names)], plugins=[selected])
          result = {key: getattr(selected, key) for key in ("collected", "passed", "failed", "skipped")}
          result["status"] = "PASS" if code == 0 and selected.collected == selected.passed == 15 and not (selected.failed or selected.skipped) else "FAIL"
          (base / "evidence/metadata-observation-tests.json").write_text(json.dumps(result), encoding="utf-8")
          print(json.dumps(result))
          raise SystemExit(0 if result["status"] == "PASS" else 1)
          '@
          & "$env:DEFAULT_TRIAL_BASE/env/Scripts/python.exe" -B -c $check $env:DEFAULT_TRIAL_BASE
          if ($LASTEXITCODE -ne 0) { throw 'Closed metadata observation tests failed; inspect bounded summary.' }
      - name: Require one native cold default-command call PASS with no skip
        if: ${{ !inputs.foreground_only }}
        # The maintained node has a finite 1200-second subprocess deadline.
        # Leave one minute for collection, safe evidence and cleanup handling.
        timeout-minutes: 21
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:DEFAULT_TRIAL_BASE
          $wheel = @(Get-ChildItem "$base/wheels/*.whl")
          if ($wheel.Count -ne 1) { throw 'Expected exactly one installed candidate wheel.' }
          $env:AMPLIFIER_WINDOWS_DEFAULT_RUNTIME_PYTHON = "$base/env/Scripts/python.exe"
          $env:AMPLIFIER_WINDOWS_DEFAULT_RUNTIME_WHEEL = $wheel[0].FullName
          $env:AMPLIFIER_WINDOWS_DEFAULT_RUNTIME_REPORT = "$base/probe-result.json"
          if ($env:REMAINING_RUNTIME_ONLY -eq 'true') {
            # Only this invocation's scratch can be inspected after confirmed
            # cleanup. This does not supply a worker project, lock or command.
            New-Item -ItemType Directory -Path "$base/cold-temp" -ErrorAction Stop | Out-Null
            $env:TEMP = "$base/cold-temp"
            $env:TMP = "$base/cold-temp"
          }
          $check = @'
          import contextlib, hashlib, importlib.metadata as metadata, importlib.util, json, os, pathlib, re, shutil, sys, tomllib
          from urllib.parse import parse_qs, urlsplit, urlunsplit
          source, base = map(pathlib.Path, sys.argv[1:])
          node = "tests/test_runtime.py::test_native_windows_default_runtime_command_cold_prepare_turn_and_stop"
          focused = os.environ.get('REMAINING_RUNTIME_ONLY') == 'true'
          def host_graph():
              rows = []
              for dist in metadata.distributions():
                  name = re.sub(r'[-_.]+', '-', dist.metadata['Name']).lower()
                  if name == 'amplifier-unified':
                      continue  # Independently byte-bound to the selected wheel.
                  direct = json.loads(dist.read_text('direct_url.json') or '{}')
                  rows.append({'name': name, 'version': dist.version, 'direct': direct})
              assert len({row['name'] for row in rows}) == len(rows)
              return sorted(rows, key=lambda row: row['name'])
          def worker_lock_graph(raw):
              rows = []
              for package in tomllib.loads(raw.decode())['package']:
                  name, version, origin = package['name'], package['version'], package['source']
                  assert re.fullmatch('[A-Za-z0-9_.-]{1,100}', name)
                  assert re.fullmatch('[A-Za-z0-9_.+!-]{1,100}', version)
                  row = {'name': name, 'version': version}
                  if set(origin) == {'registry'}:
                      assert origin['registry'] == 'https://pypi.org/simple'
                      row['kind'] = 'registry'
                  elif set(origin) == {'git'}:
                      url = urlsplit(origin['git'])
                      assert url.scheme == 'https' and url.netloc == 'github.com'
                      assert re.fullmatch('/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', url.path)
                      assert re.fullmatch('[a-f0-9]{40}', url.fragment)
                      sub = parse_qs(url.query).get('subdirectory', [''])[0]
                      assert re.fullmatch('[A-Za-z0-9_./-]{0,200}', sub) and '..' not in sub.split('/')
                      row.update(kind='git', url=urlunsplit((url.scheme, url.netloc, url.path, '', '')),
                                 commit=url.fragment, subdirectory=sub)
                  else:
                      assert origin == {'virtual': '.'} and name == 'amplifier-web-runtime'
                      row['kind'] = 'virtual'
                  rows.append(row)
              assert len(rows) <= 1000 and len({row['name'] for row in rows}) == len(rows)
              return sorted(rows, key=lambda row: row['name'])
          def read_worker_lock(root, manifest_sha256, lock_sha256):
              assert re.fullmatch('dr-[a-f0-9]{12}', root.name)
              assert re.fullmatch('[a-f0-9]{64}', manifest_sha256)
              assert re.fullmatch('[a-f0-9]{64}', lock_sha256)
              # uv creates an ordinary file, which can have TokenOwner rather
              # than TokenUser on an elevated runner. Observe bytes, NOT private
              # receipt authority: the maintained source reader pins parents,
              # refuses reparse traversal and bounds a stable regular-file read.
              from amplifier_web.test_origin_files import source_file
              mode, raw = source_file(root, 'app/runtime/' + manifest_sha256[:16] + '/uv.lock',
                                      '', 1024 * 1024)
              assert mode == '100644' and hashlib.sha256(raw).hexdigest() == lock_sha256
              return raw
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          class Results:
              def __init__(self):
                  self.collected, self.phases, self.invalid = [], [], False
              def pytest_collection_finish(self, session):
                  self.collected = [item.nodeid for item in session.items]
              def pytest_collectreport(self, report):
                  self.invalid |= report.failed or report.skipped
              def pytest_runtest_logreport(self, report):
                  if report.nodeid != node or hasattr(report, "wasxfail"):
                      self.invalid = True
                  self.phases.append((report.when, report.outcome))
              def passed(self, code):
                  return code == 0 and not self.invalid and self.collected == [node] and self.phases == [
                      ("setup", "passed"), ("call", "passed"), ("teardown", "passed")]
          result = {"schema": 1, "status": "FAIL", "publicAcceptance": False,
                    "qualification": "cold-default-command-scripted-provider",
                    "selection": {"collected": 0, "callPassed": False, "noSkips": False}}
          try:
              with (base / "private-check.log").open("x", encoding="utf-8") as logs:
                  with contextlib.redirect_stdout(logs), contextlib.redirect_stderr(logs):
                      audit = load("installed_candidate_audit", source / "tests/fixtures/windows_user_trial_probe.py")
                      wheel = pathlib.Path(os.environ["AMPLIFIER_WINDOWS_DEFAULT_RUNTIME_WHEEL"])
                      assert pathlib.Path(sys.executable).samefile(os.environ["AMPLIFIER_WINDOWS_DEFAULT_RUNTIME_PYTHON"])
                      before = audit.installed(wheel, result)
                      if focused:
                          five = json.loads((base / 'evidence/five-native.json').read_text(encoding='utf-8'))
                          assert five['status'] == 'PASS' and five['installed'] == before
                          graph = json.loads((base / 'locked-host.json').read_text(encoding='utf-8'))
                          assert host_graph() == graph
                          assert hashlib.sha256(json.dumps(graph, sort_keys=True).encode()).hexdigest() == five['hostGraphSha256']
                          result.update(qualification='cold-declared-worker-with-locked-host',
                              workerGraphScope='fresh-shipped-manifest-not-host-lock',
                              workflow=five['workflow'], hostGraphSha256=five['hostGraphSha256'],
                              hostLockSha256=five['lockSha256'])
                      candidate = json.loads((base / "candidate.json").read_text(encoding="utf-8"))["candidate"]
                      assert set(candidate) == {"head", "tree"} and all(
                          audit.re.fullmatch(r"[0-9a-f]{40,64}", value) for value in candidate.values())
                      result["candidate"] = candidate
                      if focused:
                          assert candidate == five['candidate'] == audit.candidate(source)
                          assert hashlib.sha256((source / 'uv.lock').read_bytes()).hexdigest() == five['lockSha256']
                      target = base / "selected-tests"
                      files = ("tests/conftest.py", "tests/test_runtime.py", "tests/fixtures/windows_default_runtime_probe.py")
                      for name in files:
                          path = target / name
                          path.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(source / name, path)
                          assert path.read_bytes() == (source / name).read_bytes()
                      assert {path.name for path in target.iterdir()} == {"tests"}
                      import pytest
                      selected = Results()
                      code = pytest.main(["-q", "-p", "no:cacheprovider", "-p", "pytest_asyncio.plugin",
                          "-p", "aiohttp.pytest_plugin", "-o", "asyncio_mode=auto",
                          "--rootdir", str(target), "--confcutdir", str(target),
                          "--basetemp", str(base / "pytest-temp"), str(target / node)], plugins=[selected])
                      result["selection"] = {"collected": len(selected.collected),
                          "callPassed": selected.phases.count(("call", "passed")) == 1,
                          "noSkips": not any(outcome == "skipped" for _, outcome in selected.phases)}
                      assert audit.installed(wheel, result) == before
                      if focused:
                          assert host_graph() == graph
                      probe = load("default_command_report", target / "tests/fixtures/windows_default_runtime_probe.py")
                      report = json.loads(pathlib.Path(os.environ["AMPLIFIER_WINDOWS_DEFAULT_RUNTIME_REPORT"]).read_text(encoding="utf-8"))
                      probe.validate_report(report)
                      result["probe"] = report
                      assert report["wheelSha256"] == hashlib.sha256(wheel.read_bytes()).hexdigest()
                      assert selected.passed(code) and report["status"] == "PASS"
                      if focused:
                          # Read ONLY the one new private root in this invocation's
                          # TEMP, after the unchanged probe proved both owned Jobs
                          # settled. Never delete scratch or inspect another run.
                          roots = list((base / 'cold-temp').glob('dr-*'))
                          assert len(roots) == 1 and re.fullmatch('dr-[a-f0-9]{12}', roots[0].name)
                          raw = read_worker_lock(roots[0], report['manifestSha256'], report['lockSha256'])
                          result['workerLockPackages'] = worker_lock_graph(raw)
                          result['workerImportsScope'] = 'probe-observed-imports-only-not-every-locked-package'
                      result["status"] = "PASS"
          except Exception:
              pass  # Fixed FAIL facts only. Never publish exception or subprocess prose.
          (base / "evidence/publicresult.json").write_text(json.dumps(result, sort_keys=True), encoding="utf-8")
          raise SystemExit(0 if result["status"] == "PASS" else 1)
          '@
          & "$base/env/Scripts/python.exe" -I -B -c $check $env:DEFAULT_CANDIDATE_SOURCE $base
          if ($LASTEXITCODE -ne 0) { throw 'Native default-command check failed; inspect bounded publicresult.json.' }
      - name: Require installed foreground CLI TLS, public open and graceful cleanup
        if: ${{ !inputs.remaining_runtime_only }}
        # Default success() sequencing: never run this cell after cold failure.
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:DEFAULT_TRIAL_BASE
          $wheel = @(Get-ChildItem "$base/wheels/*.whl")
          if ($wheel.Count -ne 1) { throw 'Expected exactly one foreground candidate wheel.' }
          $probe = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/windows_user_trial_probe.py'
          & "$base/env/Scripts/python.exe" -I -B $probe --cli-run $wheel[0].FullName --candidate-receipt "$base/candidate.json" --receipt "$base/evidence/foreground.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native foreground CLI check failed; inspect bounded foreground.json.' }
      - name: Upload only the bounded default-runtime result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-default-runtime
          path: |
            ${{ runner.temp }}/dr-ci/evidence/publicresult.json
            ${{ runner.temp }}/dr-ci/evidence/metadata-observation-tests.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload only bounded foreground CLI facts
        if: ${{ always() && !inputs.remaining_runtime_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-foreground-cli
          path: ${{ runner.temp }}/dr-ci/evidence/foreground.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload only bounded five-case locked-host facts
        if: ${{ always() && inputs.remaining_runtime_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-remaining-locked-host
          path: ${{ runner.temp }}/dr-ci/evidence/five-native.json
          if-no-files-found: warn
          retention-days: 7
  windows-bootstrap-offline:
    if: ${{ !inputs.remaining_runtime_only && !inputs.candidate_ref && github.event_name == 'workflow_dispatch' && inputs.bootstrap_only }}
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Record exact source, policy and native prerequisites without installing app dependencies
        id: bootstrap-init
        shell: python -I -S -B {0}
        run: |
          import runpy, sys
          sys.argv = ["tests/fixtures/windows_bootstrap_ci.py", "--initialize"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Compile native bootstrap and exercise actual parser and Windows argv without installation
        shell: python -I -S -B {0}
        run: |
          import runpy, sys
          sys.argv = ["tests/fixtures/windows_native_bootstrap_ci.py"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      # Literal custom shells avoid Actions' built-in PowerShell wrapper, which
      # can inject an execution-policy override. Policy refusal remains failure.
      - name: Offline fixtures under Windows PowerShell 5.1
        id: bootstrap-desktop
        timeout-minutes: 5
        # Actions recognizes this basename and gives {0} a .ps1 extension.
        shell: powershell -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S -B tests/fixtures/windows_bootstrap_ci.py --run desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop offline bootstrap checks failed; inspect the sanitized result.' }
      - name: Offline fixtures under PowerShell 7
        if: ${{ !cancelled() && steps.bootstrap-init.outcome == 'success' && steps.bootstrap-desktop.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S -B tests/fixtures/windows_bootstrap_ci.py --run core
          if ($LASTEXITCODE -ne 0) { throw 'Core offline bootstrap checks failed; inspect the sanitized result.' }
      - name: Require both exact offline fixture results, with no skipped readiness
        if: always()
        shell: python -I -S -B {0}
        run: |
          import runpy, sys
          sys.argv = ["tests/fixtures/windows_bootstrap_ci.py", "--summarize"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Retain only bounded sanitized offline bootstrap facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-bootstrap-offline-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unified-bootstrap-offline/result.json
            ${{ runner.temp }}/unified-native-bootstrap-offline/result.json
          if-no-files-found: error
          retention-days: 7
      - scripts/install.ps1
      - docs/design/native-windows-installation.md
permissions:
  contents: read
jobs:
  passive-process-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require ordinary Windows Python and both PowerShell hosts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S -B -c "import sys,sysconfig,struct; assert sys.platform == 'win32'; assert sys.implementation.name == 'cpython'; assert sys.version_info[:2] == (3,13); assert struct.calcsize('P') == 8; assert not sysconfig.get_config_var('Py_GIL_DISABLED'); assert sys._base_executable; print(sys.version); print(sys.getwindowsversion())"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Python preflight failed.' }
          foreach ($hostSpec in @(@('powershell.exe', '5.1'), @('pwsh.exe', '7'))) {
            $hostCommand = Get-Command $hostSpec[0] -CommandType Application -ErrorAction Stop
            & $hostCommand.Source -NoProfile -NonInteractive -Command "`$version = `$PSVersionTable.PSVersion; if (-not `$version.ToString().StartsWith('$($hostSpec[1])')) { exit 1 }; `$version.ToString()"
            if ($LASTEXITCODE -ne 0) { throw 'A required PowerShell host is unavailable or has the wrong version.' }
          }
      - name: Check standalone platform mechanisms and installer fixtures
        run: >
          python -I -S -B -c
          "import sys, unittest; sys.path.insert(0, '.');
          suite = unittest.TestSuite(unittest.defaultTestLoader.discover('tests', pattern=pattern)
          for pattern in ('test_generation_leases.py', 'test_installation_guidance.py',
          'test_repair_lock_platform.py', 'test_worker_platform_io.py',
          'test_windows_files.py', 'test_windows_owned_process.py',
          'test_windows_installer.py'));
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(not result.wasSuccessful())"
  windows-private-config-tls:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare only the focused test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S -B -c "import sys,sysconfig,struct; assert sys.platform == 'win32'; assert sys.version_info[:2] == (3,13); assert struct.calcsize('P') == 8; assert not sysconfig.get_config_var('Py_GIL_DISABLED'); print(sys.version); print(sys.getwindowsversion())"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Python preflight failed.' }
          python -m venv .native-test-venv
          if ($LASTEXITCODE -ne 0) { throw 'Test environment creation failed.' }
          .\.native-test-venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple --only-binary=:all: "pytest>=8,<10" "cryptography>=44,<51" "PyYAML>=6.0.3,<7" "filelock>=3.20,<4" "aiohttp==3.14.4"
          if ($LASTEXITCODE -ne 0) { throw 'Focused test dependency installation failed.' }
          .\.native-test-venv\Scripts\python.exe -I -B -c "import importlib.metadata as m; print({name:m.version(name) for name in ('pytest','cryptography','PyYAML','filelock','aiohttp')})"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency readback failed.' }
      - name: Check private configuration, TLS and service policy without task registration
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_deployment.py tests/test_windows_tls.py tests/test_windows_service.py -k "not native_synthetic_task_create_run_stop_remove"
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration, TLS or service policy checks failed.' }
      - name: Check actual CLI service root binding without tasks or health HTTP
        shell: pwsh
        run: |
          .\.native-test-venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_cli_deployment.py::test_service_cli_binds_every_operation_to_selected_data_root tests/test_cli_deployment.py::test_background_launcher_uses_platform_neutral_owned_service_check tests/test_cli_deployment.py::test_windows_service_cli_real_chain_root_boundary tests/test_cli_deployment.py::test_windows_default_launcher_refuses_before_setup_or_browser
          if ($LASTEXITCODE -ne 0) { throw 'CLI service root binding checks failed.' }
  windows-user-trial:
    # Candidate-only combined boundary, not a universal suite/release gate.
    # The existing 5-minute stdlib/PowerShell and private-config lanes are unchanged.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      UV_NO_BUILD_PACKAGE: amplifier-core
      UV_PYTHON_DOWNLOADS: never
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Record exact candidate and build a noneditable wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'ut'
          New-Item -ItemType Directory -Path "$base/evidence" -Force | Out-Null
          "TRIAL_BASE=$base" >> $env:GITHUB_ENV
          python -I -B tests/fixtures/windows_user_trial_probe.py --candidate . --receipt "$base/evidence/result.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity check failed.' }
          python -I -S -B -c "import sys,sysconfig,struct; assert sys.platform=='win32'; assert sys.implementation.name=='cpython'; assert sys.version_info[:2]==(3,13); assert struct.calcsize('P')==8; assert not sysconfig.get_config_var('Py_GIL_DISABLED')"
          if ($LASTEXITCODE -ne 0) { throw 'Native Python preflight failed.' }
          uv build --wheel --out-dir "$base/wheels"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate wheel build failed.' }
      - name: Install candidate and maintained real worker modules (CI setup only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv venv --python (Get-Command python).Source "$env:TRIAL_BASE/env"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate environment creation failed.' }
          $modules = @(python -I -B tests/fixtures/windows_user_trial_probe.py --requirements pyproject.toml)
          if ($LASTEXITCODE -ne 0) { throw 'Maintained fixture dependency selection failed.' }
          $wheel = @(Get-ChildItem "$env:TRIAL_BASE/wheels/*.whl")
          if ($wheel.Count -ne 1) { throw 'Expected exactly one candidate wheel.' }
          uv pip install --python "$env:TRIAL_BASE/env/Scripts/python.exe" --only-binary amplifier-core $wheel[0].FullName "pytest>=8,<10" "pytest-asyncio>=1.4,<2" "pytest-aiohttp>=1.1,<2" @modules
          if ($LASTEXITCODE -ne 0) { throw 'Installed candidate graph preparation failed.' }
      - name: Require native prerequisite cells then probe private auth, tool, Stop and host resume
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wheel = @(Get-ChildItem "$env:TRIAL_BASE/wheels/*.whl")
          $probe = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/windows_user_trial_probe.py'
          # -I removes checkout/PYTHONPATH shadowing; only the fixture is source.
          # Only the journey TLS listener and the exact wrong-leaf/redirect
          # fixtures' owned numeric endpoints are admitted; no blanket loopback.
          & "$env:TRIAL_BASE/env/Scripts/python.exe" -I -B $probe --run $wheel[0].FullName --receipt "$env:TRIAL_BASE/evidence/result.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate journey failed; inspect the safe JSON stage/check facts.' }
      - name: Upload only allowlisted public facts, never scratch or raw diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-user-trial
          path: ${{ runner.temp }}/ut/evidence/result.json
          if-no-files-found: warn
          retention-days: 7
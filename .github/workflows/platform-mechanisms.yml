# Diagnostic branch only. Not a replacement for the trial/main qualification workflow.
# Reuse the registered workflow path so a manual branch dispatch needs no main merge.
name: Manual Windows shared Git diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Compare public Git launch routes once
        shell: pwsh
        run: |
          python -I -S -B tests/fixtures/windows_shared_git_diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'Bounded Git diagnostic failed; inspect the safe artifact.' }
      - name: Require private native control commands and ordinary child EOF
        shell: pwsh
        run: |
          python -I -S -B -c "import sys,unittest; sys.path.insert(0,'.'); suite=unittest.defaultTestLoader.discover('tests',pattern='test_worker_platform_io.py'); selected=unittest.TestSuite(test for group in suite for case in group for test in case if test.id().endswith('NativeControlInputTests.test_private_commands_survive_while_ordinary_child_sees_eof')); assert selected.countTestCases()==1; result=unittest.TextTestRunner(verbosity=2).run(selected); assert result.testsRun==1 and not result.skipped; sys.exit(not result.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { throw 'Native private-control command/child-EOF contract failed.' }
      - name: Upload only the closed safe result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-shared-git-diagnostic
          path: windows-shared-git-diagnostic-result.json
          if-no-files-found: error
          retention-days: 7

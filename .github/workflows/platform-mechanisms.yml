name: Focused platform mechanisms
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/platform-mechanisms.yml
      - amplifier_web/generation_leases.py
      - tests/test_generation_leases.py
      - tests/test_installation_guidance.py
      - README.md
      - scripts/install.sh
      - docs/design/native-windows-installation.md
permissions:
  contents: read
jobs:
  passive-process-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check passive process inspection and installation guidance
        run: >
          python -I -S -B -c
          "import sys, unittest; sys.path.insert(0, '.');
          suite = unittest.TestSuite(unittest.defaultTestLoader.discover('tests', pattern=pattern)
          for pattern in ('test_generation_leases.py', 'test_installation_guidance.py'));
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(not result.wasSuccessful())"
      - 'tests/fixtures/worktrees_ui_server.py'
      - 'frontend/tests/multi-repository-worktrees-browser.mjs'
      - 'frontend/tests/resource-reservations-browser.mjs'
      - 'skills/coordinate-work/**'
      - 'tests/fixtures/coordination_ui_server.py'
      - 'frontend/tests/coordination-browser.mjs'
      - 'frontend/tests/coordination-disclosure-diagnostics.mjs'
      - '.github/workflows/coordination.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - name: Resolve the declared live-runtime source
        id: runtime-dependency
        run: |
          python -c 'import tomllib; p=tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb")); print("revision=" + p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Prepare the declared runtime for mounted coordination tests
        run: >-
          uv pip install --python .venv/bin/python
          .ci/loop-live
          'amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main'
      - name: Verify and retain coordination runtime readiness
        run: |
          uv run --no-sync python - <<'PY'
          import json, subprocess, sys, tomllib
          from importlib import import_module
          from importlib.metadata import version
          from pathlib import Path
          from amplifier_module_loop_live import BundleLiveOrchestrator
          from amplifier_module_context_simple import mount
          assert callable(BundleLiveOrchestrator) and callable(mount)
          declared = tomllib.loads(Path('amplifier_web/runtime_deps/pyproject.toml').read_text())
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          record = {
              'candidate': git('rev-parse', 'HEAD'),
              'declaredLoopRevision': declared['tool']['uv']['sources']['amplifier-module-loop-live']['rev'],
              'selectedLoopRevision': git('-C', '.ci/loop-live', 'rev-parse', 'HEAD'),
              'python': sys.version.split()[0],
              'versions': {name: version(name) for name in (
                  'amplifier-core', 'amplifier-module-loop-live',
                  'amplifier-module-loop-streaming', 'amplifier-module-context-simple')},
              'imports': {name: bool(import_module(name)) for name in (
                  'amplifier_module_loop_live', 'amplifier_module_context_simple')},
          }
          output = Path('output/coordination-runtime-readiness.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record))
          PY
      - run: >-
          uv run --no-sync pytest
          tests/test_coordination.py tests/test_coordination_generation.py
          tests/test_cross_workspace_coordination.py tests/test_peer_scope.py
          tests/test_coordination_revisions.py tests/test_request_cancellation.py tests/test_outcome_acknowledgement.py
          tests/test_coordination_return_policy.py
          tests/test_test_outcome_acknowledgement.py
          tests/test_coordination_bridge_returns.py
          tests/test_assignment_brief.py
          tests/test_background_reservation_recovery.py
          tests/test_collaborative_workspaces.py tests/test_collaboration_input.py tests/test_peer_auto_delivery.py
          tests/test_task_continuity.py tests/test_blocked_peer_input.py
          tests/test_creation_inheritance.py tests/test_inherited_module_sources.py
          tests/test_runtime_profile_inputs.py tests/test_runtime_source_declarations.py
          tests/test_state_write_scopes.py tests/test_host_storage.py
          tests/test_workspace_repair_outcomes.py tests/test_worktrees.py
          tests/test_handoff_model_admission.py
          tests/test_peer_creation_operation.py
          tests/test_resource_reservations.py
          tests/test_workspace_awareness.py
          tests/test_coordination_delivery.py
          tests/test_output_images.py tests/test_output_image_pairs.py
          tests/test_voice_visual.py tests/test_computer_visual.py
          tests/test_multi_repository_worktrees.py
          tests/test_file_access_policy.py tests/test_canvas_files.py tests/test_management.py
          tests/test_service.py tests/test_runtime.py tests/test_agent_chat_controls.py -q
      - name: Verify blocked peer input through the native boundary
        run: |
          uv run --no-sync pytest -q tests/test_blocked_peer_native.py --junitxml=output/blocked-peer-native.xml
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          rows = ET.parse('output/blocked-peer-native.xml').getroot().findall('.//testcase')
          assert len(rows) == 3
          assert all(not any(row.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for row in rows)
          PY
      - name: Verify peer intake native through the native boundary
        run: |
          uv run --no-sync pytest -q tests/test_peer_intake_native.py --junitxml=output/peer-intake-native.xml
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          rows = ET.parse('output/peer-intake-native.xml').getroot().findall('.//testcase')
          assert len(rows) == 8
          assert all(not any(row.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for row in rows)
          PY
      - name: Verify repeated peer returns through real Worker processes
        run: |
          uv run --no-sync pytest -q tests/test_peer_return_workflow.py \
            --basetemp="${{ runner.temp }}/peer-return" --junitxml=output/peer-return-workers.xml
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          rows = ET.parse('output/peer-return-workers.xml').getroot().findall('.//testcase')
          assert len(rows) == 1
          assert rows[0].get('name') == 'test_existing_roots_correct_rereview_and_return_through_real_workers'
          assert all(not any(row.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for row in rows)
          PY
      - name: Retain peer return evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peer-return-worker-evidence
          path: |
            output/peer-return-workers.xml
            ${{ runner.temp }}/peer-return/**/evidence.json
            ${{ runner.temp }}/peer-return/**/observed-events.json
            ${{ runner.temp }}/peer-return/**/author.jsonl
            ${{ runner.temp }}/peer-return/**/reviewer.jsonl
          if-no-files-found: warn
      - name: Verify mounted child identity and file boundaries
        run: >-
          uv run --locked
          --with 'amplifier-module-loop-live @ git+https://github.com/microsoft/amplifier-module-loop-live@main'
          --with 'amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main'
          python -c "import os, sys, pytest; os.environ['UNIFIED_RUNTIME_PYTHON'] = sys.executable;
          sys.exit(pytest.main(['-q', 'tests/test_child_app_authority.py', 'tests/test_child_file_policy.py',
          'tests/test_child_image_policy.py', 'tests/test_child_resume_admission.py', 'tests/test_runtime_worker.py',
          'tests/test_app_guidance.py']))"
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Exercise related work through the browser
        working-directory: frontend
        env:
          AMPLIFIER_TEST_OUTPUT_DIR: ${{ runner.temp }}/coordination-browser
        run: node tests/coordination-browser.mjs
      - name: Retain coordination disclosure failure facts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordination-disclosure-failure
          path: ${{ runner.temp }}/coordination-browser/**/coordination-disclosure-failure.json
          if-no-files-found: ignore
      - name: Exercise exact request withdrawal and cancellation
        working-directory: frontend
        run: node tests/request-cancellation-browser.mjs
      - name: Exercise resource reservations through the browser
        working-directory: frontend
        run: node tests/resource-reservations-browser.mjs
      - name: Exercise explicit repository selection through the browser
        working-directory: frontend
        run: node tests/multi-repository-worktrees-browser.mjs
      - name: Exercise active work and private file declarations through the browser
        working-directory: frontend
        run: node tests/workspace-awareness-browser.mjs
      - name: Exercise owned test environment recovery and saved-copy choices
        working-directory: frontend
        env:
          AMPLIFIER_TEST_OUTPUT_DIR: ${{ runner.temp }}/test-environments
        run: node tests/test-environments-browser.mjs
      - name: Retain test environment browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-environments-browser-evidence
          path: |
            ${{ runner.temp }}/test-environments
            output/coordination-runtime-readiness.json
          if-no-files-found: warn

name: Task coordination contracts
on:
  pull_request:
    paths:
      - 'amplifier_operations/coordination.py'
      - 'amplifier_web/coordination.py'
      - 'amplifier_web/service.py'
      - 'amplifier_web/runtime.py'
      - 'amplifier_web/runtime_worker.py'
      - 'amplifier_web/host/children.py'
      - 'frontend/src/coordination*'
      - 'frontend/src/main.jsx'
      - 'tests/test_coordination.py'
      - 'tests/fixtures/coordination_ui_server.py'
      - 'frontend/tests/coordination-browser.mjs'
      - '.github/workflows/coordination.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest tests/test_coordination.py tests/test_service.py tests/test_runtime.py tests/test_agent_chat_controls.py -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # Browser coverage is available in browser-checks.yml (manual only).

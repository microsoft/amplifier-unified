  pull_request:
    paths:
      - 'amplifier_operations/coordination.py'
      - 'amplifier_web/coordination.py'
      - 'amplifier_web/peer_scope.py'
      - 'tests/test_cross_workspace_coordination.py'
      - 'tests/test_peer_scope.py'
      - 'amplifier_web/request_cancellation.py'
      - 'amplifier_web/outcome_acknowledgement.py'
      - 'tests/test_request_cancellation.py'
      - 'tests/test_outcome_acknowledgement.py'
      - 'tests/test_test_outcome_acknowledgement.py'
      - 'frontend/tests/request-cancellation-browser.mjs'
      - 'amplifier_web/collaboration*.py'
      - 'amplifier_web/app_guidance.py'
      - 'amplifier_web/assignments.py'
      - 'amplifier_web/assignment_brief.py'

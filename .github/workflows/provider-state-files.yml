name: Provider state files
# The Anthropic provider module keeps two small files of its own. It builds
# their default paths from the person's home folder, which is outside a Windows
# installation from the setup file. The host gives the module paths in the
# shared Amplifier home (amplifier_web/provider_state_files.py).
#
# Both jobs load the real module from the locked test dependencies through
# Core's own session initialization, and the module talks to an HTTP server on
# the runner. Nothing goes to a model and no key is needed. Without the host's
# step the files appear below the profile; with it they are in the shared home
# and the profile stays empty. A case that fails, has an error, is skipped,
# is deselected or is expected to fail fails the job, and so does a run with
# no case: each step checks the exit status of pytest and its summary line.
# tests/test_provider_state_files_workflow.py runs each step's own script with
# such results: the Linux step under bash, the Windows step under PowerShell
# on the native runner. The rule does not count the cases.
#
# It is not setup-file or clean-account acceptance: no installation, no app
# and no chat.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/provider-state-files.yml
      - amplifier_web/provider_state_files.py
      - amplifier_web/host/initialization.py
      - amplifier_web/host/session.py
      - amplifier_web/host/children.py
      - amplifier_web/provider_probe.py
      - amplifier_web/portability_probe.py
      - amplifier_web/provider_environment.py
      - amplifier_web/session_files.py
      - amplifier_web/windows_consumer.py
      - amplifier_web/ai_services.json
      - README.md
      - tests/test_provider_state_files.py
      - tests/test_provider_state_files_workflow.py
      - tests/test_installation_guidance.py
      # Test files that the state-file cases take fixtures and numbers from.
      - tests/test_host_session_resume.py
      - tests/test_provider_environment.py
      - tests/test_windows_path_budget.py
      # A dependency change can bring a module version with another file or name.
      - pyproject.toml
      - uv.lock
permissions:
  contents: read
jobs:
  windows:
    name: Provider state files on native Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install the locked application and test dependencies (CI setup only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --locked --group dev --no-install-project --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed.' }
      # -rA prints every case by name. A skipped native case would hide the answer.
      - name: Require the real module's files in the shared home and none in the profile, with no skip
        shell: pwsh
        env:
          AMPLIFIER_REQUIRE_PROVIDER_STATE_FILES: '1'
        run: |
          .\.venv\Scripts\python.exe -B -m pytest -q -rA -p no:cacheprovider tests/test_provider_state_files.py | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'A provider state-file case failed on native Windows.' }
          $summary = [string]($report | Where-Object { $_ } | Select-Object -Last 1)
          if ($summary -notmatch '^\d+ passed(, \d+ warnings?)? in ') { throw "A case did not pass or did not run; on this lane every case must run: $summary" }
      # The step above is a script too. This runs that script under PowerShell
      # with results that it must refuse.
      - name: Require that the step above fails when a case fails or does not run
        shell: pwsh
        env:
          AMPLIFIER_REQUIRE_PROVIDER_STATE_FILES: '1'
        run: |
          .\.venv\Scripts\python.exe -B -m pytest -q -rA -p no:cacheprovider "tests/test_provider_state_files_workflow.py::test_the_windows_step_own_script_passes_only_when_every_case_passed" | Tee-Object -Variable report
          if ($LASTEXITCODE -ne 0) { throw 'The step that requires the state-file cases accepts a wrong result, or this check of it did not run. Read the pytest output above.' }
          $summary = [string]($report | Where-Object { $_ } | Select-Object -Last 1)
          if ($summary -notmatch '^\d+ passed(, \d+ warnings?)? in ') { throw "The cases of the step's own script did not all run: $summary" }
  linux:
    name: Provider state files, the README item and the probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      # "shell: bash" gives pipefail: without it the step would take the status
      # of tee, not of pytest. The summary line must name passed cases only.
      - name: Require every state-file case with no skip
        shell: bash
        env:
          AMPLIFIER_REQUIRE_PROVIDER_STATE_FILES: '1'
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q -rA tests/test_provider_state_files.py | tee report.txt
          summary=$(grep -v '^$' report.txt | tail -n 1)
          if ! grep -qE '^[0-9]+ passed(, [0-9]+ warnings?)? in ' <<<"$summary"; then
            echo "A case did not pass or did not run; on this lane every case must run: $summary" >&2
            exit 1
          fi
      # The README item "Folder" names every AI connection that the app offers.
      - name: Check the README item and the tests around the changed code
        run: >-
          uv run --no-sync pytest -q -ra tests/test_provider_state_files_workflow.py
          tests/test_installation_guidance.py tests/test_provider_environment.py
          tests/test_portability_probe.py tests/test_ephemeral_mcp.py tests/test_host_children.py
          tests/test_image_setup.py tests/test_catalog_review_boundaries.py

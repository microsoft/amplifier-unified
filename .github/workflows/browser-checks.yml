name: Extended browser checks
# Local/manual qualification and post-release coverage; never a publication gate.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Record intended coverage before dependency setup
        run: >-
          python scripts/browser_check_runner.py
          --plan frontend/tests/browser-checks.json
          --output output/browser-checks --initialize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Check work segmentation and interim browser oracles
        working-directory: frontend
        run: |
          mkdir -p ../output/browser-checks
          set -o pipefail
          node --test tests/work-segments.test.mjs tests/interim-replies.test.mjs tests/interim-cold-oracle.test.mjs 2>&1 | tee ../output/browser-checks/interim-node-controls.tap
      - run: npm run build --prefix frontend
      - name: Install browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run all extended browser scenarios serially
        run: >-
          uv run --no-sync python scripts/browser_check_runner.py
          --plan frontend/tests/browser-checks.json
          --output output/browser-checks
          --budget-seconds 1500
      - name: Retain scenario coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-browser-evidence-${{ github.run_attempt }}
          path: |
            output/browser-checks/
            output/active-client-performance/
            output/state-transport-browser/
            output/scoped-navigation/
            output/selected-context/
          if-no-files-found: warn

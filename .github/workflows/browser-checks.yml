name: Extended browser checks
# Local/manual qualification and post-release coverage; never a publication gate.
on:
  workflow_dispatch:
    inputs:
      destination_history:
        description: Run fixed Back/Forward units, build and five navigation browser scenarios
        type: boolean
        default: false
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  browser:
    if: ${{ !inputs.destination_history }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Record intended coverage before dependency setup
        run: >-
          python scripts/browser_check_runner.py
          --plan frontend/tests/browser-checks.json
          --output output/browser-checks --initialize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Install browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run all extended browser scenarios serially
        run: >-
          uv run --no-sync python scripts/browser_check_runner.py
          --plan frontend/tests/browser-checks.json
          --output output/browser-checks
          --budget-seconds 1500
      - name: Retain scenario coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-browser-evidence-${{ github.run_attempt }}
          path: |
            output/browser-checks/
            output/active-client-performance/
            output/state-transport-browser/
            output/scoped-navigation/
            output/selected-context/
          if-no-files-found: warn
  destination-history:
    if: ${{ inputs.destination_history }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze the fixed navigation plan before setup
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          output = Path('output/destination-history')
          output.mkdir(parents=True)
          plan = json.loads(Path('frontend/tests/browser-checks.json').read_text())
          wanted = ('destination-history', 'conversation-navigation', 'archive-feedback', 'canvas-dirty', 'draft-switch')
          rows = plan['scenarios']
          assert all(sum(row['id'] == name for row in rows) == 1 for name in wanted)
          selected = [next(row for row in rows if row['id'] == name) for name in wanted]
          (output / 'plan.json').write_text(json.dumps({'schemaVersion': 1, 'scenarios': selected}, indent=2))
          git = lambda *args: subprocess.check_output(['git', *args])
          assert not git('status', '--porcelain', '--untracked-files=no')
          files = git('ls-files', '-z').decode().split('\0')
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files if name}
          (output / 'source.json').write_text(json.dumps({
              'revision': git('rev-parse', 'HEAD').decode().strip(),
              'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'scope': 'Focused source baseline, not full-suite or installed-wheel acceptance',
              'files': hashes}, indent=2))
          PY
          python scripts/browser_check_runner.py --plan output/destination-history/plan.json --output output/browser-checks --initialize
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - id: python_dependencies
        run: uv sync --locked --group dev --group artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: node_dependencies
        run: npm ci --prefix frontend
      - name: Focused backend and runner contracts
        if: ${{ !cancelled() && steps.python_dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          uv run --no-sync pytest --asyncio-mode=auto -v -ra --tb=short --junitxml=output/destination-history/python.xml \
            tests/test_history_scope.py tests/test_auth.py tests/test_client_navigation.py tests/test_live_clients.py \
            tests/test_approachable_shell.py tests/test_new_chat.py tests/test_canvas_files.py tests/test_canvas_views.py \
            tests/test_browser_check_runner.py 2>&1 | tee output/destination-history/python.log
      - name: Focused frontend regressions
        if: ${{ !cancelled() && steps.node_dependencies.outcome == 'success' }}
        working-directory: frontend
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/destination-history.test.mjs tests/destination-history-ui.test.mjs \
            tests/api.test.mjs tests/conversation-navigation.test.mjs tests/pending-view.test.mjs \
            tests/settings-drafts.test.mjs tests/work-shell.test.mjs tests/archive-action.test.mjs \
            tests/archive-feedback.test.mjs 2>&1 | tee ../output/destination-history/frontend.log
      - name: Build and retain the exact derived assets
        id: build
        if: ${{ !cancelled() && steps.node_dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build --prefix frontend 2>&1 | tee output/destination-history/build.log
          tar -czf output/destination-history/built-static.tar.gz -C amplifier_web static
          sha256sum output/destination-history/built-static.tar.gz > output/destination-history/built-static.sha256
          git diff --stat -- amplifier_web/static > output/destination-history/derived-assets.txt
      - name: Install Chromium
        id: browser_runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run all five fixed navigation scenarios serially
        if: ${{ !cancelled() && steps.python_dependencies.outcome == 'success' && steps.browser_runtime.outcome == 'success' }}
        run: >-
          uv run --no-sync python scripts/browser_check_runner.py
          --plan output/destination-history/plan.json
          --output output/browser-checks
          --budget-seconds 1200
      - name: Require executed evidence without skips
        if: always()
        run: |
          python - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          output = Path('output/destination-history')
          output.mkdir(parents=True, exist_ok=True)
          verdict = {'scope': 'Focused source baseline only', 'checks': {}}
          def check(name, observe):
              try:
                  verdict['checks'][name] = {'status': 'passed', **observe()}
              except Exception as exc:
                  verdict['checks'][name] = {'status': 'failed', 'error': str(exc)}
          def backend():
              cases = ET.parse(output / 'python.xml').getroot().findall('.//testcase')
              counts = {tag: sum(case.find(tag) is not None for case in cases)
                        for tag in ('failure', 'error', 'skipped')}
              assert cases and not any(counts.values()), {'cases': len(cases), **counts}
              return {'cases': len(cases), **counts}
          def frontend():
              text = (output / 'frontend.log').read_text()
              counts = {key: int(value) for key, value in re.findall(
                  r'^# (tests|pass|fail|skipped|cancelled|todo) (\d+)\s*$', text, re.M)}
              assert counts.keys() == {'tests', 'pass', 'fail', 'skipped', 'cancelled', 'todo'}, counts
              assert counts['tests'] > 0 and counts['pass'] == counts['tests'], counts
              assert all(counts[key] == 0 for key in ('fail', 'skipped', 'cancelled', 'todo')), counts
              return counts
          def browsers():
              report = json.loads(Path('output/browser-checks/results.json').read_text())
              plan = json.loads((output / 'plan.json').read_text())['scenarios']
              rows = report['scenarios']
              assert [row['id'] for row in rows] == [row['id'] for row in plan]
              assert len(rows) == 5 and report['complete'] and report['passed']
              for row, expected in zip(rows, plan):
                  assert row['command'] == expected['command'] and row.get('env', {}) == expected.get('env', {})
                  assert row['status'] == 'passed' and row['exitCode'] == 0 and row['reason'] is None
                  assert row['cleanup'] == {'remaining': [], 'terminated': 0}
              return {'scenarios': len(rows)}
          check('backend', backend)
          check('frontend', frontend)
          check('browsers', browsers)
          verdict['passed'] = all(row['status'] == 'passed' for row in verdict['checks'].values())
          (output / 'qualification.json').write_text(json.dumps(verdict, indent=2))
          print(json.dumps(verdict))
          raise SystemExit(0 if verdict['passed'] else 1)
          PY
      - name: Retain focused results including failures and unrun cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destination-history-baseline-${{ github.run_attempt }}
          path: |
            output/destination-history/
            output/browser-checks/
          if-no-files-found: error

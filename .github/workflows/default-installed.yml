name: Installed default capability qualification
on:
  workflow_dispatch:
    inputs:
      desktop_safety:
        description: Run the separate fixed 22+3 desktop proof instead of the IC-13 baseline
        type: boolean
        default: false
      root_guest:
        description: Run only the eight isolated Linux UID-separated guest cases
        type: boolean
        default: false
      installed_pwa:
        description: Run only the headed installed-PWA case in a private display
        type: boolean
        default: false
  workflow_call:
    inputs:
      desktop_safety:
        type: boolean
        default: false
      root_guest:
        type: boolean
        default: false
      installed_pwa:
        type: boolean
        default: false
    secrets:
      LOOP_LIVE_CI_READ_KEY:
        required: true
permissions:
  contents: read
jobs:
  default-installed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject conflicting fixed stages before preparation
        shell: bash
        env:
          DESKTOP_SAFETY: ${{ inputs.desktop_safety }}
          ROOT_GUEST: ${{ inputs.root_guest }}
          INSTALLED_PWA: ${{ inputs.installed_pwa }}
        run: |
          selected=0
          for choice in "$DESKTOP_SAFETY" "$ROOT_GUEST" "$INSTALLED_PWA"; do
            if [[ "$choice" == true ]]; then selected=$((selected + 1)); fi
          done
          if (( selected > 1 )); then echo "Select one fixed stage" >&2; exit 1; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Resolve exact private source from the committed pin manifest
        id: pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          p = json.loads(Path('scripts/default-installed-pins.json').read_text())
          rows = [r for r in p['repositories'] if r.get('private')]
          assert len(rows) == 1 and rows[0]['name'] == 'amplifier-module-loop-live'
          assert re.fullmatch('[a-f0-9]{40}', rows[0]['commit'])
          print('loop=' + rows[0]['commit'])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.pins.outputs.loop }}
          path: .ci/default-loop
          fetch-depth: 0
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Run the manual installed-wheel owner, never the live host runtime
        shell: bash
        env:
          DESKTOP_SAFETY: ${{ inputs.desktop_safety }}
          ROOT_GUEST: ${{ inputs.root_guest }}
          INSTALLED_PWA: ${{ inputs.installed_pwa }}
        run: |
          set -o pipefail
          extra=()
          if [[ "$DESKTOP_SAFETY" == true ]]; then extra+=(--desktop-safety); fi
          if [[ "$ROOT_GUEST" == true ]]; then extra+=(--root-guest); fi
          if [[ "$INSTALLED_PWA" == true ]]; then extra+=(--installed-pwa); fi
          python scripts/qualify_default_installed.py run \
            --loop-source "$GITHUB_WORKSPACE/.ci/default-loop" \
            --work "$RUNNER_TEMP/default-installed-inputs" \
            --output "$RUNNER_TEMP/default-installed-evidence" "${extra[@]}" \
            2>&1 | tee "$RUNNER_TEMP/default-installed-adapter.log"
      - name: Retain finite evidence, not private checkout or runtime state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: default-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/default-installed-evidence/
            ${{ runner.temp }}/default-installed-adapter.log
          if-no-files-found: error

name: Update states and stage credential lifetime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-states.yml
      - amplifier_web/update_storage.py
      - amplifier_web/updates.py
      - amplifier_web/app_updates.py
      - amplifier_web/update_health.py
      - amplifier_web/browser_demand.py
      - tests/test_update_stage_keys.py
      - tests/test_update_activation_states.py
      - tests/test_update_retry_recheck.py
      - docs/UPDATES.md
permissions:
  contents: read
jobs:
  linux-update-states:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q -p no:cacheprovider tests/test_update_stage_keys.py tests/test_update_activation_states.py tests/test_update_retry_recheck.py
  native-windows-private-stage-keys-no-skips:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - name: Require real private-file removal and sharing-refusal cases
        shell: pwsh
        run: |
          uv run --no-sync python -c "import os, sys, struct; assert os.name == 'nt'; assert sys.version_info[:2] == (3, 13); assert struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows preflight failed.' }
          uv run --no-sync pytest -q -p no:cacheprovider tests/test_update_stage_keys.py -k native_windows_stage_keys --junitxml=stage-keys.xml
          if ($LASTEXITCODE -ne 0) { throw 'Native stage key removal failed.' }
          uv run --no-sync python -c "import xml.etree.ElementTree as E; suites = E.parse('stage-keys.xml').getroot().findall('testsuite'); assert sum(int(s.get('tests', 0)) for s in suites) == 5; assert not any(int(s.get(k, 0)) for s in suites for k in ('skipped', 'errors', 'failures'))"
          if ($LASTEXITCODE -ne 0) { throw 'All five native cases must run and pass without a skip.' }
      - name: Retain native case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-stage-keys
          path: stage-keys.xml
          if-no-files-found: error
          retention-days: 7

name: Update states and stage credential lifetime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-states.yml
      - amplifier_web/update_storage.py
      # The removal of a stage's files and folders on Windows goes through this boundary (the native job).
      - amplifier_web/windows_files.py
      # A chat's own setup removes its stage's copy of the keys file (the cases use its real preparation).
      - amplifier_web/runtime_profiles.py
      - tests/test_runtime_profile_inputs.py
      - amplifier_web/updates.py
      - amplifier_web/app_updates.py
      - amplifier_web/update_health.py
      - amplifier_web/update_restart.py
      - amplifier_web/browser_demand.py
      - tests/test_update_stage_keys.py
      # A stage holds no copy of the app's config and routing folders, and idle maintenance removes an earlier one.
      - tests/test_update_stage_config.py
      - tests/test_update_stage_config_removal.py
      - tests/test_update_activation_states.py
      - tests/test_update_retry_recheck.py
      - tests/test_update_restart_windows.py
      - tests/test_update_activation_retry.py
      # Two of its cases run the update owner's real pass (tick) with a stand-in owner.
      - tests/test_update_current_health.py
      - docs/UPDATES.md
permissions:
  contents: read
jobs:
  linux-update-states:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q -p no:cacheprovider tests/test_update_stage_keys.py tests/test_update_stage_config.py tests/test_update_stage_config_removal.py tests/test_update_activation_states.py tests/test_update_retry_recheck.py tests/test_update_restart_windows.py tests/test_update_activation_retry.py tests/test_update_current_health.py
  # The job name is kept; it now also runs the two forced-restart cases, the two cases of a
  # chat's own setup that failed, and the eleven cases of the removal of a stage's config copies.
  native-windows-private-stage-keys-no-skips:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - name: Require the real private-file cases and the forced-restart refusal, with no skip
        shell: pwsh
        run: |
          uv run --no-sync python -c "import os, sys, struct; assert os.name == 'nt'; assert sys.version_info[:2] == (3, 13); assert struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows preflight failed.' }
          uv run --no-sync pytest -q -p no:cacheprovider tests/test_update_stage_keys.py tests/test_update_stage_config_removal.py tests/test_update_restart_windows.py -k native_windows --junitxml=stage-keys.xml
          if ($LASTEXITCODE -ne 0) { throw 'A native Windows case failed.' }
          uv run --no-sync python -c "import xml.etree.ElementTree as E; suites = E.parse('stage-keys.xml').getroot().findall('testsuite'); assert sum(int(s.get('tests', 0)) for s in suites) == 20; assert not any(int(s.get(k, 0)) for s in suites for k in ('skipped', 'errors', 'failures'))"
          if ($LASTEXITCODE -ne 0) { throw 'All twenty native cases must run and pass without a skip.' }
      - name: Retain native case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-stage-keys
          path: stage-keys.xml
          if-no-files-found: error
          retention-days: 7

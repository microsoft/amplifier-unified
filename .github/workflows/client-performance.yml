name: Client performance smoke
# Affected PRs and manual diagnosis. Broad browser coverage remains post-release;
# this is not a new required status or a publication dependency.
on:
  pull_request:
    paths:
      - 'components/web-client.source.json'
      - 'scripts/web_client_*.py'
      - 'components/web-client/commands.json'
      - 'amplifier_web/browser_*.py'
      - 'amplifier_web/attention.py'
      - 'amplifier_web/directory_attention.py'
      - 'amplifier_web/history_directory*.py'
      - 'amplifier_web/state_projections.py'
      - 'amplifier_web/shell_modules.py'
      - 'amplifier_web/shell_components.py'
      - 'amplifier_web/state_transport.py'
      - 'amplifier_web/task_continuity.py'
      - 'amplifier_web/server_websocket.py'
      - 'amplifier_web/service.py'
      - 'components/web-client/src/main.jsx'
      - 'tests/web/package.json'
      - 'tests/web/package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/test_browser_demand.py'
      - 'tests/test_attention_demand.py'
      - 'tests/test_browser_task_history.py'
      - 'tests/test_browser_check_runner.py'
      - 'tests/test_state_transport.py'
      - 'tests/fixtures/empty_host_ui_server.py'
      - 'tests/fixtures/configured_browser.py'
      - 'tests/web/browser-chat-pages.mjs'
      - 'components/web-client/src/state-*.js'
      - 'components/web-client/src/view-reporter.js'
      - 'tests/web/client-traffic-browser.mjs'
      - 'components/web-client/tests/state-revision-presentation.test.mjs'
      - 'tests/fixtures/client_traffic_server.py'
      - '.github/workflows/client-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev --group artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tests/web/package-lock.json
            components/web-client.source.json
      - name: Prepare selected client source for host checks
        run: |
          python scripts/web_client_build.py prepare
      - run: |
          npm ci --prefix .build/web-client
          npm ci --prefix tests/web
      - name: Record source and synthetic qualification limits
        run: |
          mkdir -p output/client-performance
          git rev-parse HEAD > output/client-performance/revision.txt
          uv pip freeze > output/client-performance/packages.txt
          echo 'Synthetic source/server and built client; no live provider, installed-wheel or native-startup claim.' > output/client-performance/scope.txt
      - name: Projection and causal observation contracts
        run: >-
          uv run --no-sync pytest -q
          tests/test_browser_demand.py tests/test_browser_task_history.py
          tests/test_state_transport.py tests/test_browser_check_runner.py
          --junitxml=output/client-performance/python.xml
      - name: Presentation and view-report boundaries
        working-directory: .build/web-client
        run: node --test tests/state-revision-presentation.test.mjs tests/state-transport.test.mjs tests/view-reporter.test.mjs
      - name: Notice counts and demanded detail work
        run: >-
          uv run --no-sync pytest -q -s tests/test_attention_demand.py
          --junitxml=output/client-performance/attention.xml
      - run: |
          python scripts/web_client_build.py build
      - run: |
          npx --prefix tests/web playwright install --with-deps chromium
      - name: Observe idle updates, historical growth, panels and reconnect
        env:
          AMPLIFIER_TEST_ARTIFACTS: ${{ github.workspace }}/output/client-performance/browser
        run: |
          node tests/web/client-traffic-browser.mjs
      - name: Retain bounded diagnostics including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: output/client-performance/
          if-no-files-found: warn

name: MCP connector lifecycle
on:
  pull_request:
    paths:
      - 'amplifier_web/smart*'
      - 'amplifier_web/mcp_*'
      - 'amplifier_web/auth.py'
      - 'amplifier_web/server.py'
      - 'tests/test_connector_lifecycle.py'
      - 'tests/fixtures/mcp*'
      - 'tests/fixtures/connectors_ui_server.py'
      - 'frontend/src/smart-tools*'
      - 'frontend/tests/connectors-browser.mjs'
      - '.github/workflows/connectors.yml'
permissions:
  contents: read
jobs:
  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Install the declared host and development dependencies from the lock.
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest tests/test_connector_lifecycle.py tests/test_smart_tools.py tests/test_smart_canvas.py tests/test_auth.py tests/test_server_auth.py -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # Browser coverage is available in browser-checks.yml (manual only).

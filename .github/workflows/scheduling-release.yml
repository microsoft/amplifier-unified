name: Scheduling package
on:
  pull_request:
    paths:
      - components/scheduling/**
      - scripts/scheduling_release.py
      - tests/test_scheduling_release.py
      - .github/workflows/scheduling-release.yml
  workflow_dispatch:
    inputs:
      revision:
        description: Full merged main commit SHA containing the scheduling source to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scheduling-package-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
      version: ${{ steps.selection.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Select exact source and qualify publication controls
        id: selection
        env:
          SELECTED_REVISION: ${{ inputs.revision || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flags=()
          if [ "$EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/scheduling_release.py plan --revision "$SELECTED_REVISION" "${flags[@]}" --output "$GITHUB_OUTPUT"
          uv run --no-project --with 'pytest>=8' python -m pytest -q tests/test_scheduling_release.py
      - name: Build once from selected standalone source
        env:
          SELECTED_REVISION: ${{ steps.selection.outputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir "$RUNNER_TEMP/scheduling-source"
          git archive "$SELECTED_REVISION" components/scheduling | tar -x -C "$RUNNER_TEMP/scheduling-source"
          uv build --sdist --wheel --out-dir "$RUNNER_TEMP/scheduling-dist" "$RUNNER_TEMP/scheduling-source/components/scheduling"
          rm -f "$RUNNER_TEMP/scheduling-dist/.gitignore" # uv output sentinel, not a release asset.
          flags=()
          if [ "$EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/scheduling_release.py seal --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/scheduling-dist" "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduling-distributions
          path: ${{ runner.temp }}/scheduling-dist/*
          if-no-files-found: error
  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scheduling-distributions
          path: ${{ runner.temp }}/scheduling-dist
      - name: Verify original bytes and test the installed wheel outside checkout
        env:
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flags=()
          if [ "$EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/scheduling_release.py verify --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/scheduling-dist" "${flags[@]}"
          uv venv --python 3.13 "$RUNNER_TEMP/scheduling-installed"
          python_path="$RUNNER_TEMP/scheduling-installed/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then python_path="$RUNNER_TEMP/scheduling-installed/Scripts/python.exe"; fi
          uv pip install --python "$python_path" "$RUNNER_TEMP/scheduling-dist/amplifier_scheduling-$PACKAGE_VERSION-py3-none-any.whl[test]"
          mkdir "$RUNNER_TEMP/scheduling-tests"
          git show "$SELECTED_REVISION:components/scheduling/tests/test_policy_store.py" > "$RUNNER_TEMP/scheduling-tests/test_policy_store.py"
          cd "$RUNNER_TEMP/scheduling-tests"
          "$python_path" -I -c 'from pathlib import Path; import sys,amplifier_scheduling; assert Path(amplifier_scheduling.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          "$python_path" -I -m pytest -q test_policy_store.py --junitxml=installed-tests.xml
          uv pip check --python "$python_path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scheduling-installed-${{ matrix.os }}
          path: ${{ runner.temp }}/scheduling-tests/installed-tests.xml
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scheduling-distributions
          path: ${{ runner.temp }}/scheduling-dist
      - name: Publish or verify the exact component release without replacing the app latest
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
        run: python scripts/scheduling_release.py publish --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/scheduling-dist"

name: Windows task after a computer rename
# The app must keep using its own start-at-sign-in task after the computer's
# name changes, and must still refuse a task for another account or with a
# changed action.
#
# The job installs the candidate, lets the real CLI register the real task for
# the runner's account, and lets Task Scheduler start the real app. It then
# changes the NAME of this disposable runner's account domain (the state that a
# computer rename leaves for a stored account name), repeats the start, and
# restores the name in every case.
#
# It is not clean-room acceptance: no setup file, no restart and no sign-in.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-task-after-rename.yml
      - amplifier_web/windows_service.py
      - amplifier_web/windows_task_runtime.py
      - amplifier_web/windows_files.py
      - amplifier_web/windows_jobs.py
      - amplifier_web/windows_launch_guard.py
      - amplifier_web/deployment_service.py
      - amplifier_web/installation_health.py
      - tests/fixtures/windows_task_after_rename_native.py
permissions:
  contents: read
jobs:
  windows-task-after-rename:
    name: Own task accepted after a computer rename
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      UV_NO_BUILD_PACKAGE: amplifier-core
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Preparation is not the subject.
      - name: Build the candidate and install it as the app that the task starts (CI setup only)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'task-after-rename'
          uv build --wheel --out-dir "$base/wheels"
          if ($LASTEXITCODE -ne 0) { throw 'The candidate wheel build failed.' }
          $wheel = @(Get-ChildItem "$base/wheels/*.whl")
          if ($wheel.Count -ne 1) { throw 'Expected exactly one candidate wheel.' }
          uv venv --python (Get-Command python).Source "$base/env"
          if ($LASTEXITCODE -ne 0) { throw 'The app environment was not created.' }
          uv pip install --python "$base/env/Scripts/python.exe" --only-binary amplifier-core $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'The candidate installation failed.' }
          "TASK_PYTHON=$base/env/Scripts/python.exe" >> $env:GITHUB_ENV
      # A failed or refused step fails the job. Nothing here can skip.
      - name: Start the app from its task, rename the account domain, start again, refuse changed tasks
        timeout-minutes: 10
        shell: pwsh
        env:
          AMPLIFIER_RENAME_THIS_RUNNERS_ACCOUNT_DOMAIN: '1'
        run: |
          & $env:TASK_PYTHON -I -B tests/fixtures/windows_task_after_rename_native.py run
          if ($LASTEXITCODE -ne 0) { throw 'The task-after-rename check failed; inspect result.json.' }
      - name: Restore the account-domain name and remove the task, the test account and the folder
        if: ${{ always() && env.TASK_PYTHON != '' }}
        timeout-minutes: 4
        shell: pwsh
        env:
          AMPLIFIER_RENAME_THIS_RUNNERS_ACCOUNT_DOMAIN: '1'
        run: |
          & $env:TASK_PYTHON -I -B tests/fixtures/windows_task_after_rename_native.py cleanup
          if ($LASTEXITCODE -ne 0) { throw 'The account-domain name was not restored.' }
      - name: Retain the bounded results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-task-after-rename
          path: |
            ${{ runner.temp }}/task-after-rename-evidence/result.json
            ${{ runner.temp }}/task-after-rename-evidence/cleanup.json
          if-no-files-found: warn
          retention-days: 7

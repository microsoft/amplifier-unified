name: AHP ACP distribution fixtures
on:
  pull_request:
    paths:
      - 'distribution/**'
      - 'components/**'
      - '.github/workflows/ahp-acp-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'distribution/**'
      - 'components/**'
      - '.github/workflows/ahp-acp-distribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-fixtures:
    name: Public artifact composition (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact component archive identities
        run: python3 scripts/verify-artifacts.py
      - run: npm ci --ignore-scripts
      - name: Exercise local protocol fixtures
        run: npm test
      - name: Pack public composition
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: State acceptance boundary
        run: |
          echo 'This lane runs protocol fixtures. Optional installed Python, actual providers, browser/device and deployment gates require their separate receipts.' >> "$GITHUB_STEP_SUMMARY"
  feedback-owner:
    name: Installed feedback owner (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install independent feedback owner
        run: python -m pip install ./components/feedback-capability/python
      - name: Verify durable delivery and disclosure fixtures
        run: python -I -m unittest discover -s components/feedback-capability/python/tests -v
      - run: npm ci --ignore-scripts --prefix distribution
      - name: Verify installed owner and immutable upload transport
        run: |
          FEEDBACK_PYTHON="$(command -v python)" \
          FEEDBACK_RESOURCES_MODULE="$GITHUB_WORKSPACE/distribution/node_modules/@amplifier/unified-resources-capability/src/index.js" \
          node --test components/feedback-capability/test/owner.test.mjs

name: Remote test origins
on:
  pull_request:
    paths:
      - 'amplifier_web/test_origin_*.py'
      - 'amplifier_web/registered_test_runners.py'
      - 'amplifier_web/test_environment_configs.py'
      - 'tests/test_remote_test_origins.py'
      - '.github/workflows/remote-test-origins.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-origin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8,<9' 'filelock>=3.20,<4'
      - name: Check origin snapshot, private receipts and target routing without a local runner
        run: python -m pytest -q tests/test_remote_test_origins.py --junitxml=origin-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-origin-${{ matrix.os }}
          path: origin-results.xml

name: Remote test origins
on:
  pull_request:
    paths:
      - 'amplifier_web/test_origin_*.py'
      - 'amplifier_web/registered_test_runners.py'
      - 'amplifier_web/test_runner_routing.py'
      - 'amplifier_web/test_queue.py'
      - 'amplifier_web/test_runner_enrollment.py'
      - 'amplifier_web/managed_runner_qualification.py'
      - 'amplifier_web/test_runner_controller.py'
      - 'tests/test_runner_enrollment*.py'
      - 'tests/test_runner_routing.py'
      - 'tests/test_registered_test_runner_queue.py'
      - 'amplifier_web/test_environment_configs.py'
      - 'tests/test_remote_test_origins.py'
      - '.github/workflows/remote-test-origins.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  portable-origin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=8,<9' 'filelock>=3.20,<4' 'pyyaml>=6.0.3,<7'
      - name: Check origin snapshot, private receipts and target routing without a local runner
        run: python -m pytest -q tests/test_remote_test_origins.py tests/test_runner_enrollment_origin.py --junitxml=origin-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remote-origin-${{ matrix.os }}
          path: origin-results.xml

  queue-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - name: Check queued routing across approved machines
        run: uv run --no-sync pytest -q tests/test_runner_routing.py tests/test_registered_test_runner_queue.py tests/test_runner_enrollment.py tests/test_registered_test_runner_recovery.py --junitxml=routing-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: queue-routing
          path: routing-results.xml

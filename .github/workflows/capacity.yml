name: Task capacity contracts
on:
  pull_request:
    paths:
      - 'amplifier_web/capacity.py'
      - 'amplifier_web/execution*.py'
      - 'amplifier_web/history_revision.py'
      - 'amplifier_web/runtime*.py'
      - 'amplifier_web/task_continuity.py'
      - 'amplifier_web/service.py'
      - 'frontend/src/capacity.jsx'
      - 'frontend/src/runtime-settings.jsx'
      - 'tests/test_capacity.py'
      - 'tests/fixtures/capacity_ui_server.py'
      - 'frontend/tests/capacity-browser.mjs'
      - '.github/workflows/capacity.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest tests/test_capacity.py tests/test_execution.py tests/test_execution_events.py tests/test_task_continuity.py tests/test_runtime.py -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # Browser coverage is available in browser-checks.yml (manual only).

name: Task capacity contracts
on:
  pull_request:
    paths:
      - 'amplifier_web/capacity.py'
      - 'amplifier_web/execution*.py'
      - 'amplifier_web/history_revision.py'
      - 'amplifier_web/runtime*.py'
      - 'amplifier_web/response_completion.py'
      - 'tests/test_response_completion.py'
      - 'amplifier_web/task_continuity.py'
      - 'amplifier_web/service.py'
      - 'frontend/src/capacity.jsx'
      - 'frontend/src/runtime-settings.jsx'
      - 'tests/test_capacity.py'
      - 'tests/fixtures/capacity_ui_server.py'
      - 'frontend/tests/capacity-browser.mjs'
      - '.github/workflows/capacity.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest tests/test_capacity.py tests/test_execution.py tests/test_execution_events.py tests/test_task_continuity.py tests/test_runtime.py tests/test_response_completion.py tests/test_session_fork.py -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      # Browser coverage is available in browser-checks.yml (manual only).

name: Work profile integration contract
on:
  pull_request:
    paths:
      - 'scripts/work_profile/**'
      - '.github/workflows/work-profile.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/work_profile/**'
      - '.github/workflows/work-profile.yml'
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # This contract test uses a synthetic external bundle and public packages.
      # It does not need access to private repositories or provider credentials.
      - run: uv venv /tmp/work-profile-tests
      - run: uv pip install --python /tmp/work-profile-tests/bin/python pytest pytest-asyncio 'amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main'
      - run: /tmp/work-profile-tests/bin/python -m pytest -q scripts/work_profile/tests

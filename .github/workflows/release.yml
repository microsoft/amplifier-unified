name: Publish application release
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - amplifier_web/__init__.py
      - .github/workflows/release.yml
      - scripts/release.py
      - scripts/release_qualification.py
      - scripts/qualify_host_dependencies.py
  workflow_dispatch:
    inputs:
      release_revision:
        description: Full merged commit SHA to qualify and publish; blank selects this main commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      candidate: ${{ steps.candidate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Resolve immutable release target
        id: release
        env:
          SELECTED_RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release.py scripts/release_qualification.py "$RUNNER_TEMP/release-tools/"
          python "$RUNNER_TEMP/release-tools/release.py" plan --revision "$SELECTED_RELEASE_REVISION" --output "$GITHUB_OUTPUT"
      - name: Pin the verified selected commit
        env:
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: git checkout --detach "$RELEASE_REVISION"
      - name: Resolve current installed host dependencies once
        run: |
          uv sync --locked --group dev --group artifacts
          uv run --no-sync python scripts/qualify_host_dependencies.py --evidence "$RUNNER_TEMP/host-resolution"
      - name: Bind the selected app and resolved host graph
        id: candidate
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" candidate --evidence "$RUNNER_TEMP/host-resolution" --output "$GITHUB_OUTPUT"
      - name: Share qualification tools from this workflow revision
        uses: actions/upload-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
          if-no-files-found: error
      - name: Retain selected candidate and qualified host dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
          if-no-files-found: ignore
  python:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
      - name: Restore and verify the exact candidate host graph
        run: |
          python "$RUNNER_TEMP/release-tools/release_qualification.py" verify-candidate --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE"
          uv sync --locked --group dev --group artifacts
          uv pip install --python .venv/bin/python --overrides "$RUNNER_TEMP/host-resolution/qualified-overrides.txt" --requirements "$RUNNER_TEMP/host-resolution/qualified-overrides.txt"
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
      - name: Validate Python
        run: uv run --no-sync pytest -q
      - name: Build and verify distributions
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
          uv build
          python "$RUNNER_TEMP/release-tools/release.py" verify --version "$RELEASE_VERSION"
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" --overrides "$RUNNER_TEMP/host-resolution/qualified-overrides.txt" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/release-smoke/bin/python" -I -c 'from amplifier_web.app_updates import PROBE; exec(PROBE)'
      - name: Bind tested distributions to the candidate
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" receipt --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --lane python --destination "$RUNNER_TEMP/python.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: python-qualification
          path: ${{ runner.temp }}/python.json
          if-no-files-found: error
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
      - name: Restore and verify the exact candidate host graph
        run: |
          python "$RUNNER_TEMP/release-tools/release_qualification.py" verify-candidate --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE"
          uv sync --locked --group dev --group artifacts
          uv pip install --python .venv/bin/python --overrides "$RUNNER_TEMP/host-resolution/qualified-overrides.txt" --requirements "$RUNNER_TEMP/host-resolution/qualified-overrides.txt"
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend and committed assets
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- amplifier_web/static
      - name: Install browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check active-client latency and state transport
        working-directory: frontend
        run: |
          npm run test:active-client-performance-browser
          npm run test:state-transport-browser
      - name: Verify candidate module source validation
        if: ${{ hashFiles('frontend/tests/registry-validation-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:registry-browser
      - name: Verify first launch with empty storage
        if: ${{ hashFiles('frontend/tests/empty-host-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:empty-host-browser
      - name: Verify draft-first chat setup and composer controls
        working-directory: frontend
        run: npm run test:new-chat-browser
      - name: Verify new-chat recovery and submission drafts
        working-directory: frontend
        run: |
          npm run test:new-chat-recovery-browser
          node tests/feedback-browser.mjs
          node tests/feedback-followup-browser.mjs
      - name: Restored composer readiness
        working-directory: frontend
        run: |
          npm run test:composer-readiness-browser
          npm run test:composer-primary-action-browser
      - name: Verify live surface awareness and draft checkpoints
        working-directory: frontend
        run: npm run test:surface-context-browser
      - name: Verify shared Work workflow controls
        if: ${{ hashFiles('frontend/tests/desktop-readiness-browser.mjs', 'frontend/tests/memory-personalization-browser.mjs', 'frontend/tests/publishing-browser.mjs', 'frontend/tests/portability-browser.mjs') != '' }}
        working-directory: frontend
        run: |
          node tests/desktop-readiness-browser.mjs
          node tests/memory-personalization-browser.mjs
          node tests/publishing-browser.mjs
          node tests/portability-browser.mjs
      - name: Verify settings navigation and retained capabilities
        working-directory: frontend
        run: |
          npm run test:settings-browser
          npm run test:settings-completeness-browser
          npm run test:settings-collections-browser
          npm run test:settings-mobile-browser
      - name: Verify complete themes and saved appearance startup
        working-directory: frontend
        run: |
          npm run test:themes-browser
          npm run test:appearance-startup-browser
          npm run test:appearance-library-browser
      - name: Verify review during a pending send
        if: ${{ hashFiles('frontend/tests/review-during-send-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:review-during-send-browser
      - name: Verify action content and execution detail loading
        working-directory: frontend
        run: |
          npm run test:execution-browser
          npm run test:execution-actions-browser
      - name: Verify stable navigation and workspace drill-in
        if: ${{ hashFiles('frontend/tests/navigation-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:navigation-browser
      - name: Verify pending message delivery and editing
        working-directory: frontend
        run: |
          npm run test:message-outbox-browser
          npm run test:message-delivery-browser
      - name: Verify embedded HTML audio and video playback
        working-directory: frontend
        run: npm run test:canvas-media-browser
      - name: Verify canvas toolbar and app options
        if: ${{ hashFiles('frontend/tests/app-toolbar-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:toolbar-browser
      - name: Verify embedded tool visibility acknowledgements
        working-directory: frontend
        run: npm run test:smart-tools-browser
      - name: Verify validated shell component controls
        working-directory: frontend
        run: npm run test:shell-components-browser
      - name: Verify responsive navigation and immediate Canvas visibility
        working-directory: frontend
        run: npm run test:mobile-navigation-browser
      - name: Verify cached-source update reporting
        if: ${{ hashFiles('frontend/tests/cache-usage-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:cache-usage-browser
      - name: Verify bundle selection and scoped defaults
        working-directory: frontend
        run: npm run test:bundle-browser
      - name: Verify drafts survive rapid chat switching
        if: ${{ hashFiles('frontend/tests/draft-switch-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:draft-switch-browser
      - name: Verify history paging in live conversations
        working-directory: frontend
        run: npm run test:live-history-browser
      - name: Verify multiple active clients at large library size
        working-directory: frontend
        run: |
          npm run test:live-clients-browser
          npm run test:active-client-performance-browser
      - name: Verify composer ownership and explicit takeover
        working-directory: frontend
        run: npm run test:ownership-browser
      - name: Verify unsaved artifact edits survive navigation
        if: ${{ hashFiles('frontend/tests/canvas-dirty-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:canvas-dirty-browser
      - name: Verify shared conversation surfaces and isolation
        working-directory: frontend
        run: npm run test:canvas-apps-browser
      - name: Verify shared drawing, resize and save recovery
        working-directory: frontend
        run: npm run test:canvas-drawing-browser
      - name: Verify conversation diagnosis and recovery
        if: ${{ hashFiles('frontend/tests/session-health-browser.mjs') != '' }}
        working-directory: frontend
        run: |
          npm run test:session-health-browser
          node tests/session-health-browser.mjs --context-limit
          node tests/session-health-browser.mjs --context-limit --active-worker
          node tests/session-health-browser.mjs --module-failure
      - name: Verify activity feedback and dismissal
        if: ${{ hashFiles('frontend/tests/activity-feedback-browser.mjs') != '' }}
        working-directory: frontend
        run: npm run test:activity-feedback-browser
      - name: Record browser qualification for this candidate
        run: |
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
          python "$RUNNER_TEMP/release-tools/release_qualification.py" receipt --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --lane browser --destination "$RUNNER_TEMP/browser.json"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-qualification
          path: ${{ runner.temp }}/browser.json
          if-no-files-found: error
  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
      - name: Restore and verify the exact candidate host graph
        run: |
          python "$RUNNER_TEMP/release-tools/release_qualification.py" verify-candidate --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE"
          uv sync --locked --group dev --group artifacts
          uv pip install --python .venv/bin/python --overrides "$RUNNER_TEMP/host-resolution/qualified-overrides.txt" --requirements "$RUNNER_TEMP/host-resolution/qualified-overrides.txt"
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
      - name: Resolve declared private runtime dependency
        id: runtime-dependency
        run: |
          python -c 'import tomllib; p=tomllib.load(open("amplifier_web/runtime_deps/pyproject.toml", "rb")); print("revision=" + p["tool"]["uv"]["sources"]["amplifier-module-loop-live"]["rev"])' >> "$GITHUB_OUTPUT"
      - name: Check out loop-live with its dedicated read-only key
        uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-module-loop-live
          ref: ${{ steps.runtime-dependency.outputs.revision }}
          path: .ci/loop-live
          ssh-key: ${{ secrets.LOOP_LIVE_CI_READ_KEY }}
          persist-credentials: false
      - name: Check out the community recipe contract
        uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-bundle-recipes
          ref: main
          path: .ci/recipes
          persist-credentials: false
      - name: Resolve fresh runtime sources before selecting any build cache
        run: |
          python -m pip install maturin
          python "$RUNNER_TEMP/release-tools/release_qualification.py" runtime-project --runtime "$RUNNER_TEMP/surface-runtime"
          uv add --project "$RUNNER_TEMP/surface-runtime" --frozen --editable "$GITHUB_WORKSPACE/.ci/loop-live"
          uv add --project "$RUNNER_TEMP/surface-runtime" --frozen pytest pytest-asyncio 'amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate'
          uv lock --project "$RUNNER_TEMP/surface-runtime" --refresh --upgrade
      - name: Identify exact sources, Python ABI, platform and build toolchain
        id: runtime-cache
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" cache-key --runtime "$RUNNER_TEMP/surface-runtime" --output "$GITHUB_OUTPUT"
      - name: Restore only the matching runtime build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/runtime-build-cache
          key: ${{ steps.runtime-cache.outputs.key }}
      - name: Install the frozen resolved runtime
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/runtime-build-cache
        run: |
          uv sync --project "$RUNNER_TEMP/surface-runtime" --locked
          python "$RUNNER_TEMP/release-tools/release_qualification.py" runtime-snapshot --runtime "$RUNNER_TEMP/surface-runtime"
          uv cache prune --ci
      - name: Save successful source builds independently of later test results
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/runtime-build-cache
          key: ${{ steps.runtime-cache.outputs.key }}
      - name: Verify surface context and recipe children through Core and loop-live
        run: |
          UNIFIED_RUNTIME_PYTHON="$RUNNER_TEMP/surface-runtime/.venv/bin/python" WARM_RECIPES_PATH="$GITHUB_WORKSPACE/.ci/recipes" "$RUNNER_TEMP/surface-runtime/.venv/bin/python" -m pytest tests/test_app_guidance.py tests/test_host_children.py tests/test_host_components.py tests/test_runtime_module_cache.py -q
      - name: Record the unchanged runtime graph and selected candidate
        run: |
          uv run --no-sync python scripts/qualify_host_dependencies.py --verify --evidence "$RUNNER_TEMP/host-resolution"
          python "$RUNNER_TEMP/release-tools/release_qualification.py" receipt --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --lane runtime --runtime "$RUNNER_TEMP/surface-runtime" --destination "$RUNNER_TEMP/runtime.json"
          cp "$RUNNER_TEMP/surface-runtime/qualified-runtime.json" "$RUNNER_TEMP/qualified-runtime.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-qualification
          path: |
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/qualified-runtime.json
          if-no-files-found: error
      - name: Retain resolved runtime inputs without its environment or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-source-resolution
          path: |
            ${{ runner.temp }}/surface-runtime/uv.lock
            ${{ runner.temp }}/surface-runtime/pyproject.toml
            ${{ runner.temp }}/surface-runtime/build-constraints.txt
            ${{ runner.temp }}/surface-runtime/build-identity.json
          if-no-files-found: ignore
  release:
    needs: [prepare, python, browser, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@v4
        with:
          name: host-source-resolution
          path: ${{ runner.temp }}/host-resolution
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-qualification'
          path: ${{ runner.temp }}/qualification
          merge-multiple: true
      - name: Require all matching qualification receipts and original artifact bytes
        run: python "$RUNNER_TEMP/release-tools/release_qualification.py" verify-receipts --evidence "$RUNNER_TEMP/host-resolution" --candidate "$RELEASE_CANDIDATE" --receipts "$RUNNER_TEMP/qualification" --dist dist
      - name: Publish immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python "$RUNNER_TEMP/release-tools/release.py" publish --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --repository "$RELEASE_REPOSITORY"

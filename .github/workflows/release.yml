name: Publish application release
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - amplifier_web/__init__.py
      - .github/workflows/release.yml
      - scripts/release.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve immutable release target
        id: release
        run: |
          cp scripts/release.py "$RUNNER_TEMP/release.py"
          python "$RUNNER_TEMP/release.py" plan --output "$GITHUB_OUTPUT"
      - name: Use the original commit when resuming an existing tag
        env:
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: git checkout --detach "$RELEASE_REVISION"
      - name: Install build dependencies
        run: |
          python -m pip install uv
          uv sync --locked --group dev
          npm ci --prefix frontend
      - name: Validate Python and frontend
        run: |
          uv run --no-sync pytest -q
          npm test --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- amplifier_web/static
      - name: Verify first launch with empty storage
        if: ${{ hashFiles('frontend/tests/empty-host-browser.mjs') != '' }}
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:empty-host-browser
      - name: Build and verify distributions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv build
          python "$RUNNER_TEMP/release.py" verify --version "$RELEASE_VERSION"
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/release-smoke/bin/python" -I -c 'from amplifier_web.app_updates import PROBE; exec(PROBE)'
      - name: Publish immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python "$RUNNER_TEMP/release.py" publish --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --repository "$RELEASE_REPOSITORY"

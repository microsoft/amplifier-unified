name: Windows path length
# A default Windows PC has long paths off: no file path over 259 characters and
# no new folder over 247. This workflow makes that default visible to CI.
#
# The native job turns LongPathsEnabled off on its own disposable runner, proves
# in a new process that a 260-character path is then refused, and runs the app's
# real session and capture stores under an installation folder of the longest
# path that setup allows. It also runs the app's real update compatibility probe
# in an update stage folder there, with modules from the locked test
# dependencies and no download. It restores the runner's value in every case.
#
# It is not setup-file or clean-account acceptance, and it runs no model turn.
# It is not a whole in-app update: no component is fetched or installed.
#
# A second native job prepares and checks a chat that has its own setup, with
# the app's real preparation: real uv, the worker dependencies, the default
# components from their repositories, the freeze and both probes, below the
# same folder. Two chats with the same setup start together, and one
# preparation is stopped while it runs and started again. It then lists every
# path of that tree and requires that no path which the app or a chat needs
# passes the limit. The list is an artifact. Before that, the job shows with
# a controlled command what a stop and a time limit end, and that the
# launcher's kill-on-close Job ends the rest with the app.
#
# In each new worker environment that job starts the app's decision-catalog
# helper itself, before the app does, and measures that first start. The run's
# page keeps the times. A first start that took longer than the app's time
# limit is a warning there, not a failure: the app's own start then finds
# bytecode and has less to compile. The case requires that its first start
# added bytecode files. A first start that adds none fails there, for a reason
# that is not a path limit (for example, a preparation that already wrote all
# of that bytecode). The docstring of the case says what to do then.
#
# This is the only native job that installs the locked Amplifier Foundation.
# So it also holds a real Foundation session ownership, as a live conversation
# worker does, and requires that the installation folder stays usable.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-path-length.yml
      - amplifier_web/session_files.py
      - amplifier_web/managed_chats.py
      - amplifier_web/presentation_files.py
      - amplifier_web/provider_payloads.py
      - amplifier_web/context_inspection_store.py
      - amplifier_web/host/storage.py
      - amplifier_web/windows_files.py
      - amplifier_web/windows_consumer.py
      # The update stage: where it is, and what its compatibility probe writes.
      - amplifier_web/updates.py
      - amplifier_web/update_probe.py
      - amplifier_web/update_partial.py
      - amplifier_web/installation_runtime.py
      - amplifier_web/runtime_environment.py
      - amplifier_web/host/session.py
      # A chat with its own setup: its preparation, its stage and its check.
      - amplifier_web/runtime_profiles.py
      - amplifier_web/runtime_qualification.py
      - amplifier_web/runtime_deps/**
      - tests/test_windows_chat_setup.py
      # The helper that the chat-setup job starts and measures in each new worker environment.
      - amplifier_web/decision_accounts.py
      - amplifier_web/decision_account_catalog.py
      - tests/test_decision_accounts.py
      # What a stop or a time limit of a preparation command ends, and what the launcher's Job ends.
      - amplifier_web/windows_jobs.py
      - tests/test_windows_stopped_command.py
      - scripts/windows_bootstrap_native.cs
      - docs/design/native-windows-installation.md
      - tests/test_chat_project_names.py
      - tests/test_chat_project_names_service.py
      - tests/test_chat_folder_too_long.py
      - tests/test_windows_path_budget.py
      - tests/test_windows_long_paths_off.py
      - tests/update_stage_probe.py
      - tests/test_update_stage_probe.py
      - tests/test_windows_live_worker_folders.py
      # A dependency change can lengthen a store path (Foundation, loop-live).
      - pyproject.toml
      - uv.lock
permissions:
  contents: read
jobs:
  windows-long-paths-off:
    name: Windows stores with long paths off
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Preparation is not the subject. It runs before the setting changes.
      # The test group holds the test runner and the real loop, context and
      # capture modules that the update probe mounts.
      - name: Install the locked application and test dependencies (CI setup only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --locked --group dev --no-install-project --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed.' }
      - name: Check the chat-folder naming rule on native Windows
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_chat_project_names.py
          if ($LASTEXITCODE -ne 0) { throw 'The chat-folder naming rule failed on native Windows.' }
      # A live conversation worker holds Foundation's session ownership below
      # <installation folder>\ownership. No app or worker starts: the test holds
      # the ownership with the worker's own call, in setup's folder layout.
      - name: Hold a real Foundation session ownership and change the folders around it
        shell: pwsh
        env:
          # A skipped case would hide the answer; with this it runs and fails instead.
          AMPLIFIER_REQUIRE_LIVE_WORKER_FOLDERS: '1'
        run: |
          .\.venv\Scripts\python.exe -I -c "import importlib.metadata as m, json; print('Installed Foundation revision:', json.loads(m.distribution('amplifier-foundation').read_text('direct_url.json'))['vcs_info']['commit_id'])"
          if ($LASTEXITCODE -ne 0) { throw 'The installed Foundation revision could not be read.' }
          .\.venv\Scripts\python.exe -B -m pytest -q -ra -p no:cacheprovider tests/test_windows_live_worker_folders.py
          if ($LASTEXITCODE -ne 0) { throw 'A held session ownership blocks the installation folder, or its own folders accept an arrival.' }
      - name: Turn Windows long paths off for new processes
        id: long_paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $original = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($null -eq $original) { $original = 'absent' }
          "original=$original" >> $env:GITHUB_OUTPUT
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0 -Type DWord
          if ((Get-ItemProperty -Path $key -Name LongPathsEnabled).LongPathsEnabled -ne 0) { throw 'LongPathsEnabled was not set to 0.' }
          Write-Host "LongPathsEnabled was $original on this runner and is now 0."
      # A new process. A missing limit fails here; it never skips.
      # -rA prints every case by name, and the path lengths that the update-stage cases measured.
      - name: Require the 260-character refusal, then run the real stores and the real update probe under the longest supported folder
        shell: pwsh
        env:
          AMPLIFIER_REQUIRE_LONG_PATHS_OFF: '1'
        run: |
          .\.venv\Scripts\python.exe -B -m pytest -q -rA -p no:cacheprovider tests/test_windows_long_paths_off.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows path-length checks failed with long paths off.' }
      - name: Restore the runner's long-path setting
        if: ${{ always() && steps.long_paths.outputs.original != '' }}
        shell: pwsh
        env:
          ORIGINAL: ${{ steps.long_paths.outputs.original }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          if ($env:ORIGINAL -eq 'absent') {
            Remove-ItemProperty -Path $key -Name LongPathsEnabled
          } else {
            Set-ItemProperty -Path $key -Name LongPathsEnabled -Value ([int]$env:ORIGINAL) -Type DWord
          }
          $now = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($null -eq $now) { $now = 'absent' }
          if ("$now" -ne $env:ORIGINAL) { throw "LongPathsEnabled is $now; the runner had $env:ORIGINAL." }
          Write-Host "LongPathsEnabled is restored to $env:ORIGINAL (read back: $now)."
  windows-chat-setup:
    name: A chat's own setup and the whole tree with long paths off
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install the locked application and test dependencies (CI setup only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --locked --group dev --no-install-project --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed.' }
      # A controlled command, open process handles, no download: a stop and a time limit end the command
      # that the app started; a program that the command started runs on; the launcher's kill-on-close Job
      # ends it with the app, and without that Job it outlives the app. Four cases must pass: a skipped
      # case ends with exit code 0.
      - name: Stop a preparation command, let one reach its time limit, and end the app in the launcher's Job
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m pytest -q -rA -p no:cacheprovider tests/test_windows_stopped_command.py | Tee-Object -Variable lines
          if ($LASTEXITCODE -ne 0) { throw 'A stop or a time limit did not end the command, or the Job did not end what the command started.' }
          if (-not ($lines -match '(^|\s)4 passed')) { throw 'Not all four cases ran.' }
      # The app's own start of its decision-catalog helper, with a real helper that does not end. The start
      # returns at its time limit, and the helper is ended. The interpreter is the python.exe of an
      # environment that uv made, as a worker environment has it.
      - name: Let the app's start of a decision-catalog helper that does not end reach its time limit
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m pytest -q -rA -p no:cacheprovider "tests/test_decision_accounts.py::test_a_catalog_helper_that_does_not_end_is_ended_at_the_limit" | Tee-Object -Variable lines
          if ($LASTEXITCODE -ne 0) { throw 'The start of a helper that does not end did not return at its time limit, or the helper was not ended.' }
          if (-not ($lines -match '(^|\s)1 passed')) { throw 'The case did not run.' }
      - name: Turn Windows long paths off for new processes
        id: long_paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $original = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($null -eq $original) { $original = 'absent' }
          "original=$original" >> $env:GITHUB_OUTPUT
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0 -Type DWord
          if ((Get-ItemProperty -Path $key -Name LongPathsEnabled).LongPathsEnabled -ne 0) { throw 'LongPathsEnabled was not set to 0.' }
          Write-Host "LongPathsEnabled was $original on this runner and is now 0."
      # A new process. The opt-in makes a skip a failure. The preparation downloads
      # the worker dependencies and the default components, as on a person's PC.
      - name: Prepare and check a chat's own setup under the longest supported folder, then list the tree
        shell: pwsh
        env:
          AMPLIFIER_REQUIRE_LONG_PATHS_OFF: '1'
          AMPLIFIER_REQUIRE_CHAT_SETUP: '1'
          AMPLIFIER_CHAT_SETUP_TREE: ${{ runner.temp }}\chat-setup-tree.txt
          AMPLIFIER_CHAT_SETUP_PROVENANCE: ${{ runner.temp }}\chat-setup-provenance.json
        run: |
          # A fact for the times below: whether Windows Defender scans new files on this runner.
          try {
            $defender = Get-MpComputerStatus -ErrorAction Stop
            $scan = "real-time protection $($defender.RealTimeProtectionEnabled), antivirus $($defender.AntivirusEnabled)"
          } catch { $scan = 'its state could not be read' }
          Write-Host "Windows Defender on this runner: $scan"
          # Failure output can contain private attempt/command data. Retain it
          # on this disposable runner only; never stream or upload that body.
          $tests = @'
          import json, os, pathlib, sys
          import pytest
          class ChatResults:
              def __init__(self, source, expected, paths):
                  from _pytest.reports import TestReport
                  self.report_type = TestReport
                  self.source, self.expected, self.paths = source, expected, paths
                  self.nodes, self.collected, self.phases, self.reports = {}, [], [], []
                  self.failures, self.failure_count = [], 0
                  self.collection_seen = self.invalid = self.observer_error = False
                  self.collection_count = self.phase_count = self.collection_errors = 0
              def pytest_collection_finish(self, session):
                  self.invalid |= self.collection_seen
                  self.collection_seen = True
                  counts = {name: 0 for name in self.expected}
                  for item in session.items:
                      self.collection_count += 1
                      name = item.originalname or item.name
                      if (str(item.path) != self.source or name not in counts or
                              item.nodeid in self.nodes or len(self.nodes) >= 128):
                          self.invalid = True
                          continue
                      counts[name] += 1
                      # Function and occurrence ordinals only, never parameter IDs.
                      label = str(list(self.expected).index(name) + 1) + '.' + str(counts[name])
                      self.nodes[item.nodeid] = label
                      self.collected.append(label)
                  self.invalid |= counts != self.expected
              def pytest_collectreport(self, report):
                  if report.failed or report.skipped:
                      self.collection_errors += 1
                      self.invalid = True
              def pytest_runtest_makereport(self, item, call):
                  outcome = yield
                  report = outcome.get_result()
                  if not report.failed and call.excinfo is None:
                      return
                  self.failure_count += 1
                  if len(self.failures) >= 128:
                      self.invalid = True
                      return
                  try:
                      error = call.excinfo.value if call.excinfo is not None else None
                      allowed = {'AssertionError', 'RuntimeError', 'PermissionError', 'OSError',
                          'FileNotFoundError', 'ValueError', 'TypeError', 'KeyError', 'ImportError',
                          'ModuleNotFoundError', 'TimeoutError', 'SystemExit', 'CancelledError', 'Failed'}
                      kind = type(error)
                      name = ('unavailable' if error is None else kind.__name__
                          if kind.__module__ in {'builtins', 'asyncio.exceptions', '_pytest.outcomes'}
                          and kind.__name__ in allowed else 'other')
                      frames, seen, omitted = [], 0, 0
                      trace = error.__traceback__ if error is not None else None
                      while trace is not None and seen < 128:
                          seen += 1
                          location = self.paths.get(os.path.normcase(os.path.abspath(trace.tb_frame.f_code.co_filename)))
                          if location and 0 < trace.tb_lineno <= location[1] and len(frames) < 16:
                              frames.append([location[0], trace.tb_lineno])
                          else:
                              omitted += 1
                          trace = trace.tb_next
                      self.failures.append({'case': self.nodes.get(item.nodeid, 'unknown'),
                          'phase': call.when if call.when in ('setup', 'call', 'teardown') else 'other',
                          'type': name, 'frames': frames, 'omittedFrames': omitted,
                          'traceTruncated': trace is not None})
                  except Exception:
                      self.observer_error = True
                  # Never format messages/locals/longrepr or replace the report.
              def row(self, report):
                  return [self.nodes.get(report.nodeid, 'unknown'),
                      report.when if report.when in ('setup', 'call', 'teardown') else 'other',
                      report.outcome if report.outcome in ('passed', 'failed', 'skipped') else 'other',
                      hasattr(report, 'wasxfail'), type(report) is self.report_type]
              def pytest_runtest_logreport(self, report):
                  self.phase_count += 1
                  if len(self.phases) >= 384:
                      self.invalid = True
                      return
                  try:
                      self.invalid |= any(report is previous for previous in self.reports)
                      self.phases.append(self.row(report))
                      self.reports.append(report)
                  except Exception:
                      self.observer_error = True
              def snapshot(self, code):
                  final = [self.row(report) for report in self.reports]
                  ordered = [str(group) + '.' + str(ordinal)
                      for group, count in enumerate(self.expected.values(), 1)
                      for ordinal in range(1, count + 1)]
                  expected = [[case, phase, 'passed', False, True]
                              for case in self.collected for phase in ('setup', 'call', 'teardown')]
                  passed = (code == 0 and self.collection_seen and not self.invalid and
                      not self.observer_error and not self.collection_errors and not self.failure_count and
                      self.collection_count == sum(self.expected.values()) and self.collected == ordered and
                      self.phase_count == len(expected) and self.phases == final == expected)
                  return {'schema': 1, 'pytestExitCode': int(code), 'passed': passed,
                      'collectionObserved': self.collection_seen, 'collectionCount': self.collection_count,
                      'expectedCount': sum(self.expected.values()), 'collectionErrors': self.collection_errors,
                      'caseNames': list(self.expected), 'collected': self.collected,
                      'phases': self.phases, 'finalPhases': final, 'phaseCount': self.phase_count,
                      'omittedPhases': self.phase_count - len(self.phases),
                      'failures': self.failures, 'failureCount': self.failure_count,
                      'omittedFailures': self.failure_count - len(self.failures),
                      'invalid': self.invalid, 'observerError': self.observer_error}
          def save_summary(path, value):
              try:
                  raw = json.dumps(value)
                  assert len(raw.encode('utf-8')) <= 524288
                  path.write_text(raw, encoding='utf-8')
                  return True
              except (OSError, ValueError, TypeError, AssertionError):
                  return False
          def finish(selected, code, path):
              try:
                  value = selected.snapshot(code)
              except Exception:
                  value = {'schema': 1, 'pytestExitCode': int(code), 'passed': False, 'observerError': True}
              saved = save_summary(path, value)
              # An evidence failure must not replace pytest's original nonzero exit.
              return int(code) if code else (0 if saved and value['passed'] else 1)
          expected = {
              'test_provenance_files_are_bounded_and_never_export_source_locations': 5,
              'test_observed_probe_preserves_actual_call_outcome_and_pre_teardown_files': 4,
              'test_observed_probe_keeps_original_anonymous_retry_and_two_attempts': 2,
              'test_malformed_probe_facts_do_not_mask_original_failure_or_encode_private_payload': 10,
              'test_native_provenance_keeps_original_path_cancel_and_private_output_boundaries': 1,
              'test_the_programs_of_a_sign_in_session_are_not_processes_of_a_preparation_that_got_their_parents_id': 1,
              'test_the_line_of_a_session_program_says_what_has_its_parents_id_now': 1,
              'test_a_program_that_gets_the_id_of_an_ended_member_is_not_that_member_and_what_it_starts_is_no_member': 1,
              'test_what_names_the_id_of_an_ended_member_and_was_created_after_the_list_without_it_is_no_child': 1,
              'test_a_child_of_the_program_that_has_the_id_now_is_not_a_child_of_the_member_that_had_it': 1,
              'test_a_program_with_the_creation_time_of_the_program_that_got_the_members_id_is_not_a_child_of_the_member': 1,
              'test_a_program_that_a_list_took_for_a_child_is_no_member_when_a_later_list_shows_what_had_the_id': 1,
              'test_a_list_that_holds_a_member_again_shows_that_it_runs': 1,
              'test_what_a_member_starts_after_a_list_that_did_not_hold_it_is_not_found': 1,
              'test_without_a_creation_time_the_rule_knows_only_the_id': 1,
              'test_a_row_without_a_creation_time_with_the_id_of_a_member_that_runs_is_that_member': 1,
              'test_a_row_without_a_creation_time_shows_nothing_about_an_ended_member_that_has_one': 1,
              'test_a_row_without_a_creation_time_is_taken_for_an_ended_member_with_its_id_that_has_none_either': 1,
              'test_another_process_with_the_members_id_and_no_later_creation_time_shows_that_the_member_ended_before_the_read': 1,
              'test_the_wait_for_the_first_line_of_a_program_ends_when_the_program_prints_none': 1,
              'test_a_process_of_the_preparation_is_still_found_after_its_parent_ended': 1,
              'test_the_real_list_has_the_creation_time_of_each_process_and_finds_what_a_started_program_starts': 1,
              'test_a_chat_with_its_own_setup_is_prepared_and_checked_under_the_longest_installation_folder': 1,
          }
          source = pathlib.Path('tests/test_windows_chat_setup.py').absolute()
          paths = {}
          for ordinal, name in enumerate((
                  'tests/test_windows_chat_setup.py', 'tests/test_windows_long_paths_off.py', 'tests/conftest.py',
                  'amplifier_web/runtime_profiles.py', 'amplifier_web/updates.py', 'amplifier_web/update_probe.py',
                  'amplifier_web/update_diagnostics.py', 'amplifier_web/windows_files.py')):
              path = pathlib.Path(name).absolute()
              paths[os.path.normcase(str(path))] = (ordinal + 1, len(path.read_bytes().splitlines()))
          selected = ChatResults(str(source), expected, paths)
          pytest.hookimpl(hookwrapper=True, tryfirst=True)(ChatResults.pytest_runtest_makereport)
          code = pytest.main(['-q', '-rA', '-p', 'no:cacheprovider', '-p', 'pytest_asyncio.plugin',
                              '-o', 'asyncio_mode=auto', 'tests/test_windows_chat_setup.py'], plugins=[selected])
          raise SystemExit(finish(selected, code, pathlib.Path(os.environ['RUNNER_TEMP']) / 'chat-setup-results.json'))
          '@
          .\.venv\Scripts\python.exe -B -c $tests *> "$env:RUNNER_TEMP/private-chat-setup.log"
          $status = $LASTEXITCODE
          # The first start of the app's decision-catalog helper in each new worker environment, as the case
          # measured it, the creation of the process included. A start that took longer than the app's time
          # limit is a warning: it shows the runner's speed against that limit, and it does not fail the case.
          if ($status -ne 0) { throw 'The setup of a chat was not prepared and checked with long paths off, or a needed path passes the limit.' }
          # A skipped case ends with exit code 0. The case writes the list only after every preparation.
          if (-not (Test-Path -LiteralPath $env:AMPLIFIER_CHAT_SETUP_TREE)) { throw 'The case did not run: it wrote no list of paths.' }
          # Consume only the bounded numeric record, never private pytest output.
          $check = @'
          import json, math, os, pathlib
          path = pathlib.Path(os.environ['AMPLIFIER_CHAT_SETUP_PROVENANCE'])
          with path.open('rb') as stream:
              raw = stream.read(524289)
          assert len(raw) <= 524288
          receipt = json.loads(raw)
          assert receipt['schema'] == 1 and receipt['status'] == 'PASS' and len(receipt['selected']) == 2
          rows = receipt['helperTimings']
          assert type(rows) is list and 0 < len(rows) <= 16
          for row in rows:
              assert set(row) == {'ordinal', 'firstSeconds', 'secondSeconds', 'bytecodeBefore', 'bytecodeAfter', 'limitSeconds'}
              assert all(type(v) in (int, float) and math.isfinite(v) and 0 <= v <= 10**9 for v in row.values())
              assert row['bytecodeAfter'] > row['bytecodeBefore']
              print('MEASURED helper first/second seconds:', row['firstSeconds'], row['secondSeconds'])
              if row['firstSeconds'] > row['limitSeconds']:
                  print("::warning title=Slow first helper start::The measured first start exceeded the app limit.")
          '@
          .\.venv\Scripts\python.exe -I -B -c $check
          if ($LASTEXITCODE -ne 0) { throw 'The closed actual-process provenance or helper measurements are unavailable.' }
      - name: Keep only closed chat-setup test outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-setup-results
          path: ${{ runner.temp }}\chat-setup-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep only closed chat-setup provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-setup-provenance
          path: ${{ runner.temp }}\chat-setup-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep the list of every path
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-setup-tree
          path: ${{ runner.temp }}\chat-setup-tree.txt
          if-no-files-found: error
          retention-days: 30
      - name: Restore the runner's long-path setting
        if: ${{ always() && steps.long_paths.outputs.original != '' }}
        shell: pwsh
        env:
          ORIGINAL: ${{ steps.long_paths.outputs.original }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          if ($env:ORIGINAL -eq 'absent') {
            Remove-ItemProperty -Path $key -Name LongPathsEnabled
          } else {
            Set-ItemProperty -Path $key -Name LongPathsEnabled -Value ([int]$env:ORIGINAL) -Type DWord
          }
          $now = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($null -eq $now) { $now = 'absent' }
          if ("$now" -ne $env:ORIGINAL) { throw "LongPathsEnabled is $now; the runner had $env:ORIGINAL." }
          Write-Host "LongPathsEnabled is restored to $env:ORIGINAL (read back: $now)."
  path-budget:
    name: Path budget and naming rule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      # The budget reads names from the locked Foundation, loop-live and capture hook.
      - name: Check the path budget and the naming rule (other platforms keep the shared name)
        run: uv run --no-sync pytest -q -ra tests/test_windows_path_budget.py tests/test_chat_project_names.py
      # A folder that a person chose, with a path too long for the chat's files: the app's plain answer.
      - name: Check the answer for a folder whose path is too long (the native job checks it against Windows)
        run: uv run --no-sync pytest -q -ra tests/test_chat_folder_too_long.py
      # The same probe fixture as the native job, with this platform's project name.
      - name: Run the real update compatibility probe in a stage folder
        run: uv run --no-sync pytest -q -ra tests/test_update_stage_probe.py
      # Through the real app service: existing chats stay where they are and still open.
      - name: Check that chats keep their history and still open under the naming rule
        run: uv run --no-sync pytest -q -ra tests/test_chat_project_names_service.py

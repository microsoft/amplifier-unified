name: Candidate prepared runtime TEST harness
# Phase one checks source only. Manual native work requires a later explicit
# maintainer nomination of the accepted protected-main H commit AND tree.
on:
  pull_request:
    paths:
      - .github/workflows/prepared-runtime-native.yml
      - scripts/candidate_native_*.py
      - tests/fixtures/candidate_native_adapter.py
      - tests/test_candidate_native_*.py
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact reviewed same-repository candidate C (full SHA; request, not authority)
        type: string
        required: true
      candidate_tree:
        description: Exact reviewed full C tree
        type: string
        required: true
      pr:
        description: Exact open same-repository candidate PR number
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: candidate-prepared-runtime-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # PR-base preservation check, not a hardcoded historical base.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.17'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Run only pure harness negative controls
        env:
          CANDIDATE_HARNESS_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/harness-tools.txt"
          import tomllib
          packages = tomllib.load(open('uv.lock', 'rb'))['package']
          for name in ('pytest', 'pytest-asyncio', 'aiohttp', 'filelock', 'pyyaml', 'httpx', 'packaging', 'jsonschema'):
              row, = [p for p in packages if p['name'] == name]
              print(name + '==' + row['version'])
          PY
          uv pip install --system --only-binary :all: -r "$RUNNER_TEMP/harness-tools.txt"
          mkdir -p output/candidate-native-unit
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q \
            tests/test_candidate_native_harness.py --junitxml=output/candidate-native-unit/junit.xml \
            2>&1 | tee output/candidate-native-unit/pytest.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-native-unit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/candidate-native-unit/
          if-no-files-found: error

  control:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Trusted candidate selection
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently select nominated H and exact C tree
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NOMINATED_H: ${{ vars.CANDIDATE_NATIVE_HARNESS_SHA }}
          NOMINATED_H_TREE: ${{ vars.CANDIDATE_NATIVE_HARNESS_TREE }}
          CANDIDATE: ${{ vars.CANDIDATE_NATIVE_CANDIDATE_SHA }}
          CANDIDATE_TREE: ${{ vars.CANDIDATE_NATIVE_CANDIDATE_TREE }}
          CANDIDATE_PR: ${{ vars.CANDIDATE_NATIVE_CANDIDATE_PR }}
          REQUESTED_C: ${{ inputs.candidate }}
          REQUESTED_C_TREE: ${{ inputs.candidate_tree }}
          REQUESTED_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          mkdir -p output/candidate-admission
          python - <<'PY'
          import json
          from pathlib import Path
          # Even argument parsing/early interruption must leave a non-authorizing record.
          Path('output/candidate-admission/failure.json').write_text(json.dumps({
              'kind': 'nonproduction-candidate-diagnostic', 'phase': 'not-started', 'stage': 'arguments'}))
          PY
          python scripts/candidate_native_control.py issue --root . \
            --harness "$NOMINATED_H" --harness-tree "$NOMINATED_H_TREE" \
            --candidate "$CANDIDATE" --candidate-tree "$CANDIDATE_TREE" --pr "$CANDIDATE_PR" \
            --requested-candidate "$REQUESTED_C" --requested-candidate-tree "$REQUESTED_C_TREE" --requested-pr "$REQUESTED_PR" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output output/candidate-admission/admission.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('output/candidate-admission/admission.json'))['selection']
          print('candidate=' + p['candidate']); print('harness=' + p['harness'])
          PY
      - name: Retain controller admission or early failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/candidate-admission/admission.json
            output/candidate-admission/failure.json
          if-no-files-found: error

  execution:
    needs: control
    name: Candidate Docker execution
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # No secrets, protected write token, control state or persisted credentials.
    # Reviewed C has Docker/code execution on THIS disposable runner only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.control.outputs.harness }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.control.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/amplifier-smart-tool-digital-twin-universe
          ref: 5235833098d9a630791452a46558d92f58af0389
          path: dtu
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/native
      - name: Validate fixed selection before candidate code
        run: python harness/scripts/candidate_native_execution.py preflight --harness harness --candidate candidate --output output/native
      - name: Build and install exact candidate
        run: python harness/scripts/candidate_native_execution.py build --harness harness --candidate candidate --output output/native --core dtu
      - name: Run two sequential prepared profiles
        run: python harness/scripts/candidate_native_execution.py run --harness harness --candidate candidate --output output/native
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/native/
          if-no-files-found: error
          retention-days: 14

  verification:
    needs: [control, execution]
    name: External candidate evidence verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.control.outputs.harness }}
          persist-credentials: false
      - name: Verify independent API provenance and exact two-case evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NOMINATED_H: ${{ vars.CANDIDATE_NATIVE_HARNESS_SHA }}
          NOMINATED_H_TREE: ${{ vars.CANDIDATE_NATIVE_HARNESS_TREE }}
          CANDIDATE: ${{ vars.CANDIDATE_NATIVE_CANDIDATE_SHA }}
          CANDIDATE_TREE: ${{ vars.CANDIDATE_NATIVE_CANDIDATE_TREE }}
          CANDIDATE_PR: ${{ vars.CANDIDATE_NATIVE_CANDIDATE_PR }}
        run: |
          python scripts/candidate_native_control.py verify --internal \
            --harness "$NOMINATED_H" --harness-tree "$NOMINATED_H_TREE" \
            --candidate "$CANDIDATE" --candidate-tree "$CANDIDATE_TREE" --pr "$CANDIDATE_PR" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output output/verified.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-native-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/verified.json
          if-no-files-found: error

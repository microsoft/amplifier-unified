# The fixture answers only requests that carry its synthetic token and whose Host and Origin are
# http://127.0.0.1:8770. Browsers cannot add the header to a WebSocket and the host port varies, so this proxy
# adds the token and presents the fixture's own Host and Origin. The token is a test value from tests/fixtures,
# not a secret; the published port stays on the host's loopback.
worker_processes 1;
pid /tmp/nginx.pid;
daemon off;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Requests without an Origin keep none.
  map $http_origin $fixture_origin { default http://127.0.0.1:8770; '' ''; }

  server {
    listen 8780;
    location / {
      proxy_pass http://127.0.0.1:8770;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8770;
      proxy_set_header Origin $fixture_origin;
      proxy_set_header Authorization "Bearer fixture-browser-control-token";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect http://127.0.0.1:8770/ /;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}

[project]
name = "amplifier-unified"
version = "0.5.1"
description = "A local voice-first Amplifier workspace with a shared user and agent interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.12,<4", "jsonschema>=4.23,<5", "tinycss2>=1.4,<2", "pyyaml>=6.0.3,<7", "filelock>=3.20,<4"]

[project.scripts]
amplifier-unified = "amplifier_web.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_web"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-aiohttp>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

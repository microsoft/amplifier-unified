[project]
name = "amplifier-unified"
version = "0.11.5"
description = "A local voice-first Amplifier workspace with a shared user and agent interface"
readme = "README.md"
requires-python = ">=3.13"
# python-pam imports six but does not declare it in its distribution metadata.
dependencies = [
    "amplifier-core==1.6.1",
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@695f875c0908f45f8dc78b1fcde80ecddebffd7c",
    "aiohttp>=3.12,<4",
    "cryptography>=44,<46",
    "python-pam>=2.0.2,<3",
    "six>=1.16,<2",
    "jsonschema>=4.23,<5",
    "tinycss2>=1.4,<2",
    "pyyaml>=6.0.3,<7",
    "filelock>=3.20,<4",
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
    "amplifier-bundle-context-intelligence[client] @ git+https://github.com/bkrabach/amplifier-bundle-context-intelligence@79a6162253c7f8c66e5d2af7e9c8ffcdf38865dd",
]

[project.scripts]
amplifier-unified = "amplifier_web.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_web"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-aiohttp>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

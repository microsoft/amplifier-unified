[project]
name = "amplifier-unified"
version = "0.90.0"
description = "A local voice-first Amplifier workspace with a shared user and agent interface"
readme = "README.md"
requires-python = ">=3.13"
# python-pam imports six but does not declare it in its distribution metadata.
dependencies = [
    "agent-client-protocol==1.0.0",
    "amplifier-memory @ git+https://github.com/microsoft/amplifier-bundle-memory@main",
    "amplifier-core>=2.0.2",
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
    "amplifier-module-hooks-session-naming @ git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/hooks-session-naming",
    "aiohttp>=3.12,<4",
    "packaging>=24",
    "cryptography>=44,<51",
    "python-pam>=2.0.2,<3",
    "six>=1.16,<2",
    "jsonschema>=4.23,<5",
    "tinycss2>=1.4,<2",
    "pyyaml>=6.0.3,<7",
    "filelock>=4.2.1,<5",
    "qrcode>=8.2,<9",
    "watchfiles>=1.1,<2",
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
    "amplifier-bundle-context-intelligence[client] @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main",
    "amplifier-bundle-ui-use @ git+https://github.com/microsoft/amplifier-bundle-ui-use@main",
]

[project.optional-dependencies]
tui = ["amplifier-app-tui @ git+https://github.com/microsoft/amplifier-app-tui@main"]
native-desktop = ["amplifier-module-tool-computer-use @ git+https://github.com/microsoft/amplifier-bundle-computer-use@main#subdirectory=modules/tool-computer-use", "Pillow>=13,<14"]
managed-browser = ["amplifier-bundle-ui-use[browser] @ git+https://github.com/microsoft/amplifier-bundle-ui-use@main"]
decisions-openai = ["amplifier-module-provider-openai[decisions] @ git+https://github.com/microsoft/amplifier-module-provider-openai@main", "Pillow>=13,<14"]
decisions-azure = ["amplifier-module-provider-azure-openai[decisions] @ git+https://github.com/microsoft/amplifier-module-provider-azure-openai@main"]
decisions-jev = ["amplifier-module-provider-jev @ git+https://github.com/microsoft/amplifier-module-provider-jev@main"]
decisions-local = ["amplifier-module-provider-local-decisions @ git+https://github.com/microsoft/amplifier-module-provider-local-decisions@main"]

[project.scripts]
amplifier-unified = "amplifier_web.cli:main"
amplifier-unified-status = "amplifier_web.status_protocol.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# Produced by the release owner; retained unchanged when rebuilding an sdist.
artifacts = ["/amplifier_web/release-source.json"]

[tool.hatch.build.targets.wheel]
packages = ["amplifier_web", "amplifier_operations", "amplifier_kernels", "components/scheduling/amplifier_scheduling", "amplifier_recall", "components/outputs/amplifier_outputs", "components/worktrees/amplifier_worktrees", "components/publishing/amplifier_publishing", "components/portability/amplifier_portability"]
# Standalone projects share these same runtime sources; test/build inputs do not ship.
exclude = [
    "/amplifier_kernels/tests/**", "/amplifier_kernels/build/**",
    "/amplifier_kernels/dist/**", "/amplifier_kernels/.venv/**",
    "/amplifier_kernels/*.egg-info/**", "/amplifier_kernels/pyproject.toml",
    "/amplifier_kernels/MANIFEST.in", "/amplifier_kernels/LICENSE",
    "/amplifier_kernels/.gitignore", "/amplifier_kernels/README.md",
    "/amplifier_operations/tests/**", "/amplifier_operations/build/**",
    "/amplifier_operations/dist/**", "/amplifier_operations/.venv/**",
    "/amplifier_operations/*.egg-info/**", "/amplifier_operations/pyproject.toml",
    "/amplifier_operations/MANIFEST.in", "/amplifier_operations/LICENSE",
    "/amplifier_operations/.gitignore", "/amplifier_operations/README.md",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/amplifier_kernels/build/**", "/amplifier_kernels/dist/**",
    "/amplifier_kernels/.venv/**", "/amplifier_kernels/*.egg-info/**",
    "/.ci/**", "/components/web-client/**",
    "/amplifier_operations/build/**", "/amplifier_operations/dist/**",
    "/amplifier_operations/.venv/**", "/amplifier_operations/*.egg-info/**",
    "/components/scheduling/build/**", "/components/scheduling/dist/**",
    "/components/scheduling/.venv/**", "/components/scheduling/*.egg-info/**",
    "/components/publishing/build/**", "/components/publishing/dist/**",
    "/components/publishing/.venv/**", "/components/publishing/*.egg-info/**",
    "/components/worktrees/build/**", "/components/worktrees/dist/**",
    "/components/worktrees/.venv/**", "/components/worktrees/*.egg-info/**",
    "/components/portability/build/**", "/components/portability/dist/**",
    "/components/portability/.venv/**", "/components/portability/*.egg-info/**",
    "/components/outputs/build/**", "/components/outputs/dist/**",
    "/components/outputs/.venv/**", "/components/outputs/*.egg-info/**",
]

[tool.hatch.build.targets.wheel.force-include]
"bundle.yaml" = "amplifier_web/bundle_data/bundle.yaml"
"behaviors" = "amplifier_web/bundle_data/behaviors"
"context" = "amplifier_web/bundle_data/context"
"skills" = "amplifier_web/bundle_data/skills"
"docs/shell" = "amplifier_web/bundle_data/docs/shell"
# Bound independently buildable packages: local dependencies and artifacts never ship.
"packages/shell-sdk/index.js" = "amplifier_web/bundle_data/packages/shell-sdk/index.js"
"packages/shell-sdk/index.d.ts" = "amplifier_web/bundle_data/packages/shell-sdk/index.d.ts"
"packages/shell-sdk/package.json" = "amplifier_web/bundle_data/packages/shell-sdk/package.json"
"packages/shell-sdk/README.md" = "amplifier_web/bundle_data/packages/shell-sdk/README.md"
"packages/shell-sdk/LICENSE" = "amplifier_web/bundle_data/packages/shell-sdk/LICENSE"
"examples/shell-navigator" = "amplifier_web/bundle_data/examples/shell-navigator"
"examples/shell-reader" = "amplifier_web/bundle_data/examples/shell-reader"
"examples/shell-controls/index.js" = "amplifier_web/bundle_data/examples/shell-controls/index.js"
"examples/shell-controls/manifest.json" = "amplifier_web/bundle_data/examples/shell-controls/manifest.json"
"examples/shell-controls/README.md" = "amplifier_web/bundle_data/examples/shell-controls/README.md"
"examples/shell-controls/package.json" = "amplifier_web/bundle_data/examples/shell-controls/package.json"
"examples/shell-controls/build.mjs" = "amplifier_web/bundle_data/examples/shell-controls/build.mjs"

[tool.uv]
# Core publishes native wheels; never compile it while installing this app.
no-build-package = ["amplifier-core"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8", "pytest-asyncio>=0.25", "pytest-aiohttp>=1.1", "hatchling>=1.27",
    # Offline native-input fixtures use the real loop/context, not a fake mount.
    # Candidate graph: lifetime-bound execution and observation-only idle callbacks.
    "amplifier-module-loop-live @ git+https://github.com/microsoft/amplifier-module-loop-live@022a54eeb343a568ccd717abf2a67c55431fdf58",
    # Real finite/resumed/persistent custody checks use the selected Foundation tool.
    "amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@05082c89a171758f8d0fb9d8df630ea581e5bdb5#subdirectory=modules/tool-delegate",
    # Match context-managed's authored source; uv.lock records the exact test
    # revision without imposing a resolver-global runtime source override.
    "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main",
    # Qualified upstream recovery API; provider stays on the existing locked
    # source shared with the optional decisions extra.
    "amplifier-module-context-managed @ git+https://github.com/microsoft/amplifier-bundle-context-managed@12166f8effb5e26737bb5f9f7885cbb9bd4cdf43#subdirectory=modules/context-managed",
    "amplifier-module-provider-openai[native] @ git+https://github.com/microsoft/amplifier-module-provider-openai@main",
    # Same real QuickJS dispatcher used by the maintained native-check workflow.
    "amplifier-module-tool-exec @ git+https://github.com/microsoft/amplifier-module-tool-exec@f267548ccd1b38a236a46afb96252bb6dd474dcd",
    # Ordinary-root switch fixtures retain the real local capture hook offline.
    "amplifier-module-hook-context-intelligence @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@a80ce69d0e96e9a343501f238dcd867350dd9aa2#subdirectory=modules/hook-context-intelligence",
    # Installed skills checks exercise the real loader and companion-file tool.
    "amplifier-module-tool-skills @ git+https://github.com/microsoft/amplifier-bundle-skills@2f58408a879535df36da5c92d2b073f49271ade4#subdirectory=modules/tool-skills",
    "amplifier-module-tool-filesystem @ git+https://github.com/microsoft/amplifier-module-tool-filesystem@663f26a878ae71e136f439fa73ded52b2eb24174",
    # File-policy checks must execute the real patch engines, not skip at import.
    "amplifier-module-tool-apply-patch @ git+https://github.com/microsoft/amplifier-bundle-filesystem@515599f0d0763a946aa96ed1d0110db723f5c386#subdirectory=modules/tool-apply-patch",
    "amplifier-module-tool-image @ git+https://github.com/microsoft/amplifier-bundle-imagegen@8acd3773102b77378c0d46da53a901f8297a38fc#subdirectory=modules/tool-image",
    "amplifier-module-hooks-candidate-guard @ git+https://github.com/microsoft/amplifier-bundle-converge@da7dd8878c9e7b672e86151b32d59c0cce68bcb6#subdirectory=modules/hooks-candidate-guard",
]
artifacts = ["python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4", "reportlab>=4,<5", "pypdf>=6,<7", "Pillow>=13,<14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "amplifier_kernels/tests", "components/scheduling/tests", "amplifier_operations/tests", "components/publishing/tests", "components/worktrees/tests", "components/portability/tests", "components/outputs/tests"]

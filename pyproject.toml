[project]
name = "amplifier-unified"
version = "0.18.0"
description = "A local voice-first Amplifier workspace with a shared user and agent interface"
readme = "README.md"
requires-python = ">=3.13"
# python-pam imports six but does not declare it in its distribution metadata.
dependencies = [
    "amplifier-core==1.6.1",
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@3796a32351d32a93ccbb5e230c9ffe02964db42e",
    "aiohttp>=3.12,<4",
    "cryptography>=44,<46",
    "python-pam>=2.0.2,<3",
    "six>=1.16,<2",
    "jsonschema>=4.23,<5",
    "tinycss2>=1.4,<2",
    "pyyaml>=6.0.3,<7",
    "filelock>=3.20,<4",
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
    "amplifier-bundle-context-intelligence[client] @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@9d9759d6357ffc99fdbfb9e040136996b6c4ca9c",
]

[project.scripts]
amplifier-unified = "amplifier_web.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_web"]

[tool.hatch.build.targets.wheel.force-include]
"bundle.yaml" = "amplifier_web/bundle_data/bundle.yaml"
"behaviors" = "amplifier_web/bundle_data/behaviors"
"context" = "amplifier_web/bundle_data/context"
"skills" = "amplifier_web/bundle_data/skills"
"docs/shell" = "amplifier_web/bundle_data/docs/shell"
"packages/shell-sdk" = "amplifier_web/bundle_data/packages/shell-sdk"
"examples/shell-navigator" = "amplifier_web/bundle_data/examples/shell-navigator"
"examples/shell-reader" = "amplifier_web/bundle_data/examples/shell-reader"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-aiohttp>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

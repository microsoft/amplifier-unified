[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-scheduling"
version = "0.1.0"
description = "Recurrence policy and durable schedule admission receipts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["amplifier_scheduling"]
package-dir = {amplifier_scheduling = "."}
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "amplifier-work-acceptance"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "amplifier-core>=2.0.1",
  "amplifier-unified",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
  "amplifier-module-loop-live @ git+https://github.com/microsoft/amplifier-module-loop-live@main",
  "amplifier-module-context-managed @ git+https://github.com/microsoft/amplifier-bundle-context-managed@main#subdirectory=modules/context-managed",
  "amplifier-module-tool-transcript @ git+https://github.com/microsoft/amplifier-bundle-context-managed@main#subdirectory=modules/tool-transcript",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai@main",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic@main",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
browser = ["playwright>=1.55,<2"]

[tool.uv]
# Core publishes native wheels; never compile it while installing this app.
no-build-package = ["amplifier-core"]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
amplifier-unified = { path = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

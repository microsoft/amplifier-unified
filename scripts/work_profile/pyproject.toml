[project]
name = "amplifier-work-acceptance"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "amplifier-core==1.6.1",
  "amplifier-unified",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@3796a32351d32a93ccbb5e230c9ffe02964db42e",
  "amplifier-module-loop-live @ git+https://github.com/bkrabach/amplifier-module-loop-live@de307c398facea5d4d656e14f84938a74b934ff2",
  "amplifier-module-context-managed @ git+https://github.com/microsoft/amplifier-bundle-context-managed@5b0816edb8761dc0ad38719ae59b4ee40808b36a#subdirectory=modules/context-managed",
  "amplifier-module-tool-transcript @ git+https://github.com/microsoft/amplifier-bundle-context-managed@5b0816edb8761dc0ad38719ae59b4ee40808b36a#subdirectory=modules/tool-transcript",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai@c9b0e8e60702269c7a637875b89d011facfde020",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic@12fffb6ad2bafb1bb7999ab02245a35e42ca8672",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
browser = ["playwright>=1.55,<2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
amplifier-unified = { path = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
